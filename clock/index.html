<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Clock v49.0 | NICT Precision Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #fbbf24;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(20px);
            --bg-default: #0f172a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; min-height: 100vh; background: var(--bg-default); font-family: 'Outfit', sans-serif; color: var(--text-main); overflow-x: hidden; display: flex; flex-direction: column; transition: background 3s ease; }
        main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 1.5rem; }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; flex-wrap: wrap; gap: 10px; }
        .control-group { display: flex; gap: 0.5rem; align-items: center; }
        .btn-mini { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-mini:hover { background: rgba(255,255,255,0.15); }
        .btn-active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }

        .glass-box { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 2rem; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6); }
        .main-display { position: relative; padding: clamp(2rem, 8vh, 4rem) 1rem; text-align: center; overflow: hidden; transition: background 2s ease; }
        
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            z-index: 10;
            position: relative;
            text-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .chime-flash { animation: flash-text 1.2s ease-out; }
        .countdown-pulse { animation: countdown-pulse-anim 0.4s ease-out; }

        @keyframes flash-text {
            0% { color: var(--accent); text-shadow: 0 0 60px var(--accent); transform: scale(1.05); }
            100% { color: inherit; text-shadow: 0 0 40px rgba(0,0,0,0.8); transform: scale(1); }
        }
        @keyframes countdown-pulse-anim {
            0% { transform: scale(1.02); color: var(--accent); }
            100% { transform: scale(1); color: inherit; }
        }

        .label-main { font-size: 0.7rem; font-weight: 800; opacity: 0.6; letter-spacing: 0.2em; margin-bottom: 0.5rem; color: var(--accent); }
        #digital-time { font-size: clamp(3.5rem, 15vw, 9rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; }
        #digital-date { font-size: clamp(0.8rem, 2vw, 1.1rem); font-weight: 300; letter-spacing: 0.3em; margin-top: 1rem; opacity: 0.8; }

        .world-monitor {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            z-index: 10;
            position: relative;
        }
        .world-card {
            background: rgba(0,0,0,0.3);
            padding: 18px;
            border-radius: 1.5rem;
            border: 1px solid var(--glass-border);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .world-card:hover { background: rgba(255,255,255,0.05); transform: translateY(-5px); }
        .world-card.selected { border-color: var(--accent); box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
        .world-label { font-size: 0.65rem; font-weight: 800; opacity: 0.6; letter-spacing: 0.1em; display: block; margin-bottom: 8px; color: var(--accent); }
        .world-time { font-family: 'Share Tech Mono', monospace; font-size: 1.6rem; font-weight: 700; color: #fff; }

        .sync-indicator { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.6rem; font-weight: 800; opacity: 0.6; z-index: 20; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; transition: background 0.3s; }
        .dot.synced { background: #10b981; box-shadow: 0 0 10px #10b981; }
        .dot.syncing { background: #fbbf24; animation: pulse-blink 1s infinite; }
        
        @keyframes pulse-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .astro-details { margin-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; font-size: 0.75rem; font-weight: 700; }
        .astro-item { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; border-left: 1px solid rgba(255,255,255,0.1); }
        .astro-item:first-child { border-left: none; }

        footer { width: 100%; padding: 2rem 0; text-align: center; font-size: 0.7rem; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <main>
        <div class="dashboard-header">
            <div class="control-group">
                <button class="btn-mini" id="lang-btn" onclick="toggleLang()">JPN</button>
                <button class="btn-mini" id="fs-btn" onclick="toggleFullscreen()">全画面</button>
                <button class="btn-mini" id="sync-now-btn" onclick="syncWithNICT()">NICT同期</button>
            </div>
            <div class="control-group">
                <span id="lbl-chime-pat" style="font-size: 0.6rem; font-weight: 800; opacity: 0.5;">時報設定:</span>
                <button class="btn-mini chime-opt" id="chime-off" onclick="setChimeMode('off')">オフ</button>
                <button class="btn-mini chime-opt" id="chime-hourly" onclick="setChimeMode('hourly')">毎時</button>
                <button class="btn-mini chime-opt" id="chime-minutely" onclick="setChimeMode('minutely')">毎分</button>
            </div>
        </div>

        <div class="glass-box main-display" id="main-sky">
            <div id="sync-status" class="sync-indicator">
                <div id="sync-dot" class="dot"></div>
                <span id="sync-label">NICT待機中</span>
            </div>
            
            <div class="clock-container" id="clock-core">
                <div class="label-main" id="lbl-title">TOKYO (JST)</div>
                <div id="digital-time">--:--:--</div>
                <div id="digital-date">----/--/--</div>
            </div>

            <div class="world-monitor">
                <div class="world-card selected" onclick="setBaseCity(9, 'TOKYO (JST)', this)">
                    <span class="world-label">TOKYO (JST)</span>
                    <div id="time-tokyo" class="world-time">--:--:--</div>
                </div>
                <div class="world-card" onclick="setBaseCity(0, 'LONDON (GMT)', this)">
                    <span class="world-label">LONDON (GMT)</span>
                    <div id="time-london" class="world-time">--:--:--</div>
                </div>
                <div class="world-card" onclick="setBaseCity(-5, 'NEW YORK (EST)', this)">
                    <span class="world-label">NEW YORK (EST)</span>
                    <div id="time-ny" class="world-time">--:--:--</div>
                </div>
                <div class="world-card" onclick="setBaseCity(0, 'UTC (UNIVERSAL)', this)">
                    <span class="world-label">UTC (世界標準時)</span>
                    <div id="time-tai" class="world-time">--:--:--</div>
                </div>
            </div>
            
            <div class="astro-details">
                <div class="astro-item"><span class="astro-label" id="lbl-loc">現在地</span><span id="loc-val">スキャン中...</span></div>
                <div class="astro-item"><span class="astro-label" id="lbl-age">月齢</span><span id="age-val">--.-</span></div>
                <div class="astro-item"><span class="astro-label" id="lbl-offset">同期方式</span><span id="sync-method">Initializing...</span></div>
                <div class="astro-item"><span class="astro-label" id="lbl-sun">日の出 / 日入り</span><span id="sun-val">--:-- / --:--</span></div>
            </div>
        </div>
    </main>

    <footer>Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</footer>
    
    <script>
        const D2R = Math.PI/180, R2D = 180/Math.PI;
        
        // --- Accurate Time State ---
        // baseOffset: (サーバー時刻 - ローカル時刻) を保持して誤差を補正する
        let baseTimeOffset = 0; 
        let lastSyncTime = 0;
        
        let currentLang = 'jp';
        let userLat = 35.6895, userLng = 139.6917;
        let chimeMode = 'off';
        let lastChimeTrigger = -1; 
        let currentBaseOffset = 9; 

        const L10N = {
            en: { 
                age: "MOON AGE", sun: "SUNRISE / SUNSET", 
                status_waiting: "NICT READY", status_syncing: "SYNCING...", status_synced: "NICT SYNCED",
                chimePat: "CHIME:", offset: "SYNC SOURCE",
                chimeOff: "OFF", chimeH: "1H", chimeM: "1M", fs: "FULL", sync: "NICT SYNC", loc: "LOCATION"
            },
            jp: { 
                age: "月齢", sun: "日の出 / 日入り", 
                status_waiting: "NICT待機中", status_syncing: "同期中...", status_synced: "NICT同期完了",
                chimePat: "時報設定:", offset: "同期元",
                chimeOff: "オフ", chimeH: "毎時", chimeM: "毎分", fs: "全画面", sync: "NICT同期", loc: "現在地"
            }
        };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        window.addEventListener('mousedown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        /**
         * NICTのHTTP時刻供給サービスを使用して時刻同期を行う
         * https://jjy.nict.go.jp/tsp/PubNtp/index.html
         */
        async function syncWithNICT() {
            const dot = document.getElementById('sync-dot');
            const label = document.getElementById('sync-label');
            const method = document.getElementById('sync-method');
            
            dot.className = 'dot syncing';
            label.textContent = L10N[currentLang].status_syncing;
            
            const nictUrl = "https://ntp-a1.nict.go.jp/cgi-bin/json";
            const startFetch = performance.now();
            
            try {
                // NICT JSON API Fetch
                const response = await fetch(nictUrl);
                if (!response.ok) throw new Error('Network Error');
                
                const data = await response.json();
                const endFetch = performance.now();
                
                // 通信遅延（往復時間 / 2）を計算して補正
                const rtt = (endFetch - startFetch) / 1000;
                const serverTimeSec = data.st; // NICTから返る秒単位の時刻
                const serverTimeMs = (serverTimeSec + rtt) * 1000;
                
                const localNow = Date.now();
                baseTimeOffset = serverTimeMs - localNow;
                
                dot.className = 'dot synced';
                label.textContent = L10N[currentLang].status_synced;
                method.textContent = "NICT (Japan Standard Time)";
                lastSyncTime = localNow;
                
                console.log(`NICT Sync Success. Offset: ${baseTimeOffset.toFixed(2)}ms, RTT: ${(rtt*1000).toFixed(2)}ms`);
            } catch (err) {
                console.warn("NICT Sync Failed, falling back to Local Clock:", err);
                dot.className = 'dot';
                label.textContent = "Sync Failed";
                method.textContent = "Local Clock (Precision Mode)";
            }
        }

        function playChime(type) {
            if (!audioCtx || chimeMode === 'off') return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const clock = document.getElementById('clock-core');
            if (type === 'announcement') {
                [440, 880].forEach(f => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 1.2);
                });
                clock.classList.add('chime-flash');
                setTimeout(() => clock.classList.remove('chime-flash'), 1200);
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.1);
                clock.classList.add('countdown-pulse');
                setTimeout(() => clock.classList.remove('countdown-pulse'), 400);
            }
        }

        function setChimeMode(mode) {
            chimeMode = mode;
            document.querySelectorAll('.chime-opt').forEach(btn => btn.classList.remove('btn-active'));
            document.getElementById(`chime-${mode}`).classList.add('btn-active');
            initAudio();
        }

        function setBaseCity(offset, label, el) {
            currentBaseOffset = offset;
            document.getElementById('lbl-title').textContent = label;
            document.querySelectorAll('.world-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function getFmtTime(date) {
            return `${String(date.getUTCHours()).padStart(2, '0')}:${String(date.getUTCMinutes()).padStart(2, '0')}:${String(date.getUTCSeconds()).padStart(2, '0')}`;
        }

        function update() {
            // NICTのオフセットを加味した「本当の」現在時刻(UTC)
            const currentTrueUTC = Date.now() + baseTimeOffset;
            
            // タイムゾーン調整
            const baseDate = new Date(currentTrueUTC + (currentBaseOffset * 3600000));
            
            // メイン表示
            document.getElementById('digital-time').textContent = getFmtTime(baseDate);
            document.getElementById('digital-date').textContent = `${baseDate.getUTCFullYear()}/${String(baseDate.getUTCMonth() + 1).padStart(2, '0')}/${String(baseDate.getUTCDate()).padStart(2, '0')}`;

            // 世界時計 (すべてオフセットを適用)
            document.getElementById('time-tokyo').textContent = getFmtTime(new Date(currentTrueUTC + 32400000));
            document.getElementById('time-london').textContent = getFmtTime(new Date(currentTrueUTC));
            document.getElementById('time-ny').textContent = getFmtTime(new Date(currentTrueUTC - 18000000));
            document.getElementById('time-tai').textContent = getFmtTime(new Date(currentTrueUTC));

            // 時報ロジック
            const currentTS = Math.floor(currentTrueUTC / 1000);
            if (lastChimeTrigger !== currentTS) {
                const curM = baseDate.getUTCMinutes();
                const curS = baseDate.getUTCSeconds();
                if ((chimeMode === 'minutely' || (chimeMode === 'hourly' && curM === 59)) && curS >= 57 && curS <= 59) playChime('countdown');
                if (curS === 0 && (chimeMode === 'minutely' || (chimeMode === 'hourly' && curM === 0))) playChime('announcement');
                lastChimeTrigger = currentTS;
            }

            // 天文・背景
            const moon = getMoonData(currentTrueUTC);
            document.getElementById('age-val').textContent = moon.age.toFixed(1);
            const hNum = baseDate.getUTCHours() + baseDate.getUTCMinutes()/60 + baseDate.getUTCSeconds()/3600;
            const localAstro = getSunTimesPrecise(userLat, userLng, currentTrueUTC, currentBaseOffset);
            const fmtSun = (val) => val === null ? "--:--" : `${String(Math.floor(val)).padStart(2,'0')}:${String(Math.floor((val%1)*60)).padStart(2,'0')}`;
            document.getElementById('sun-val').textContent = `${fmtSun(localAstro.sr)} / ${fmtSun(localAstro.ss)}`;
            document.getElementById('main-sky').style.backgroundImage = getSkyColor(hNum, localAstro.sr, localAstro.ss);

            // 10分おきに自動再同期（バックグラウンド）
            if (Date.now() - lastSyncTime > 600000) {
                syncWithNICT();
            }

            requestAnimationFrame(update);
        }

        function getMoonData(utcMs) {
            const lp = 2551443 * 1000; 
            const newMoon = new Date(Date.UTC(1970, 0, 7, 20, 35, 0)).getTime();
            const phase = ((utcMs - newMoon) % lp) / lp;
            const norm = phase < 0 ? phase + 1 : phase;
            return { age: norm * 29.53, phase: norm };
        }

        function getSunTimesPrecise(lat, lng, utcMs, offset) {
            const date = new Date(utcMs);
            const dayOfYear = Math.floor((utcMs - new Date(Date.UTC(date.getUTCFullYear(), 0, 1))) / 86400000) + 1;
            const gamma = 2 * Math.PI / 365 * (dayOfYear - 1 + (date.getUTCHours() - 12) / 24);
            const eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma) - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
            const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma);
            const cosH = (Math.cos(90.833 * D2R) / (Math.cos(lat * D2R) * Math.cos(decl)) - Math.tan(lat * D2R) * Math.tan(decl));
            if (cosH > 1 || cosH < -1) return { sr: null, ss: null };
            const ha = Math.acos(cosH) * R2D;
            return { 
                sr: ((720 - 4 * (lng + ha) - eqtime) / 60 + offset + 24) % 24, 
                ss: ((720 - 4 * (lng - ha) - eqtime) / 60 + offset + 24) % 24 
            };
        }

        function getSkyColor(h, sr, ss) {
            if (sr === null) return 'linear-gradient(to bottom, #020617, #0f172a)';
            if (h < sr - 1 || h > ss + 1) return 'linear-gradient(to bottom, #020617, #0f172a)';
            if (h >= sr - 1 && h < sr) return 'linear-gradient(to bottom, #1e1b4b, #fb923c)';
            if (h >= sr && h < ss) return 'linear-gradient(to bottom, #0ea5e9, #bae6fd)';
            if (h >= ss && h <= ss + 1) return 'linear-gradient(to bottom, #f97316, #312e81)';
            return 'linear-gradient(to bottom, #020617, #0f172a)';
        }

        function toggleLang() { 
            currentLang = currentLang === 'jp' ? 'en' : 'jp'; 
            document.getElementById('lang-btn').textContent = currentLang === 'jp' ? 'JPN' : 'ENG'; 
            const d = L10N[currentLang];
            document.getElementById('lbl-age').textContent = d.age; document.getElementById('lbl-sun').textContent = d.sun; 
            document.getElementById('lbl-offset').textContent = d.offset; document.getElementById('sync-now-btn').textContent = d.sync;
            document.getElementById('lbl-chime-pat').textContent = d.chimePat; document.getElementById('chime-off').textContent = d.chimeOff;
            document.getElementById('chime-hourly').textContent = d.chimeH; document.getElementById('chime-minutely').textContent = d.chimeM;
            document.getElementById('fs-btn').textContent = d.fs; document.getElementById('lbl-loc').textContent = d.loc;
            document.getElementById('sync-label').textContent = d.status_waiting;
        }

        function toggleFullscreen() { 
            if(!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.onload = () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            syncWithNICT();
            update();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    userLat = p.coords.latitude; userLng = p.coords.longitude;
                    document.getElementById('loc-val').textContent = `📍 ${userLat.toFixed(2)}, ${userLng.toFixed(2)}`;
                }, () => { document.getElementById('loc-val').textContent = "📍 Tokyo (Def)"; });
            }
        };
    </script>
</body>
</html>
