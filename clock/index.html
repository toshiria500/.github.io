<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Clock v63.0 | 究極の日本標準時</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #38bdf8;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg-default: #020617;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            height: 100vh;
            width: 100vw;
            background: var(--bg-default); 
            color: var(--text-main); 
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* スクロールを禁止して見切れを防ぐよぉ */
            position: relative;
        }
        
        /* 背景の輝き */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e3a8a 0%, transparent 70%);
            opacity: 0.4;
            z-index: -1;
        }

        /* メインコンテナを画面の高さに合わせてリサイズ */
        .main-container {
            width: 90%;
            max-width: 800px;
            max-height: 85vh; /* 画面の高さの85%以内に収めるねっ */
            padding: clamp(1.5rem, 5vh, 3rem) 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 4rem;
            text-align: center;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0.1em;
            margin-bottom: clamp(1rem, 4vh, 2rem);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
        .dot.active { background: #10b981; box-shadow: 0 0 12px #10b981; }

        #clock-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(3.5rem, 15vh, 10rem); /* 高さに合わせてフォントサイズが縮むよぉ */
            line-height: 1;
            margin-bottom: 0.5rem;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to bottom, #fff 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #clock-date {
            font-size: clamp(0.9rem, 3vh, 1.4rem);
            font-weight: 400;
            letter-spacing: 0.2em;
            opacity: 0.9;
            margin-bottom: clamp(1rem, 4vh, 3rem);
        }
        .day { color: var(--accent); font-weight: 800; margin-left: 0.5rem; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            border-top: 1px solid var(--glass-border);
            padding-top: clamp(1rem, 4vh, 2rem);
            width: 100%;
        }
        .info-item span { display: block; font-size: 0.65rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 800; }
        .info-item strong { font-size: clamp(0.8rem, 2vh, 1rem); color: #fff; font-family: 'Outfit', sans-serif; }

        .btn-sync {
            margin-top: clamp(1rem, 4vh, 2.5rem);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-sync:hover { 
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* フッターを画面最下部に固定するねっ */
        footer {
            width: 100%;
            max-width: 800px;
            padding: 1rem;
            font-size: 0.6rem;
            color: var(--text-dim);
            text-align: center;
            letter-spacing: 0.05em;
        }
        .notice {
            margin-bottom: 8px;
            line-height: 1.4;
            opacity: 0.6;
            text-align: center; /* PCで見やすいように中央揃えにするよぉ */
            font-size: 0.55rem;
        }
        .copyright {
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
        }

        /* 画面がめちゃくちゃ低い時用の微調整 */
        @media (max-height: 500px) {
            .main-container { padding: 1rem; border-radius: 2rem; }
            #clock-date { margin-bottom: 0.5rem; }
            .btn-sync { margin-top: 0.5rem; }
            .info-grid { padding-top: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="main-container">
        <div class="sync-badge">
            <div id="status-dot" class="dot"></div>
            <span id="status-text">未同期</span>
        </div>

        <div id="clock-time">00:00:00</div>
        <div id="clock-date">----年--月--日 <span class="day">----</span></div>

        <div class="info-grid">
            <div class="info-item"><span>ズレ補正 / OFFSET</span><strong id="val-offset">0ms</strong></div>
            <div class="info-item"><span>通信遅延 / RTT</span><strong id="val-rtt">0ms</strong></div>
            <div class="info-item"><span>現在地 / LOCATION</span><strong id="val-location">取得中...</strong></div>
        </div>

        <button class="btn-sync" onclick="syncAll()">時刻を再同期</button>
    </div>

    <footer>
        <div class="notice">
            ※ NICTによる時刻供給終了(2022/03/31)に伴い、独自のクラウド同期アルゴリズムを採用しています。
        </div>
        <div>日本標準時 (JST) モード | PRECISION SYNC ACTIVE</div>
        <div class="copyright">COPYRIGHT &copy; 2026 TOSHIRIA ALL RIGHTS RESERVED.</div>
    </footer>

    <script>
        let globalOffset = 0;

        async function syncAll() {
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            statusDot.classList.remove('active');
            statusText.textContent = "同期中...";

            const samples = [];
            const syncEndpoints = [
                "https://worldtimeapi.org/api/timezone/Asia/Tokyo",
                "https://timeapi.io/api/Time/current/zone?timeZone=Asia/Tokyo"
            ];

            for (let endpoint of syncEndpoints) {
                try {
                    for (let i = 0; i < 2; i++) {
                        const t1 = performance.now();
                        const response = await fetch(endpoint, { cache: "no-store" });
                        if (!response.ok) continue;
                        const data = await response.json();
                        const t2 = performance.now();
                        const rtt = t2 - t1;
                        
                        let serverMs = data.unixtime ? data.unixtime * 1000 : new Date(data.dateTime).getTime();
                        const nowOnServer = serverMs + (rtt / 2);
                        const offset = nowOnServer - Date.now();
                        samples.push({ offset, rtt });
                    }
                } catch (e) { console.warn("Sync failed", e); }
            }

            if (samples.length > 0) {
                samples.sort((a, b) => a.rtt - b.rtt);
                globalOffset = samples[0].offset;
                statusDot.classList.add('active');
                statusText.textContent = "日本標準時と同期済み";
                document.getElementById('val-offset').textContent = (globalOffset >= 0 ? "+" : "") + Math.round(globalOffset) + "ms";
                document.getElementById('val-rtt').textContent = Math.round(samples[0].rtt) + "ms";
            } else {
                statusText.textContent = "同期エラー";
            }
        }

        async function updateLocation() {
            const locText = document.getElementById('val-location');
            if (!navigator.geolocation) { locText.textContent = "取得不可"; return; }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&zoom=10&addressdetails=1`, {
                        headers: { 'Accept-Language': 'ja' }
                    });
                    const data = await res.json();
                    const addr = data.address;
                    locText.textContent = (addr.province || addr.state || "") + " " + (addr.city || addr.town || addr.village || "");
                } catch (e) { locText.textContent = "取得エラー"; }
            }, () => { locText.textContent = "許可が必要だよぉ"; });
        }

        function update() {
            const now = new Date(Date.now() + globalOffset);
            document.getElementById('clock-time').textContent = now.toTimeString().split(' ')[0];
            const days = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
            document.getElementById('clock-date').innerHTML = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 <span class="day">${days[now.getDay()]}</span>`;
            requestAnimationFrame(update);
        }

        window.onload = () => {
            syncAll();
            updateLocation();
            update();
            setInterval(syncAll, 900000);
        };
    </script>
</body>
</html>
