<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Clock v23 | Precise Time & Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #fbbf24;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(20px);
            --bg-default: #0f172a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; min-height: 100vh;
            background: var(--bg-default);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex; flex-direction: column;
            transition: background 3s ease;
        }

        main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 2rem; }

        .glass-box {
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 2rem;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6);
        }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }

        .status-pill {
            display: flex; align-items: center; gap: 0.5rem; background: rgba(0, 0, 0, 0.3);
            padding: 0.5rem 1rem; border-radius: 999px; font-size: 0.7rem; font-weight: 800; border: 1px solid var(--glass-border);
        }

        .signal-indicator { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
        .signal-bar { width: 3px; background: rgba(255,255,255,0.2); border-radius: 1px; }
        .signal-bar.active { background: var(--accent); }

        .btn-mini {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
            padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .btn-mini:hover { background: rgba(255,255,255,0.15); }

        .main-display { position: relative; padding: clamp(3rem, 10vh, 7rem) 1rem; text-align: center; overflow: hidden; }

        #digital-time {
            font-family: 'Share Tech Mono', monospace; font-size: clamp(4.5rem, 18vw, 11rem);
            line-height: 1; z-index: 10; position: relative; text-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        #digital-date { font-size: clamp(1rem, 3vw, 1.5rem); font-weight: 300; letter-spacing: 0.3em; margin-top: 1rem; opacity: 0.8; z-index: 10; position: relative; }

        .astro-details {
            margin-top: 2rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem;
            font-size: 0.8rem; font-weight: 700; opacity: 0.9; z-index: 10; position: relative; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .celestial-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .celestial-object { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); transition: left 1s ease, bottom 1s ease; }
        .sun { width: 60px; height: 60px; background: radial-gradient(circle, #fff7ed 0%, #fbbf24 50%, #f59e0b 100%); box-shadow: 0 0 60px #fbbf24, 0 0 120px rgba(251, 191, 36, 0.4); }
        .moon { width: 50px; height: 50px; background: #111; overflow: hidden; box-shadow: inset -2px -2px 5px rgba(255,255,255,0.1), 0 0 20px rgba(255,255,255,0.1); }
        .moon-fixed { position: absolute; top:0; width: 50%; height: 100%; background: #fff; display: none; }
        .moon-term { position: absolute; top:0; left:0; width: 100%; height: 100%; background: #fff; border-radius: 50%; }

        /* Cityscape シルエット */
        .cityscape-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 90px; z-index: 3; pointer-events: none; }
        .cityscape-svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .cityscape-path { fill: rgba(0, 0, 0, 0.15); transition: fill 2s ease; }
        .window-grid { fill: #fbbf24; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .window-pulse { animation: window-flicker var(--d) infinite alternate; }
        @keyframes window-flicker { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }

        .world-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; width: 100%; }
        .world-card { padding: 1.5rem; text-align: center; position: relative; overflow: hidden; transition: transform 0.3s; }
        .world-card:hover { transform: translateY(-5px); }
        .world-city { font-size: 0.85rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
        .world-time { font-family: 'Share Tech Mono', monospace; font-size: 1.8rem; margin: 0.3rem 0; color: var(--accent); }
        .world-date { font-size: 0.7rem; opacity: 0.6; }

        footer { width: 100%; padding: 2rem; text-align: center; font-size: 0.75rem; color: var(--text-dim); background: rgba(0,0,0,0.2); border-top: 1px solid var(--glass-border); margin-top: 2rem; }

        .ripple { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: none; animation: ripple-anim 2s ease-out forwards; }
        @keyframes ripple-anim { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 400%; height: 400%; opacity: 0; } }

        @media (max-width: 600px) {
            .world-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
            .dashboard-header { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <main>
        <div class="dashboard-header">
            <div style="display:flex; gap:0.5rem;">
                <div class="status-pill">
                    <div class="signal-indicator" id="signal-bars">
                        <div class="signal-bar active"></div><div class="signal-bar active"></div><div class="signal-bar active"></div>
                    </div>
                    <span id="sync-status">STABILIZING</span>
                </div>
                <button class="btn-mini" id="lang-btn" onclick="toggleLang()">JPN</button>
            </div>
            <div style="font-size:0.6rem; font-weight:900; letter-spacing:0.5em; opacity:0.4;">CHRONOSPHERE HYBRID</div>
            <button class="btn-mini" onclick="toggleFullscreen()">FULLSCREEN</button>
        </div>

        <div class="glass-box main-display" id="main-sky">
            <div class="celestial-stage">
                <div id="sun-main" class="celestial-object sun" style="display:none;"></div>
                <div id="moon-main" class="celestial-object moon" style="display:none;">
                    <div id="moon-fixed-main" class="moon-fixed"></div>
                    <div id="moon-term-main" class="moon-term"></div>
                </div>
            </div>

            <div id="digital-time">--:--:--</div>
            <div id="digital-date">----/--/--</div>

            <div class="astro-details">
                <span id="loc-label">📍 -</span>
                <span id="age-label">AGE: --.-</span>
                <span id="sr-label">↑ --:--</span>
                <span id="ss-label">↓ --:--</span>
            </div>

            <div class="cityscape-container">
                <svg class="cityscape-svg" viewBox="0 0 500 90" preserveAspectRatio="none">
                    <path class="cityscape-path" d="M0,90 L0,60 L10,60 L10,40 L30,40 L30,30 L50,30 L50,55 L70,55 L70,45 L100,45 L100,20 L130,20 L130,50 L160,50 L160,10 L200,10 L200,60 L240,60 L240,35 L280,35 L280,55 L320,55 L320,25 L360,25 L360,50 L400,50 L400,40 L440,40 L440,60 L470,60 L470,50 L500,50 L500,90 Z"></path>
                    <g id="windows-main"></g>
                </svg>
            </div>
            
            <div id="ripple-hook" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
        </div>

        <section id="world-stations">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding:0 10px;">
                <h3 id="world-title" style="margin:0; font-size:0.8rem; opacity:0.5; letter-spacing:0.2em; text-transform:uppercase;">World Stations</h3>
                <button class="btn-mini" onclick="initSync()">SYNC NOW</button>
            </div>
            <div id="world-clocks" class="world-grid"></div>
        </section>
    </main>

    <footer>
        Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.
    </footer>

    <script>
        const LEAP_SECONDS = 37;
        let serverOffset = 0;
        let currentLang = navigator.language.startsWith('ja') ? 'jp' : 'en';
        let geoName = "📍 -", geoLat = 35.7, geoLng = 139.7, lastFullMinute = -1;

        const L10N = {
            en: { world: "World Stations", age: "AGE", sr: "RISE", ss: "SET", accurate: "ACCURATE", syncing: "SYNC ACTIVE", off: "OFFLINE", tai: "ATOMIC TIME" },
            jp: { world: "世界時計 / 観測所", age: "月齢", sr: "日の出", ss: "日の入り", accurate: "同期済み", syncing: "同期中", off: "オフライン", tai: "原子時 (TAI)" }
        };

        const CITY_DATA = [
            { id: "TAI", label: "TAI", tz: "UTC", lat: 0, lng: 0, isTAI: true },
            { id: "UTC", label: "UTC / GMT", tz: "UTC", lat: 0, lng: 0 },
            { id: "NYC", label: "New York", tz: "America/New_York", lat: 40.7, lng: -74.0 },
            { id: "LON", label: "London", tz: "Europe/London", lat: 51.5, lng: -0.1 },
            { id: "SYD", label: "Sydney", tz: "Australia/Sydney", lat: -33.8, lng: 151.2 }
        ];

        function t(key) { return L10N[currentLang][key] || key; }
        function toggleLang() { currentLang = currentLang === 'jp' ? 'en' : 'jp'; document.getElementById('lang-btn').textContent = currentLang === 'jp' ? 'JPN' : 'ENG'; updateUIStrings(); }
        function updateUIStrings() { document.getElementById('world-title').textContent = t('world'); }

        async function initSync() {
            try {
                const start = Date.now();
                const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Tokyo');
                const data = await res.json();
                serverOffset = (data.unixtime * 1000 + (Date.now() - start)/2) - Date.now();
            } catch(e) { console.warn("Sync failed."); }
        }

        function getAstroData(lat, lng, date) {
            const d = (date.getTime() / 86400000) - 10957.5;
            const L = (280.460 + 0.9856474 * d) % 360;
            const g = (357.528 + 0.9856003 * d) % 360;
            const lambda = L + 1.915 * Math.sin(g * Math.PI / 180);
            const delta = Math.asin(Math.sin(23.439 * Math.PI / 180) * Math.sin(lambda * Math.PI / 180)) * 180 / Math.PI;
            const HA = Math.acos(-Math.tan(lat * Math.PI / 180) * Math.tan(delta * Math.PI / 180)) * 180 / Math.PI;
            const msRef = new Date(Date.UTC(2000,0,7,12,33,0)).getTime();
            return { sunrise: (720 - 4 * (lng + HA) - 10) / 60, sunset: (720 - 4 * (lng - HA) - 10) / 60, moonAge: ((date.getTime() - msRef) / 86400000) % 29.53059 };
        }

        function initWindows(id) {
            const g = document.getElementById(id); if(!g) return; g.innerHTML = '';
            const rects = [[35,40,20,20],[95,25,40,50],[175,50,30,25],[255,20,40,60],[335,45,40,35],[425,30,40,40]];
            rects.forEach(r => { for(let x=2; x<r[2]-2; x+=6) { for(let y=2; y<r[3]-2; y+=8) {
                if(Math.random()>0.4) {
                    const w = document.createElementNS("http://www.w3.org/2000/svg","rect");
                    w.setAttribute("x",r[0]+x); w.setAttribute("y",r[1]+y); w.setAttribute("width",3); w.setAttribute("height",4);
                    w.setAttribute("class","window-grid"+(Math.random()>0.8?" window-pulse":""));
                    w.style.setProperty("--d", (Math.random()*3+1)+"s"); g.appendChild(w);
                }
            }}});
        }

        function controlWindows(id, isDay) { const ws = document.querySelectorAll(`#${id} .window-grid`); ws.forEach(w => w.style.opacity = isDay ? 0 : 0.85); }

        function updateCelestialUI(h, sunId, moonId, termId, fixedId, lat, lng, date, age) {
            const sun = document.getElementById(sunId), moon = document.getElementById(moonId), term = document.getElementById(termId), fixed = document.getElementById(fixedId);
            const astro = getAstroData(lat, lng, date);
            const isDay = ((h - astro.sunrise + 24) % 24 < (astro.sunset - astro.sunrise + 24) % 24);
            if(sun) { sun.style.display = isDay?'block':'none'; if(isDay) { const p = (h - astro.sunrise + 24)%24 / ((astro.sunset-astro.sunrise+24)%24); sun.style.left=`${10+p*80}%`; sun.style.bottom=`${15+Math.sin(p*Math.PI)*65}%`; }}
            if(moon) { moon.style.display = isDay?'none':'block'; if(!isDay) { const p = (h - astro.sunset + 24)%24 / (24-((astro.sunset-astro.sunrise+24)%24)); moon.style.left=`${10+p*80}%`; moon.style.bottom=`${25+Math.sin(p*Math.PI)*55}%`;
            const mp = (age/29.53)%1; fixed.style.display='block';
            if(mp<=0.5) { fixed.style.left='50%'; fixed.style.background='#fff'; term.style.background=(mp<=0.25)?'#111':'#fff'; term.style.transform=`scaleX(${(mp<=0.25)?(1-mp*4):(mp*4-1)})`; }
            else { fixed.style.left='0'; fixed.style.background='#fff'; term.style.background=(mp<=0.75)?'#fff':'#111'; term.style.transform=`scaleX(${(mp<=0.75)?(1-(mp-0.5)*4):((mp-0.5)*4-1)})`; }
            }}
            return isDay;
        }

        function getSkyColor(h, sunrise, sunset) {
            const relH = (h-sunrise+24)%24, dayDur = (sunset-sunrise+24)%24;
            if(relH < dayDur) { if(relH < 1) return 'linear-gradient(to bottom, #1e1b4b, #fb923c)'; if(relH > dayDur-1) return 'linear-gradient(to bottom, #f97316, #4c1d95)'; return 'linear-gradient(to bottom, #0ea5e9, #bae6fd)'; }
            return 'linear-gradient(to bottom, #020617, #0f172a)';
        }

        function update() {
            const now = new Date(), sTime = new Date(now.getTime() + serverOffset);
            const h = sTime.getUTCHours() + sTime.getUTCMinutes()/60 + sTime.getUTCSeconds()/3600;
            document.getElementById('digital-time').textContent = sTime.toTimeString().split(' ')[0];
            document.getElementById('digital-date').textContent = sTime.toLocaleDateString(currentLang==='jp'?'ja-JP':'en-US', { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short' });
            const astro = getAstroData(geoLat, geoLng, sTime);
            document.getElementById('age-label').textContent = `${t('age')}: ${astro.moonAge.toFixed(1)}`;
            document.getElementById('loc-label').textContent = geoName;
            document.getElementById('sr-label').textContent = `↑ ${pad(astro.sunrise)}:${pad((astro.sunrise%1)*60)}`;
            document.getElementById('ss-label').textContent = `↓ ${pad(astro.sunset)}:${pad((astro.sunset%1)*60)}`;
            document.getElementById('main-sky').style.backgroundImage = getSkyColor(h, astro.sunrise, astro.sunset);
            const isDay = updateCelestialUI(h, 'sun-main', 'moon-main', 'moon-term-main', 'moon-fixed-main', geoLat, geoLng, sTime, astro.moonAge);
            controlWindows('windows-main', isDay);
            if(sTime.getMinutes() !== lastFullMinute && lastFullMinute!==-1) { const hook = document.getElementById('ripple-hook'); const r = document.createElement('div'); r.className='ripple'; hook.appendChild(r); setTimeout(()=>r.remove(),2000); }
            lastFullMinute = sTime.getMinutes();
            document.getElementById('sync-status').textContent = Math.abs(serverOffset)<100?t('accurate'):t('syncing');

            const worldContainer = document.getElementById('world-clocks');
            if(worldContainer.children.length === 0) {
                CITY_DATA.forEach((city, i) => {
                    const card = document.createElement('div'); card.className = 'glass-box world-card';
                    card.innerHTML = `
                        <div class="world-city">${city.isTAI ? t('tai') : city.label}</div>
                        <div id="wt-${i}" class="world-time">--:--:--</div>
                        <div id="wd-${i}" class="world-date">----/--/--</div>
                    `;
                    worldContainer.appendChild(card);
                });
            }
            CITY_DATA.forEach((city, i) => {
                const tzTime = new Date(now.getTime() + serverOffset + (city.isTAI ? LEAP_SECONDS*1000 : 0));
                const formatter = new Intl.DateTimeFormat('en-US', { timeZone: city.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                const parts = formatter.formatToParts(tzTime);
                document.getElementById(`wt-${i}`).textContent = `${parts[0].value}:${parts[2].value}:${parts[4].value}`;
                document.getElementById(`wd-${i}`).textContent = new Intl.DateTimeFormat(currentLang==='jp'?'ja-JP':'en-US', { timeZone: city.tz, month: 'short', day: 'numeric' }).format(tzTime);
            });
        }

        async function initGeo() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    geoLat = pos.coords.latitude; geoLng = pos.coords.longitude;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${geoLat}&lon=${geoLng}&zoom=10`);
                        const data = await res.json();
                        if (data && data.address) {
                            const addr = data.address; geoName = `📍 ${addr.province || addr.state || addr.city || "現在地"}`;
                        }
                    } catch(e) { geoName = "📍 現在地"; }
                });
            }
        }

        function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

        window.onload = () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            initSync(); initGeo(); updateUIStrings(); initWindows('windows-main');
            setInterval(update, 1000); update();
        };
    </script>
</body>
</html>
