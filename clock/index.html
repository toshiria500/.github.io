<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Clock v46.0 | NICT Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #fbbf24;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(20px);
            --bg-default: #0f172a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; min-height: 100vh; background: var(--bg-default); font-family: 'Outfit', sans-serif; color: var(--text-main); overflow-x: hidden; display: flex; flex-direction: column; transition: background 3s ease; }
        main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 1.5rem; }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; flex-wrap: wrap; gap: 10px; }
        .control-group { display: flex; gap: 0.5rem; align-items: center; }
        .btn-mini { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-mini:hover { background: rgba(255,255,255,0.15); }
        .btn-active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }

        .glass-box { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 2rem; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6); }
        .main-display { position: relative; padding: clamp(2rem, 8vh, 4rem) 1rem; text-align: center; overflow: hidden; transition: background 2s ease; }
        
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            z-index: 10;
            position: relative;
            text-shadow: 0 0 40px rgba(0,0,0,0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .chime-flash { animation: flash-text 1.2s ease-out; }
        .countdown-flash { animation: countdown-pulse 0.4s ease-out; }

        @keyframes flash-text {
            0% { color: var(--accent); text-shadow: 0 0 60px var(--accent); transform: scale(1.05); }
            100% { color: inherit; text-shadow: 0 0 40px rgba(0,0,0,0.8); transform: scale(1); }
        }
        @keyframes countdown-pulse {
            0% { transform: scale(1.02); color: var(--accent); }
            100% { transform: scale(1); color: inherit; }
        }

        .label-main { font-size: 0.7rem; font-weight: 800; opacity: 0.6; letter-spacing: 0.2em; margin-bottom: 0.5rem; color: var(--accent); }
        #digital-time { font-size: clamp(3.5rem, 15vw, 9rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.05em; }
        #digital-date { font-size: clamp(0.8rem, 2vw, 1.1rem); font-weight: 300; letter-spacing: 0.3em; margin-top: 1rem; opacity: 0.8; }

        .world-monitor {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            z-index: 10;
            position: relative;
        }
        .world-card {
            background: rgba(0,0,0,0.3);
            padding: 18px;
            border-radius: 1.5rem;
            border: 1px solid var(--glass-border);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .world-card:hover { background: rgba(255,255,255,0.05); transform: translateY(-5px); }
        .world-card.selected { border-color: var(--accent); box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
        .world-label { font-size: 0.65rem; font-weight: 800; opacity: 0.6; letter-spacing: 0.1em; display: block; margin-bottom: 8px; color: var(--accent); }
        .world-time { font-family: 'Share Tech Mono', monospace; font-size: 1.6rem; font-weight: 700; color: #fff; }

        .sync-indicator { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.6rem; font-weight: 800; opacity: 0.6; z-index: 20; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; transition: background 0.3s; }
        .dot.synced { background: #10b981; box-shadow: 0 0 10px #10b981; }
        .dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .moon-container { width: 50px; height: 50px; position: absolute; top: 5%; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none; transition: opacity 1.5s ease, transform 1.5s ease; opacity: 0; }
        .moon-container.visible { opacity: 1; transform: translateX(-50%) translateY(10px); }
        .moon-disk { width: 100%; height: 100%; border-radius: 50%; background: #1a1a1a; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .moon-phase-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fffde7; border-radius: 50%; transition: transform 0.5s ease; }
        
        .astro-details { margin-top: 1.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; font-size: 0.75rem; font-weight: 700; }
        .astro-item { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; border-left: 1px solid rgba(255,255,255,0.1); }
        .astro-item:first-child { border-left: none; }

        footer { width: 100%; padding: 2rem 0; text-align: center; font-size: 0.7rem; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <main>
        <div class="dashboard-header">
            <div class="control-group">
                <button class="btn-mini" id="lang-btn" onclick="toggleLang()">JPN</button>
                <button class="btn-mini" id="fs-btn" onclick="toggleFullscreen()">全画面</button>
                <button class="btn-mini" id="sync-now-btn" onclick="syncWithNICT()">NICT同期</button>
            </div>
            <div class="control-group">
                <span id="lbl-chime-pat" style="font-size: 0.6rem; font-weight: 800; opacity: 0.5; letter-spacing: 0.1em;">時報設定:</span>
                <button class="btn-mini chime-opt" id="chime-off" onclick="setChimeMode('off')">オフ</button>
                <button class="btn-mini chime-opt" id="chime-hourly" onclick="setChimeMode('hourly')">毎時</button>
                <button class="btn-mini chime-opt" id="chime-minutely" onclick="setChimeMode('minutely')">毎分</button>
            </div>
        </div>

        <div class="glass-box main-display" id="main-sky">
            <div id="sync-status" class="sync-indicator">
                <div id="sync-dot" class="dot"></div>
                <span id="sync-label">NICT待機中...</span>
            </div>

            <div id="moon-main-container" class="moon-container">
                <div id="moon-disk" class="moon-disk">
                    <div id="moon-phase" class="moon-phase-overlay"></div>
                </div>
            </div>
            
            <div class="clock-container" id="clock-core">
                <div class="label-main" id="lbl-title">TOKYO (JST)</div>
                <div id="digital-time">--:--:--</div>
                <div id="digital-date">----/--/--</div>
            </div>

            <div class="world-monitor">
                <div class="world-card selected" onclick="setBaseCity(9, 'TOKYO (JST)', this)">
                    <span class="world-label">TOKYO (JST)</span>
                    <div id="time-tokyo" class="world-time">--:--:--</div>
                </div>
                <div class="world-card" onclick="setBaseCity(0, 'LONDON (GMT)', this)">
                    <span class="world-label">LONDON (GMT)</span>
                    <div id="time-london" class="world-time">--:--:--</div>
                </div>
                <div class="world-card" onclick="setBaseCity(-5, 'NEW YORK (EST)', this)">
                    <span class="world-label">NEW YORK (EST)</span>
                    <div id="time-ny" class="world-time">--:--:--</div>
                </div>
                <div class="world-card" onclick="setBaseCity(0, 'TAI (ATOMIC)', this)">
                    <span class="world-label">TAI (国際原子時)</span>
                    <div id="time-tai" class="world-time">--:--:--</div>
                </div>
            </div>
            
            <div class="astro-details">
                <div class="astro-item"><span class="astro-label" id="lbl-loc">現在地</span><span id="loc-val">スキャン中...</span></div>
                <div class="astro-item"><span class="astro-label" id="lbl-age">月齢</span><span id="age-val">--.-</span></div>
                <div class="astro-item"><span class="astro-label" id="lbl-offset">NICT差分</span><span id="sync-offset">0.000s</span></div>
                <div class="astro-item"><span class="astro-label" id="lbl-sun">日の出 / 日入り</span><span id="sun-val">--:-- / --:--</span></div>
            </div>
        </div>
    </main>

    <footer>Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</footer>
    
    <script>
        const D2R = Math.PI/180, R2D = 180/Math.PI;
        let networkOffset = 0;
        let isSyncing = false;
        let currentLang = 'jp';
        let userLat = 35.6895; 
        let userLng = 139.6917;
        let chimeMode = 'off';
        let lastChimeTrigger = -1; 
        let currentBaseOffset = 9;
        let currentCityLabel = "TOKYO (JST)";

        const L10N = {
            en: { 
                age: "MOON AGE", sun: "SUNRISE / SUNSET", 
                status_waiting: "NICT STANDBY", status_syncing: "NICT SYNC...", status_synced: "NICT ACTIVE",
                chimePat: "CHIME:", offset: "NICT OFFSET",
                chimeOff: "OFF", chimeH: "1H", chimeM: "1M", fs: "FULL", sync: "NICT SYNC",
                loc: "LOCATION"
            },
            jp: { 
                age: "月齢", sun: "日の出 / 日入り", 
                status_waiting: "NICT待機中", status_syncing: "NICT同期中...", status_synced: "NICT同期完了",
                chimePat: "時報設定:", offset: "NICT差分",
                chimeOff: "オフ", chimeH: "毎時", chimeM: "毎分", fs: "全画面", sync: "NICT同期",
                loc: "現在地"
            }
        };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        window.addEventListener('mousedown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        /**
         * NICTのHTTP時刻供給サービスから時刻を取得
         * jsonp形式でアクセスすることでCORSを回避
         */
        async function syncWithNICT() {
            if (isSyncing) return;
            isSyncing = true;
            const dot = document.getElementById('sync-dot');
            const label = document.getElementById('sync-label');
            dot.className = 'dot syncing';
            label.textContent = L10N[currentLang].status_syncing;

            // NICTはJSONPをサポートしていないため、一般的なHTTP HEADリクエストや
            // もし制限がある場合は代替の高精度APIを利用
            try {
                const startTime = performance.now();
                // NICTの提供する時刻取得用URL (実際はJSON形式でst, itを提供)
                const response = await fetch('https://ntp-a1.nict.go.jp/cgi-bin/json?'+Date.now(), { mode: 'cors', cache: 'no-store' });
                const data = await response.json();
                const endTime = performance.now();
                
                // RTT（往復時間）の半分を考慮して補正
                const rttHalf = (endTime - startTime) / 2;
                // NICTのst (send time) は秒単位なのでミリ秒に直す
                const nictTimeMs = (data.st * 1000) + rttHalf;
                
                networkOffset = nictTimeMs - Date.now();
                
                dot.className = 'dot synced';
                label.textContent = L10N[currentLang].status_synced;
                document.getElementById('sync-offset').textContent = (networkOffset / 1000).toFixed(3) + "s";
            } catch (error) {
                console.warn("NICT CORS Issue or Network Error, falling back to WorldTimeAPI...");
                // NICT直が制限される環境の場合、高精度なWorldTimeAPIをフォールバックに利用
                try {
                    const response = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
                    const data = await response.json();
                    networkOffset = new Date(data.datetime).getTime() - Date.now();
                    dot.className = 'dot synced';
                    label.textContent = "SYNC ACTIVE (FB)";
                } catch(e) {
                    dot.className = 'dot';
                    label.textContent = "Sync Error";
                }
            } finally { isSyncing = false; }
        }

        function playChime(type) {
            if (!audioCtx || chimeMode === 'off') return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const clock = document.getElementById('clock-core');
            if (type === 'announcement') {
                [440, 880].forEach((f) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 1.2);
                });
                clock.classList.remove('chime-flash'); void clock.offsetWidth; clock.classList.add('chime-flash');
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.1);
                clock.classList.remove('countdown-flash'); void clock.offsetWidth; clock.classList.add('countdown-flash');
            }
        }

        function setChimeMode(mode) {
            chimeMode = mode;
            document.querySelectorAll('.chime-opt').forEach(btn => btn.classList.remove('btn-active'));
            document.getElementById(`chime-${mode}`).classList.add('btn-active');
            initAudio();
        }

        function setBaseCity(offset, label, el) {
            currentBaseOffset = offset;
            currentCityLabel = label;
            document.getElementById('lbl-title').textContent = label;
            document.querySelectorAll('.world-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function update() {
            const trueNow = Date.now() + networkOffset;
            const d = new Date(trueNow);
            const displayTime = manualFormat(trueNow, currentBaseOffset);
            const mins = d.getUTCMinutes();
            const secs = d.getUTCSeconds();
            const totalSecs = Math.floor(trueNow / 1000);

            if (lastChimeTrigger !== totalSecs) {
                if ((chimeMode === 'minutely' || (chimeMode === 'hourly' && mins === 59)) && secs >= 57 && secs <= 59) {
                    playChime('countdown');
                }
                if (secs === 0 && (chimeMode === 'minutely' || (chimeMode === 'hourly' && mins === 0))) {
                    playChime('announcement');
                }
                lastChimeTrigger = totalSecs;
            }

            document.getElementById('digital-time').textContent = displayTime.time;
            document.getElementById('digital-date').textContent = displayTime.date;
            
            document.getElementById('time-tokyo').textContent = manualFormat(trueNow, 9).time;
            document.getElementById('time-london').textContent = manualFormat(trueNow, 0).time;
            document.getElementById('time-ny').textContent = manualFormat(trueNow, (new Date().getMonth()>2 && new Date().getMonth()<10)?-4:-5).time;
            document.getElementById('time-tai').textContent = manualFormat(trueNow + 37000, 0).time;

            const moon = getMoonData(trueNow);
            document.getElementById('age-val').textContent = moon.age.toFixed(1);
            
            const localAstro = getSunTimesPrecise(userLat, userLng, trueNow, 9);
            updateMoonVisual(moon.phase, manualFormat(trueNow, 9).hNum, localAstro.sr, localAstro.ss);
            
            const fmt = (h) => h === null ? "--:--" : `${String(Math.floor(h)).padStart(2,'0')}:${String(Math.floor((h%1)*60)).padStart(2,'0')}`;
            document.getElementById('sun-val').textContent = `${fmt(localAstro.sr)} / ${fmt(localAstro.ss)}`;
            document.getElementById('main-sky').style.backgroundImage = getSkyColor(manualFormat(trueNow, 9).hNum, localAstro.sr, localAstro.ss);

            requestAnimationFrame(update);
        }

        function manualFormat(utcMs, offsetHours) {
            const d = new Date(utcMs + (offsetHours * 3600000));
            return { 
                time: `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')}`, 
                date: `${d.getUTCFullYear()}/${String(d.getUTCMonth()+1).padStart(2,'0')}/${String(d.getUTCDate()).padStart(2,'0')}`, 
                hNum: d.getUTCHours() + d.getUTCMinutes()/60 + d.getUTCSeconds()/3600
            };
        }

        function getMoonData(utcMs) {
            const lp = 2551443 * 1000; 
            const newMoon = new Date(Date.UTC(1970, 0, 7, 20, 35, 0)).getTime();
            const phase = ((utcMs - newMoon) % lp) / lp;
            return { age: (phase < 0 ? phase + 1 : phase) * 29.53, phase: (phase < 0 ? phase + 1 : phase) }; 
        }

        function updateMoonVisual(phase, h, sr, ss) {
            const container = document.getElementById('moon-main-container');
            const overlay = document.getElementById('moon-phase');
            const disk = document.getElementById('moon-disk');
            if (sr !== null && h >= sr && h < ss) container.classList.remove('visible');
            else container.classList.add('visible');
            let p = phase * 100;
            if (p < 50) {
                overlay.style.transform = `translateX(${p * 2}%)`;
                overlay.style.backgroundColor = '#1a1a1a';
                disk.style.backgroundColor = '#fffde7';
            } else {
                overlay.style.transform = `translateX(${(p - 50) * 2}%)`;
                overlay.style.backgroundColor = '#fffde7';
                disk.style.backgroundColor = '#1a1a1a';
            }
        }

        function getSunTimesPrecise(lat, lng, utcMs, offsetHours) {
            const date = new Date(utcMs);
            const dayOfYear = Math.floor((utcMs - new Date(Date.UTC(date.getUTCFullYear(), 0, 1))) / 86400000) + 1;
            const gamma = 2 * Math.PI / 365 * (dayOfYear - 1 + (date.getUTCHours() - 12) / 24);
            const eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma) - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
            const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma);
            const cosH = (Math.cos(90.833 * D2R) / (Math.cos(lat * D2R) * Math.cos(decl)) - Math.tan(lat * D2R) * Math.tan(decl));
            if (cosH > 1 || cosH < -1) return { sr: null, ss: null };
            const ha = Math.acos(cosH) * R2D;
            return { sr: ((720 - 4 * (lng + ha) - eqtime) / 60 + offsetHours + 24) % 24, ss: ((720 - 4 * (lng - ha) - eqtime) / 60 + offsetHours + 24) % 24 };
        }

        function getSkyColor(h, sr, ss) {
            if (sr === null) return 'linear-gradient(to bottom, #020617, #0f172a)';
            const rel = (h - sr + 24) % 24;
            const dur = (ss - sr + 24) % 24;
            if (rel < 0 || rel > dur) return 'linear-gradient(to bottom, #020617, #0f172a)';
            if (rel < 1) return 'linear-gradient(to bottom, #1e1b4b, #fb923c)';
            if (rel > dur - 1) return 'linear-gradient(to bottom, #f97316, #312e81)';
            return 'linear-gradient(to bottom, #0ea5e9, #bae6fd)';
        }

        function toggleLang() { 
            currentLang = currentLang==='jp'?'en':'jp'; 
            document.getElementById('lang-btn').textContent = currentLang==='jp'?'JPN':'ENG'; 
            const d = L10N[currentLang];
            document.getElementById('lbl-age').textContent = d.age; 
            document.getElementById('lbl-sun').textContent = d.sun; 
            document.getElementById('lbl-offset').textContent = d.offset;
            document.getElementById('sync-now-btn').textContent = d.sync;
            document.getElementById('lbl-chime-pat').textContent = d.chimePat;
            document.getElementById('chime-off').textContent = d.chimeOff;
            document.getElementById('chime-hourly').textContent = d.chimeH;
            document.getElementById('chime-minutely').textContent = d.chimeM;
            document.getElementById('fs-btn').textContent = d.fs;
            document.getElementById('lbl-loc').textContent = d.loc;
        }

        function toggleFullscreen(){ 
            if(!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.onload = () => {
            syncWithNICT();
            update();
            document.getElementById('year').textContent = new Date().getFullYear();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    userLat = p.coords.latitude; userLng = p.coords.longitude;
                    document.getElementById('loc-val').textContent = `📍 ${userLat.toFixed(2)}, ${userLng.toFixed(2)}`;
                }, () => { document.getElementById('loc-val').textContent = "📍 Tokyo (Def)"; });
            }
        };
    </script>
</body>
</html>
