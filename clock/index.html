<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Clock v37.0 | NICTスマート同期</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #fbbf24;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(20px);
            --bg-default: #0f172a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; min-height: 100vh; background: var(--bg-default); font-family: 'Outfit', sans-serif; color: var(--text-main); overflow-x: hidden; display: flex; flex-direction: column; transition: background 3s ease; }
        main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 2rem; }
        .glass-box { background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 2rem; box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6); }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; margin-bottom: -1rem; }
        .btn-mini { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-mini:hover { background: rgba(255,255,255,0.15); }
        
        .main-display { position: relative; padding: clamp(4rem, 12vh, 6rem) 1rem; text-align: center; overflow: hidden; margin-top: 1rem; transition: background 2s ease; }
        
        .clock-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            z-index: 10;
            position: relative;
            text-shadow: 0 0 40px rgba(0,0,0,0.8);
            letter-spacing: -0.02em;
        }
        #digital-time { font-size: clamp(4rem, 18vw, 10rem); line-height: 1; font-variant-numeric: tabular-nums; }
        #digital-date { font-size: clamp(1rem, 3vw, 1.4rem); font-weight: 300; letter-spacing: 0.3em; margin-top: 1rem; opacity: 0.8; z-index: 10; position: relative; }
        
        .sync-indicator { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 700; opacity: 0.6; z-index: 20; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
        .dot.syncing { background: #fbbf24; animation: blink 1s infinite; }
        .dot.offline { background: #64748b; }
        .dot.error { background: #ef4444; }

        .moon-container { width: 80px; height: 80px; position: absolute; top: 15%; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
        .moon-disk { width: 100%; height: 100%; border-radius: 50%; background: #1a1a1a; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .moon-phase-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fffde7; border-radius: 50%; transition: transform 0.5s ease; }
        
        .astro-details { margin-top: 3rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; font-size: 0.85rem; font-weight: 700; z-index: 10; position: relative; }
        .astro-item { display: flex; flex-direction: column; gap: 4px; padding: 0 15px; border-left: 1px solid rgba(255,255,255,0.1); }
        .astro-item:first-child { border-left: none; }
        .astro-label { font-size: 0.65rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.1em; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        footer { width: 100%; padding: 3rem 0; text-align: center; font-size: 0.75rem; color: var(--text-dim); }
    </style>
</head>
<body>
    <main>
        <div class="dashboard-header">
            <div style="display:flex; gap:0.5rem;">
                <button class="btn-mini" onclick="toggleFullscreen()">全画面表示</button>
                <button class="btn-mini" onclick="requestLocation()">📍 現在地を取得</button>
                <button class="btn-mini" onclick="syncWithNICT()">🔄 今すぐ同期</button>
            </div>
            <div id="sync-status" class="sync-indicator">
                <div id="sync-dot" class="dot"></div>
                <span id="sync-label">NICT待機中...</span>
            </div>
        </div>

        <div class="glass-box main-display" id="main-sky">
            <div id="moon-main-container" class="moon-container">
                <div id="moon-disk" class="moon-disk">
                    <div id="moon-phase" class="moon-phase-overlay"></div>
                </div>
            </div>
            
            <div class="clock-container">
                <div id="digital-time">--:--:--</div>
            </div>
            <div id="digital-date">----/--/--</div>
            
            <div class="astro-details">
                <div class="astro-item"><span class="astro-label">観測地点</span><span id="loc-val">東京都 渋谷区</span></div>
                <div class="astro-item"><span class="astro-label">月齢</span><span id="age-val">--.-</span></div>
                <div class="astro-item"><span class="astro-label">日の出 / 日の入り</span><span id="sun-val">--:-- / --:--</span></div>
            </div>
        </div>
    </main>

    <footer>Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</footer>
    
    <script>
        const D2R = Math.PI/180, R2D = 180/Math.PI;
        
        // --- 独立時計エンジン ---
        let nictBaseTimeMs = 0;   
        let perfBaseMs = 0;       
        let isSynced = false;

        let userLat = 35.66; 
        let userLng = 139.70;
        let userLocName = "東京都 渋谷区";

        // NICTとの同期関数
        async function syncWithNICT() {
            const dot = document.getElementById('sync-dot');
            const label = document.getElementById('sync-label');

            // オフラインなら同期をスキップ
            if (!navigator.onLine) {
                dot.className = 'dot offline';
                label.textContent = "オフライン (同期保留)";
                return;
            }

            dot.className = 'dot syncing';
            label.textContent = "NICTと通信中...";
            
            try {
                const t0 = performance.now();
                // タイムアウトを設定して、ずっと待ち続けないようにする
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const res = await fetch('https://ntp-a1.nict.go.jp/cgi-bin/json', { 
                    cache: 'no-store',
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error("NICT failure");
                const data = await res.json();
                const t1 = performance.now();
                
                const rtt = t1 - t0;
                nictBaseTimeMs = (data.st * 1000) + (rtt / 2);
                perfBaseMs = t1; 
                isSynced = true;

                dot.className = 'dot';
                label.textContent = "NICT同期 完了";
            } catch (e) {
                dot.className = 'dot error';
                label.textContent = "同期エラー (再試行予定)";
                // エラー時は少し待ってから再試行
                setTimeout(syncWithNICT, 30000);
            }
        }

        // オンライン復帰時に自動同期
        window.addEventListener('online', syncWithNICT);
        window.addEventListener('offline', () => {
            const dot = document.getElementById('sync-dot');
            const label = document.getElementById('sync-label');
            dot.className = 'dot offline';
            label.textContent = "オフライン";
        });

        function getAccurateNowIndependent() {
            if (!isSynced) return Date.now(); 
            const elapsed = performance.now() - perfBaseMs;
            return nictBaseTimeMs + elapsed;
        }

        // --- 天体計算 ---
        function getMoonData(utcMs) {
            const lp = 2551443 * 1000; 
            const newMoon = new Date(Date.UTC(1970, 0, 7, 20, 35, 0)).getTime();
            const phase = ((utcMs - newMoon) % lp) / lp;
            return { age: phase * 29.53, phase: (phase < 0 ? phase + 1 : phase) }; 
        }

        function updateMoonVisual(phase) {
            const overlay = document.getElementById('moon-phase');
            const disk = document.getElementById('moon-disk');
            if(!overlay || !disk) return;
            let p = phase * 100;
            if (p < 50) {
                overlay.style.transform = `translateX(${p * 2}%)`;
                overlay.style.backgroundColor = '#1a1a1a';
                disk.style.backgroundColor = '#fffde7';
            } else {
                overlay.style.transform = `translateX(${(p - 50) * 2}%)`;
                overlay.style.backgroundColor = '#fffde7';
                disk.style.backgroundColor = '#1a1a1a';
            }
        }

        function getSunTimesPrecise(lat, lng, utcMs, offsetHours) {
            const date = new Date(utcMs);
            const startOfYear = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            const dayOfYear = Math.floor((utcMs - startOfYear) / 86400000) + 1;
            const gamma = 2 * Math.PI / 365 * (dayOfYear - 1 + (date.getUTCHours() - 12) / 24);
            const eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma) - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
            const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma) - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma) - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma);
            const cosH = (Math.cos(90.833 * D2R) / (Math.cos(lat * D2R) * Math.cos(decl)) - Math.tan(lat * D2R) * Math.tan(decl));
            if (cosH > 1 || cosH < -1) return { sr: null, ss: null };
            const ha = Math.acos(cosH) * R2D;
            const sunriseUtc = 720 - 4 * (lng + ha) - eqtime;
            const sunsetUtc = 720 - 4 * (lng - ha) - eqtime;
            return { sr: (sunriseUtc / 60 + offsetHours + 24) % 24, ss: (sunsetUtc / 60 + offsetHours + 24) % 24 };
        }

        function manualFormat(utcMs, offsetHours) {
            const ms_total = utcMs + (offsetHours * 3600000);
            const d = new Date(ms_total);
            const h = String(d.getUTCHours()).padStart(2, '0');
            const m = String(d.getUTCMinutes()).padStart(2, '0');
            const s = String(d.getUTCSeconds()).padStart(2, '0');
            const Y = d.getUTCFullYear();
            const M = String(d.getUTCMonth() + 1).padStart(2, '0');
            const D = String(d.getUTCDate()).padStart(2, '0');
            return { 
                time: `${h}:${m}:${s}`, 
                date: `${Y}/${M}/${D}`, 
                hNum: d.getUTCHours() + d.getUTCMinutes()/60 + d.getUTCSeconds()/3600
            };
        }

        function update() {
            const utcMs = getAccurateNowIndependent();
            const tokyo = manualFormat(utcMs, 9);
            
            document.getElementById('digital-time').textContent = tokyo.time;
            document.getElementById('digital-date').textContent = tokyo.date;
            
            const moon = getMoonData(utcMs);
            document.getElementById('age-val').textContent = moon.age.toFixed(1);
            updateMoonVisual(moon.phase);
            
            const localAstro = getSunTimesPrecise(userLat, userLng, utcMs, 9);
            const pad = (n) => String(Math.floor((n+24)%24)).padStart(2,'0');
            const fmt = (h) => h === null ? "--:--" : `${pad(h)}:${pad((h%1)*60)}`;
            
            document.getElementById('sun-val').textContent = `${fmt(localAstro.sr)} / ${fmt(localAstro.ss)}`;
            document.getElementById('loc-val').textContent = userLocName;
            document.getElementById('main-sky').style.backgroundImage = getSkyColor(tokyo.hNum, localAstro.sr, localAstro.ss);

            requestAnimationFrame(update);
        }

        function getSkyColor(h, sr, ss) {
            if (sr === null) return 'linear-gradient(to bottom, #020617, #0f172a)';
            const rel = (h - sr + 24) % 24;
            const dur = (ss - sr + 24) % 24;
            if (rel < 0 || rel > dur) return 'linear-gradient(to bottom, #020617, #0f172a)';
            if (rel < 1) return 'linear-gradient(to bottom, #1e1b4b, #fb923c)';
            if (rel > dur - 1) return 'linear-gradient(to bottom, #f97316, #312e81)';
            return 'linear-gradient(to bottom, #0ea5e9, #bae6fd)';
        }

        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude;
                        userLng = pos.coords.longitude;
                        userLocName = `${userLat.toFixed(2)}°N, ${userLng.toFixed(2)}°E`;
                    },
                    (err) => { console.warn("位置情報の取得に失敗しました"); },
                    { enableHighAccuracy: false, timeout: 5000, maximumAge: 0 }
                );
            }
        }

        function toggleFullscreen(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

        window.onload = () => {
            syncWithNICT();
            requestLocation();
            // 定期的な同期も、オンラインの時だけ実行されるように
            setInterval(() => {
                if (navigator.onLine) syncWithNICT();
            }, 600000); // 10分おき
            
            update();
            document.getElementById('year').textContent = new Date().getUTCFullYear();
        };
    </script>
</body>
</html>
