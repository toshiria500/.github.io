  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-main: #6b2c91;
    --purple-light: #9d4edd;
    --red-eye: #ff1a1a;
    --user-bubble: #3a3d52;
    --bot-msg-bg: rgba(20, 10, 30, 0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(90deg, #000000, var(--purple-main), #000000);
    color: var(--text-accent);
    padding: 12px 20px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    border-bottom: 2px solid var(--red-eye);
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .setting-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 20px;
    transition: all 0.3s;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background-image: radial-gradient(circle at 50% 50%, rgba(107, 44, 145, 0.15) 0%, transparent 80%),
                      url('https://www.transparenttextures.com/patterns/dark-matter.png');
  }

  .botContainer { display: flex; align-items: flex-start; gap: 14px; max-width: 95%; animation: fadeIn 0.4s ease-out; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .icon-wrapper {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    position: relative;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
    box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
    cursor: pointer;
  }

  .botIcon { width: 100%; height: 100%; border-radius: 50%; background-color: #000; object-fit: cover; display: block; }

  .botText {
    background: var(--bot-msg-bg);
    border: 1px solid rgba(157, 78, 221, 0.4);
    border-radius: 4px 20px 20px 20px;
    padding: 14px 18px;
    line-height: 1.7;
    font-size: 0.95rem;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
  }

  .size-tip {
    font-size: 11px;
    color: var(--text-accent);
    margin-top: 8px;
    display: block;
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
    line-height: 1.4;
    opacity: 0.95;
    border-left: 2px solid var(--red-eye);
    padding-left: 8px;
  }

  .userContainer { display: flex; justify-content: flex-end; width: 100%; animation: fadeIn 0.4s ease-out; }
  .userBubble {
    background: var(--user-bubble);
    color: #fff;

    padding: 12px 18px;
    max-width: 80%;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }

    cursor: move;
    touch-action: none;

    user-select: none;
