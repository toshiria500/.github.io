<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻想郷ジェネレーター - 境界の語り部</title>
<meta name="description" content="八雲紫があなたの幻想郷での運命を語ります">
<!-- Markdown変換用ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-main: #6b2c91;
    --purple-light: #9d4edd;
    --red-eye: #ff1a1a;
    --user-bubble: #3a3d52;
    --bot-msg-bg: rgba(20, 10, 30, 0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- ヘッダー --- */
  header {
    background: linear-gradient(90deg, #000000, var(--purple-main), #000000);
    color: var(--text-accent);
    padding: 12px 20px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    border-bottom: 2px solid var(--red-eye);
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .setting-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 20px;
    transition: all 0.3s;
  }

  /* --- チャットエリア --- */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background-image: radial-gradient(circle at 50% 50%, rgba(107, 44, 145, 0.15) 0%, transparent 80%),
                      url('https://www.transparenttextures.com/patterns/dark-matter.png');
  }

  .botContainer { display: flex; align-items: flex-start; gap: 14px; max-width: 95%; animation: fadeIn 0.4s ease-out; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .icon-wrapper {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    position: relative;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
    box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
    cursor: pointer;
    overflow: visible;
  }

  .botIcon { width: 100%; height: 100%; border-radius: 50%; background-color: #000; object-fit: cover; display: block; }

  .botText {
    background: var(--bot-msg-bg);
    border: 1px solid rgba(157, 78, 221, 0.4);
    border-radius: 4px 20px 20px 20px;
    padding: 14px 18px;
    line-height: 1.7;
    font-size: 0.95rem;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
  }

  .size-tip {
    font-size: 11px;
    color: var(--text-accent);
    margin-top: 6px;
    display: block;
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
    opacity: 0.9;
  }

  .userContainer { display: flex; justify-content: flex-end; width: 100%; animation: fadeIn 0.4s ease-out; }
  .userBubble {
    background: var(--user-bubble);
    color: #fff;
    border-radius: 20px 4px 20px 20px;
    padding: 12px 18px;
    max-width: 80%;
    font-size: 0.9rem;
    white-space: pre-wrap;
  }

  /* --- トリミングモーダル --- */
  #cropModal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .crop-viewport {
    width: 280px;
    height: 280px;
    border: 2px solid var(--purple-light);
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #111;
    cursor: move;
    touch-action: none;
  }
  #cropImage {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    pointer-events: none;
    user-select: none;
  }
  .crop-controls {
    width: 100%;
    max-width: 300px;
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .crop-slider { width: 100%; accent-color: var(--purple-light); }
  .crop-btns { display: flex; gap: 10px; }
  .crop-btns button {
    flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;
  }
  .btn-cancel { background: #444; color: white; }
  .btn-save { background: var(--purple-main); color: white; }

  /* --- 入力フォーム --- */
  #bottom-area { background: #000; border-top: 2px solid var(--purple-main); }
  #storyForm {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    max-width: 900px; margin: 0 auto; padding: 16px;
  }
  .full-width { grid-column: span 2; }
  input {
    background: rgba(255, 255, 255, 0.08); border: 1px solid #444; color: white;
    padding: 12px 15px; border-radius: 8px; font-size: 16px; outline: none;
  }
  button[type="submit"] {
    grid-column: span 2; background: linear-gradient(135deg, var(--purple-main), #4b0082);
    color: white; border: 1px solid var(--purple-light); padding: 14px;
    font-weight: bold; border-radius: 8px; cursor: pointer;
    font-family: 'Hiragino Mincho ProN', serif;
  }

  .site-footer {
    text-align: center; padding: 15px 10px; font-size: 0.85rem; color: rgba(255, 255, 255, 0.6);
    background: #000; font-family: 'Hiragino Mincho ProN', serif; border-top: 1px solid #222;
  }
  .footer-links a { color: var(--purple-light); text-decoration: none; margin: 0 5px; }

  @media (max-width: 600px) {
    #storyForm { grid-template-columns: 1fr; }
    .full-width, button[type="submit"] { grid-column: span 1; }
  }
</style>
</head>
<body>

  <header>
    <span>⛩ 幻想郷ジェネレーター</span>
    <a href="./Setting.html" class="setting-link">⚙ 設定</a>
  </header>

  <!-- アイコン編集モーダル -->
  <div id="cropModal">
    <h3 style="color:var(--text-accent); margin-bottom:15px;">画像を調整してちょうだい</h3>
    <div class="crop-viewport" id="cropViewport">
      <img id="cropImage" src="">
    </div>
    <div class="crop-controls">
      <input type="range" class="crop-slider" id="zoomSlider" min="0.1" max="3" step="0.01" value="1">
      <div class="crop-btns">
        <button class="btn-cancel" onclick="closeCropModal()">キャンセル</button>
        <button class="btn-save" onclick="saveCroppedIcon()">決定</button>
      </div>
    </div>
    <p style="color:#888; font-size:12px; margin-top:10px;">ドラッグで移動、スライダーで拡大</p>
  </div>

  <input type="file" id="iconInput" accept="image/*" style="display:none">

  <main id="chat-container">
    <div class="botContainer" id="first-msg">
      <div class="icon-wrapper" onclick="document.getElementById('iconInput').click()">
        <img src="" class="botIcon" id="displayIcon" alt="紫" onerror="handleIconError(this)">
      </div>
      <div class="botText">
        あらあら、外の世界から迷い込んできたの？<br>
        歓迎するわ、幻想郷へ。<br><br>
        あなたの名前や、持っている物を教えてちょうだい。<br>
        この私が、あなたの「運命の境界」を覗いてあげるから……うふふ。<br>
        <span class="size-tip">※アイコンをタップして画像を変更・調整できるわ（推奨: 400x400px）</span>
      </div>
    </div>
  </main>

  <div id="bottom-area">
    <form id="storyForm">
      <input id="name" placeholder="名前" required>
      <input id="action" placeholder="行動" required>
      <input id="item" placeholder="持ち物" required>
      <input id="companion" placeholder="お供" required>
      <input id="enemy" class="full-width" placeholder="遭遇する者 (任意)">
      <button type="submit">👁️ 境界を覗く (送信)</button>
    </form>

    <footer class="site-footer">
      <div class="footer-links">
        <a href="https://shindanmaker.com/1208379?c=1" target="_blank" rel="noopener">
          生存率診断(元ネタ) <i class="fas fa-external-link-alt"></i>
        </a>
      </div>
      <div class="copyright">Copyright © toshiria 2025 - <span id="year"></span></div>
    </footer>
  </div>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const STORAGE_KEY_ICON = 'GENSOKYO_BOT_ICON_V2';
  const displayIcon = document.getElementById('displayIcon');
  const cropModal = document.getElementById('cropModal');
  const cropImage = document.getElementById('cropImage');
  const zoomSlider = document.getElementById('zoomSlider');
  const viewport = document.getElementById('cropViewport');

  let imgState = { x: 0, y: 0, scale: 1, baseScale: 1 };
  let isDragging = false;
  let startX, startY;

  // 1. アイコンの初期読み込み
  function initIcon() {
    const saved = localStorage.getItem(STORAGE_KEY_ICON);
    if (saved && saved !== "null") {
      displayIcon.src = saved;
      updateAllBotIcons(saved);
    } else {
      displayIcon.src = '../static/bot_icon.png';
    }
  }
  window.addEventListener('load', initIcon);

  function handleIconError(img) {
    img.style.display = 'none';
    const parent = img.parentElement;
    if (!parent.querySelector('.fallback-label')) {
      const label = document.createElement('div');
      label.className = 'fallback-label';
      label.style.cssText = 'width:100%;height:100%;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#d4af37;font-size:14px;';
      label.innerText = '紫';
      parent.appendChild(label);
    }
  }

  // 2. ファイル選択 & モーダル表示
  document.getElementById('iconInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      cropImage.src = event.target.result;
      cropImage.onload = () => {
        // 初期スケール計算（枠に合わせる）
        const ratioW = 280 / cropImage.naturalWidth;
        const ratioH = 280 / cropImage.naturalHeight;
        imgState.baseScale = Math.max(ratioW, ratioH);
        imgState.scale = imgState.baseScale;
        imgState.x = (280 - cropImage.naturalWidth * imgState.scale) / 2;
        imgState.y = (280 - cropImage.naturalHeight * imgState.scale) / 2;
        
        zoomSlider.min = imgState.baseScale;
        zoomSlider.max = imgState.baseScale * 5;
        zoomSlider.value = imgState.scale;
        
        applyTransform();
        cropModal.style.display = 'flex';
      };
    };
    reader.readAsDataURL(file);
  });

  // 3. ドラッグ操作
  viewport.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', doDrag);
  window.addEventListener('mouseup', endDrag);
  viewport.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
  window.addEventListener('touchmove', (e) => doDrag(e.touches[0]));
  window.addEventListener('touchend', endDrag);

  function startDrag(e) { isDragging = true; startX = e.clientX - imgState.x; startY = e.clientY - imgState.y; }
  function doDrag(e) {
    if (!isDragging) return;
    imgState.x = e.clientX - startX;
    imgState.y = e.clientY - startY;
    applyTransform();
  }
  function endDrag() { isDragging = false; }

  zoomSlider.addEventListener('input', (e) => {
    const oldScale = imgState.scale;
    imgState.scale = parseFloat(e.target.value);
    // 中心を維持して拡大
    imgState.x -= (cropImage.naturalWidth * imgState.scale - cropImage.naturalWidth * oldScale) / 2;
    imgState.y -= (cropImage.naturalHeight * imgState.scale - cropImage.naturalHeight * oldScale) / 2;
    applyTransform();
  });

  function applyTransform() {
    cropImage.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`;
  }

  function closeCropModal() { cropModal.style.display = 'none'; document.getElementById('iconInput').value = ""; }

  // 4. 切り抜き実行と保存
  function saveCroppedIcon() {
    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 400;
    const ctx = canvas.getContext('2d');

    // プレビュー(280px)から400pxへの比率
    const ratio = 400 / 280;
    
    ctx.drawImage(
      cropImage, 
      imgState.x * ratio, 
      imgState.y * ratio, 
      cropImage.naturalWidth * imgState.scale * ratio, 
      cropImage.naturalHeight * imgState.scale * ratio
    );

    const dataUrl = canvas.toDataURL('image/png');
    localStorage.setItem(STORAGE_KEY_ICON, dataUrl);
    updateAllBotIcons(dataUrl);
    closeCropModal();
  }

  function updateAllBotIcons(src) {
    const icons = document.querySelectorAll('.botIcon');
    icons.forEach(img => {
      img.src = src;
      img.style.display = 'block';
      const label = img.parentElement.querySelector('.fallback-label');
      if (label) label.remove();
    });
  }

  // --- チャットロジック ---
  const form = document.getElementById("storyForm");
  const chat = document.getElementById("chat-container");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const apiKey = localStorage.getItem("GEMINI_API_KEY");
    if (!apiKey) {
      pushBotMessage("APIキーがないわ。設定を確認してちょうだい。");
      return;
    }

    const data = {
      name: document.getElementById("name").value.trim(),
      action: document.getElementById("action").value.trim(),
      item: document.getElementById("item").value.trim(),
      companion: document.getElementById("companion").value.trim(),
      enemy: document.getElementById("enemy").value.trim() || "なし"
    };

    pushUserMessage(`${data.name}が行くわ。\n行動: ${data.action}\n持ち物: ${data.item}`);
    form.reset();

    const loadingId = pushBotMessage("境界を繋いでいるわ…… <span class='loading-eye'>👁️</span>");

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `あなたは東方Projectの八雲紫です。以下の情報を元に Markdownで語ってください。
口調: 優雅, ミステリアス。名前:${data.name}, 行動:${data.action}, 持物:${data.item}, お供:${data.companion}, 遭遇:${data.enemy}` }] }]
        })
      });
      const json = await res.json();
      const text = json.candidates[0].content.parts[0].text;
      document.getElementById(loadingId).remove();
      pushBotMessage(marked.parse(text));
    } catch (err) {
      document.getElementById(loadingId).innerText = "あら、結界が乱れたみたい。";
    }
  });

  function pushBotMessage(text) {
    const id = "bot-" + Date.now();
    const div = document.createElement("div");
    div.className = "botContainer";
    div.id = id;
    const currentSrc = localStorage.getItem(STORAGE_KEY_ICON) || '../static/bot_icon.png';
    div.innerHTML = `
      <div class="icon-wrapper" onclick="document.getElementById('iconInput').click()">
        <img src="${currentSrc}" class="botIcon" onerror="handleIconError(this)">
      </div>
      <div class="botText">${text}</div>
    `;
    chat.appendChild(div);
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    return id;
  }

  function pushUserMessage(text) {
    const div = document.createElement("div");
    div.className = "userContainer";
    div.innerHTML = `<div class="userBubble">${text}</div>`;
    chat.appendChild(div);
    chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  }
</script>
</body>
</html>
