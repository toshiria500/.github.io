<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻想郷ジェネレーター - 境界の語り部</title>
<meta name="description" content="八雲紫があなたの幻想郷での運命を語ります">
<!-- Markdown変換用ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Font Awesome (アイコン用) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-main: #6b2c91;
    --purple-light: #9d4edd;
    --red-eye: #ff1a1a;
    --user-bubble: #3a3d52;
    --bot-msg-bg: rgba(20, 10, 30, 0.85);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- ヘッダー --- */
  header {
    background: linear-gradient(90deg, #000000, var(--purple-main), #000000);
    color: var(--text-accent);
    padding: 12px 20px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    border-bottom: 2px solid var(--red-eye);
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .setting-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.85rem;
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 20px;
    transition: all 0.3s ease;
    border: 1px solid transparent;
  }
  .setting-link:hover {
    background: rgba(255,255,255,0.25);
    border-color: var(--purple-light);
  }

  /* --- チャットエリア --- */
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(107, 44, 145, 0.15) 0%, transparent 80%),
      url('https://www.transparenttextures.com/patterns/dark-matter.png');
  }

  .botContainer {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    max-width: 95%;
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* アイコン設定関連 */
  .icon-wrapper {
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    position: relative;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
    box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .icon-wrapper:hover {
    transform: scale(1.05);
  }
  .icon-wrapper::after {
    content: '換';
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: var(--red-eye);
    color: white;
    font-size: 10px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid white;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .icon-wrapper:hover::after {
    opacity: 1;
  }

  .botIcon {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-color: #000;
    object-fit: cover;
    display: block;
  }

  .botText {
    background: var(--bot-msg-bg);
    border: 1px solid rgba(157, 78, 221, 0.4);
    border-radius: 4px 20px 20px 20px;
    padding: 14px 18px;
    line-height: 1.7;
    font-size: 0.95rem;
    color: var(--text-main);
    box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
  }

  .userContainer {
    display: flex;
    justify-content: flex-end;
    width: 100%;
    animation: fadeIn 0.4s ease-out;
  }

  .userBubble {
    background: var(--user-bubble);
    color: #fff;
    border-radius: 20px 4px 20px 20px;
    padding: 12px 18px;
    max-width: 80%;
    font-family: sans-serif;
    font-size: 0.9rem;
    line-height: 1.5;
    white-space: pre-wrap;
    box-shadow: -2px 4px 10px rgba(0,0,0,0.3);
  }

  /* Markdownスタイル */
  .botText h2, .botText h3 { 
    color: var(--text-accent); 
    margin: 15px 0 8px 0; 
    font-size: 1.15rem; 
    border-bottom: 1px solid var(--purple-main);
    padding-bottom: 4px;
  }
  .botText p { margin-bottom: 12px; }
  .botText strong { color: #ff6b6b; font-weight: bold; }

  .loading-eye {
    display: inline-block; color: var(--text-accent); animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.2; transform: scale(0.8); color: var(--red-eye); }
  }

  /* --- 入力エリア --- */
  #bottom-area {
    background: #000;
    border-top: 2px solid var(--purple-main);
    z-index: 20;
  }

  #storyForm {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
    width: 100%;
  }

  .full-width { grid-column: span 2; }

  input {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid #444;
    color: white;
    padding: 12px 15px;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    font-family: sans-serif;
  }
  input:focus { 
    border-color: var(--purple-light); 
    background: rgba(255, 255, 255, 0.12);
  }

  button[type="submit"] {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--purple-main) 0%, #4b0082 100%);
    color: white;
    border: 1px solid var(--purple-light);
    padding: 14px;
    font-size: 1.05rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 10px;
    font-family: 'Hiragino Mincho ProN', serif;
  }

  /* --- フッター --- */
  .site-footer {
    text-align: center;
    padding: 15px 10px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.6);
    background: #000;
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
    border-top: 1px solid #222;
  }
  
  .gemini-power {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
    margin-bottom: 8px;
    font-size: 0.95rem;
  }
  .gemini-icon { width: 20px; height: 20px; }
  .gemini-icon path { fill: url(#gemini-grad); }

  .footer-links { margin-bottom: 8px; }
  .site-footer a { color: var(--purple-light); text-decoration: none; margin: 0 5px; }
  
  .copyright {
    font-size: 0.75rem;
    letter-spacing: 0.02em;
    opacity: 0.7;
  }

  /* 隠しファイル入力 */
  #iconInput { display: none; }

  /* 推奨サイズチップ (明朝体に設定) */
  .size-tip {
    font-size: 11px;
    color: var(--text-accent);
    margin-top: 6px;
    display: block;
    /* 明朝体を適用 */
    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
    opacity: 0.9;
    letter-spacing: 0.03em;
  }

  @media (max-width: 600px) {
    #storyForm { grid-template-columns: 1fr; padding: 12px; }
    .full-width, button[type="submit"] { grid-column: span 1; }
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="gemini-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4285F4" />
        <stop offset="50%" stop-color="#9B72CB" />
        <stop offset="100%" stop-color="#D96570" />
      </linearGradient>
    </defs>
  </svg>

  <input type="file" id="iconInput" accept="image/*">

  <header>
    <span>⛩ 幻想郷ジェネレーター</span>
    <div class="header-actions">
      <a href="./Setting.html" class="setting-link">⚙ 設定</a>
    </div>
  </header>

  <main id="chat-container">
    <!-- 初回メッセージ -->
    <div class="botContainer">
      <div class="icon-wrapper" onclick="document.getElementById('iconInput').click()" title="アイコンを変更（このブラウザのみ保存されます）">
        <img src="" class="botIcon" id="displayIcon" alt="紫" onerror="handleIconError(this)">
      </div>
      <div class="botText">
        あらあら、外の世界から迷い込んできたの？<br>
        歓迎するわ、幻想郷へ。<br><br>
        あなたの名前や、持っている物を教えてちょうだい。<br>
        この私が、あなたの「運命の境界」を覗いてあげるから……うふふ。<br>
        <span class="size-tip">※アイコンをタップして好きな画像に変えられるわよ（推奨: 200x200px以上）</span>
      </div>
    </div>
  </main>

  <div id="bottom-area">
    <form id="storyForm" autocomplete="off">
      <input id="name" placeholder="名前 (例: 博麗の巫女)" required>
      <input id="action" placeholder="行動 (例: 紅魔館に忍び込む)" required>
      <input id="item" placeholder="持ち物 (例: カップ麺)" required>
      <input id="companion" placeholder="お供 (例: 普通の魔法使い)" required>
      <input id="enemy" class="full-width" placeholder="遭遇する者 (任意 / 例: フランドール)">
      <button type="submit">
        <span>👁️ 境界を覗く (送信)</span>
      </button>
    </form>

    <footer class="site-footer">
      <div class="gemini-power">
        Powered by 
        <svg class="gemini-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22C12 16.4772 7.52285 12 2 12C7.52285 12 12 7.52285 12 2C12 7.52285 16.4772 12 22 12C16.4772 12 12 16.4772 12 22Z"/>
          <path d="M19 8C19 6.34315 17.6569 5 16 5C17.6569 5 19 3.65685 19 2C19 3.65685 20.3431 5 22 5C20.3431 5 19 6.34315 19 8Z"/>
        </svg>
        Gemini
      </div>
      <div class="footer-links">
        <a href="https://shindanmaker.com/1208379?c=1" target="_blank" rel="noopener">
          生存率診断(元ネタ) <i class="fas fa-external-link-alt"></i>
        </a>
      </div>
      <div class="copyright">
        Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.
      </div>
    </footer>
  </div>

<script>
  // 年号
  document.getElementById("year").textContent = new Date().getFullYear();

  // --- アイコン画像管理ロジック ---
  const iconInput = document.getElementById('iconInput');
  const displayIcon = document.getElementById('displayIcon');
  const STORAGE_KEY_ICON = 'GENSOKYO_BOT_ICON';

  // 起動時に保存されたアイコンを読み込む
  window.addEventListener('load', () => {
    const savedIcon = localStorage.getItem(STORAGE_KEY_ICON);
    if (savedIcon) {
      displayIcon.src = savedIcon;
    } else {
      displayIcon.src = '../static/bot_icon.png';
    }
  });

  // アイコン読み込み失敗時のフォールバック
  function handleIconError(img) {
    img.style.display = 'none';
    const parent = img.parentElement;
    const oldLabel = parent.querySelector('.fallback-label');
    if (oldLabel) oldLabel.remove();
    
    const label = document.createElement('div');
    label.className = 'fallback-label';
    label.style.cssText = 'width:100%;height:100%;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#d4af37;font-size:14px;';
    label.innerText = '紫';
    parent.appendChild(label);
  }

  // 画像アップロードとリサイズ・切り抜き
  iconInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 200; 
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        let sourceX = 0, sourceY = 0, sourceSize = 0;
        if (img.width > img.height) {
          sourceSize = img.height;
          sourceX = (img.width - img.height) / 2;
        } else {
          sourceSize = img.width;
          sourceY = (img.height - img.width) / 2;
        }

        ctx.drawImage(img, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/png');
        localStorage.setItem(STORAGE_KEY_ICON, dataUrl);
        updateAllIcons(dataUrl);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function updateAllIcons(src) {
    const icons = document.querySelectorAll('.botIcon');
    icons.forEach(icon => {
      icon.src = src;
      icon.style.display = 'block';
      const label = icon.parentElement.querySelector('.fallback-label');
      if (label) label.remove();
    });
  }

  // --- メインロジック ---
  const form = document.getElementById("storyForm");
  const chat = document.getElementById("chat-container");
  const requiredInputs = [
    document.getElementById("name"),
    document.getElementById("action"),
    document.getElementById("item"),
    document.getElementById("companion")
  ];

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const apiKey = localStorage.getItem("GEMINI_API_KEY");

    let hasError = false;
    requiredInputs.forEach(input => {
      if (!input.value.trim()) {
        input.classList.add("error");
        hasError = true;
      } else {
        input.classList.remove("error");
      }
    });
    if (hasError) return;

    if (!apiKey) {
      pushBotMessage("通行証（APIキー）がないと、境界は開けないわ。右上の設定を確認してちょうだい。", true);
      return;
    }

    const data = {
      name: document.getElementById("name").value.trim(),
      action: document.getElementById("action").value.trim(),
      item: document.getElementById("item").value.trim(),
      companion: document.getElementById("companion").value.trim(),
      enemy: document.getElementById("enemy").value.trim() || "なし"
    };

    pushUserMessage(`挑戦者: ${data.name}\n行動: ${data.action}\n持ち物: ${data.item}\nお供: ${data.companion}\n遭遇: ${data.enemy}`);
    form.reset();

    const loadingId = pushBotMessage("境界を繋いでいるわ…… <span class='loading-eye'>👁️</span>", true);

    const prompt = `
あなたは東方Projectの八雲紫です。以下の情報を元に、幻想郷での運命をMarkdownで語ってください。
口調は優雅でミステリアス、時折恐ろしく。「〜かしら」「〜ね」「うふふ」を使用。

- 名前：${data.name}
- 行動：${data.action}
- 持ち物：${data.item}
- お供：${data.companion}
- 遭遇：${data.enemy}

### 1. 境界の向こう側
### 2. 生存率（%）
### 3. 結末（**生存**か**死亡**かを明記）
`;

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        }
      );

      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      
      const text = json.candidates[0].content.parts[0].text;
      removeMessage(loadingId);
      pushBotMessage(marked.parse(text), true);

    } catch (err) {
      removeMessage(loadingId);
      pushBotMessage(`あら、結界が乱れたわ。<br><small>${err.message}</small>`, true);
    }
  });

  function pushBotMessage(text, isHtml = false) {
    const msgId = "msg-" + Date.now();
    const box = document.createElement("div");
    box.className = "botContainer";
    box.id = msgId;

    const currentIcon = localStorage.getItem(STORAGE_KEY_ICON) || '../static/bot_icon.png';

    box.innerHTML = `
      <div class="icon-wrapper" onclick="document.getElementById('iconInput').click()">
        <img src="${currentIcon}" class="botIcon" alt="紫" onerror="handleIconError(this)">
      </div>
      <div class="botText">${text}</div>
    `;
    chat.appendChild(box);
    scrollToBottom();
    return msgId;
  }

  function pushUserMessage(text) {
    const wrapper = document.createElement("div");
    wrapper.className = "userContainer";
    const box = document.createElement("div");
    box.className = "userBubble";
    box.textContent = text;
    wrapper.appendChild(box);
    chat.appendChild(wrapper);
    scrollToBottom();
  }

  function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function scrollToBottom() {
    setTimeout(() => {
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    }, 50);
  }
</script>
</body>
</html>
