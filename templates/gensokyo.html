<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻想郷ジェネレーター - 境界の語り部</title>
<meta name="description" content="八雲紫があなたの幻想郷での運命を語ります。">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-main: #6b2c91;
    --purple-light: #9d4edd;
    --red-eye: #ff1a1a;
    --user-bubble: #3a3d52;
    --bot-msg-bg: rgba(20, 10, 30, 0.85);
    --font-serif: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-serif);
    background-color: var(--bg-color);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(90deg, #000, var(--purple-main), #000);
    color: var(--text-accent);
    padding: 12px 20px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    border-bottom: 2px solid var(--red-eye);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .setting-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.1);
    padding: 5px 12px;
    border-radius: 20px;
    font-family: sans-serif;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: radial-gradient(circle at 50% 50%, rgba(107, 44, 145, 0.1) 0%, transparent 80%);
  }

  .botContainer { display: flex; align-items: flex-start; gap: 14px; max-width: 95%; animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* アイコンタップ判定を確実にするためのスタイル */
  .icon-wrapper {
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    position: relative;
    border-radius: 50%;
    background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
    padding: 2px;
    cursor: pointer;
    z-index: 5;
    overflow: hidden; /* 中身がはみ出ないように */
  }

  .botIcon { 
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; 
    display: block; background: #000; pointer-events: none; /* 親のクリックを邪魔しない */
  }

  .botText {
    background: var(--bot-msg-bg);
    border: 1px solid rgba(157, 78, 221, 0.3);
    border-radius: 4px 18px 18px 18px;
    padding: 12px 16px;
    line-height: 1.6;
    font-size: 0.95rem;
    backdrop-filter: blur(5px);
  }

  .userContainer { display: flex; justify-content: flex-end; width: 100%; }
  .userBubble {
    background: var(--user-bubble);
    padding: 10px 16px;
    border-radius: 18px 4px 18px 18px;
    max-width: 80%;
    font-size: 0.9rem;
  }

  #bottom-area { background: #000; border-top: 1px solid var(--purple-main); z-index: 20; }
  #storyForm {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; max-width: 800px; margin: 0 auto;
  }
  input {
    background: rgba(255,255,255,0.05); border: 1px solid #333; color: #fff;
    padding: 12px; border-radius: 6px; font-size: 16px; outline: none;
    font-family: var(--font-serif);
  }
  .full-width { grid-column: span 2; }
  button[type="submit"] {
    grid-column: span 2; padding: 14px; border-radius: 6px; border: none;
    background: linear-gradient(to right, var(--purple-main), #4b0082);
    color: #fff; font-weight: bold; cursor: pointer; font-family: var(--font-serif);
  }

  /* --- モーダル共通 --- */
  .modal-overlay {
    position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95);
    z-index: 1000; display:none; flex-direction:column; align-items:center; justify-content:center;
    padding: 20px;
    touch-action: none; /* 背後のスクロール防止 */
  }

  /* プレビューモーダル */
  .preview-circle {
    width: 240px; height: 240px; border-radius: 50%; border: 3px solid var(--text-accent);
    overflow: hidden; background: #000; margin-bottom: 20px;
    box-shadow: 0 0 30px var(--purple-main);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-img { width: 100%; height: 100%; object-fit: cover; }
  .modal-text { text-align: center; color: var(--text-main); margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6; }
  .modal-tip { color: var(--text-accent); font-size: 0.8rem; margin-top: 8px; font-weight: bold; }

  /* 調整モーダル (SNS風) */
  .crop-viewport { 
    width: 280px; height: 280px; border-radius: 50%; border: 2px solid var(--purple-light); 
    overflow: hidden; position: relative; touch-action: none; background: #111;
    margin-bottom: 10px;
  }
  #cropImage { position: absolute; transform-origin: 0 0; cursor: move; pointer-events: none; }

  .modal-btn-group { display: flex; gap: 15px; width: 100%; max-width: 320px; }
  .modal-btn { 
    flex: 1; padding: 14px; border-radius: 8px; border: none; font-family: var(--font-serif); font-weight: bold; cursor: pointer; font-size: 1rem;
  }
  .btn-primary { background: var(--purple-main); color: #fff; box-shadow: 0 4px 10px rgba(107, 44, 145, 0.4); }
  .btn-secondary { background: #333; color: #fff; }

  /* Footer */
  .site-footer { padding: 15px; text-align: center; border-top: 1px solid #111; color: rgba(255,255,255,0.4); }
  .powered-by { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 5px; }
  .gemini-sparkle { width: 18px; height: 18px; }
  .gemini-text { font-weight: bold; font-size: 1rem; background: linear-gradient(90deg, #4E89FF, #FF7FDE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .loading-eye { animation: blink 1s infinite; color: var(--text-accent); }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
</style>
</head>
<body>

<header>
  <span>⛩ 幻想郷ジェネレーター</span>
  <a href="./Setting.html" class="setting-link">⚙ 設定</a>
</header>

<!-- 1. 拡大プレビューモーダル -->
<div id="previewModal" class="modal-overlay">
  <div class="preview-circle">
    <img src="" id="largeIconPreview" class="preview-img" onerror="handleIconError(this)">
  </div>
  <div class="modal-text">
    <p>現在の境界の姿（アイコン）よ。</p>
    <p>アイコンの変更が可能です。</p>
    <p class="modal-tip">推奨サイズ：400 × 400 px</p>
  </div>
  <div class="modal-btn-group">
    <button class="modal-btn btn-secondary" onclick="closePreviewModal()">閉じる</button>
    <button class="modal-btn btn-primary" onclick="triggerIconSelect()">変更する</button>
  </div>
</div>

<!-- 2. アイコン調整モーダル (SNS風ドラッグ) -->
<div id="cropModal" class="modal-overlay">
  <div class="modal-text"><p>位置と大きさを調整してちょうだい</p></div>
  <div class="crop-viewport" id="cropViewport"><img id="cropImage"></div>
  <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" style="width:280px; margin:20px 0;">
  <div class="modal-btn-group">
    <button class="modal-btn btn-secondary" onclick="closeCropModal()">キャンセル</button>
    <button class="modal-btn btn-primary" onclick="saveCroppedIcon()">保存</button>
  </div>
</div>

<input type="file" id="iconInput" accept="image/*" style="display:none">

<main id="chat-container">
  <!-- 最初のメッセージ -->
  <div class="botContainer">
    <div class="icon-wrapper">
      <img src="" class="botIcon" id="displayIcon" onerror="handleIconError(this)">
    </div>
    <div class="botText">
      あら、境界を越えてここまで来るとは物好きね。<br>
      あなたの名と、今持っている物を教えてちょうだい。<br>
      私が「境界」を弄って、あなたの行く末を少しだけ覗いてあげるわ。
    </div>
  </div>
</main>

<div id="bottom-area">
  <form id="storyForm">
    <input id="name" placeholder="名前" required>
    <input id="action" placeholder="行動" required>
    <input id="item" placeholder="持ち物" required>
    <input id="companion" placeholder="お供" required>
    <input id="enemy" class="full-width" placeholder="遭遇者 (任意)">
    <button type="submit">👁️ 境界を覗く</button>
  </form>

  <footer class="site-footer">
    <div class="powered-by">
      <svg class="gemini-sparkle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L14.85 9.15L22 12L14.85 14.85L12 22L9.15 14.85L2 12L9.15 9.15L12 2Z" fill="url(#grad)"/>
        <defs><linearGradient id="grad" x1="2" y1="12" x2="22" y2="12" gradientUnits="userSpaceOnUse"><stop stop-color="#4E89FF"/><stop offset="1" stop-color="#FF7FDE"/></linearGradient></defs>
      </svg>
      <span>Powered by</span>
      <span class="gemini-text">Gemini</span>
    </div>
    <div style="font-size:0.75rem;">Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</div>
  </footer>
</div>

<script>
  const STORAGE_KEY_ICON = 'GENSOKYO_BOT_ICON_V2';
  const chatContainer = document.getElementById('chat-container');
  const iconInput = document.getElementById('iconInput');
  const previewModal = document.getElementById('previewModal');
  const cropModal = document.getElementById('cropModal');
  const largePreview = document.getElementById('largeIconPreview');
  const cropImg = document.getElementById('cropImage');
  const zoom = document.getElementById('zoomSlider');
  const vp = document.getElementById('cropViewport');

  // --- 年号更新 ---
  document.getElementById("year").textContent = new Date().getFullYear();

  // --- イベント委譲：アイコンタップ判定 ---
  chatContainer.addEventListener('click', (e) => {
    // クリックされた要素の親を遡って .icon-wrapper かチェック
    const wrapper = e.target.closest('.icon-wrapper');
    if (wrapper) {
      openPreviewModal();
    }
  });

  function openPreviewModal() {
    const saved = localStorage.getItem(STORAGE_KEY_ICON);
    if (saved) {
      largePreview.src = saved;
      largePreview.style.display = 'block';
      const fb = largePreview.parentElement.querySelector('.fb');
      if (fb) fb.remove();
    }
    previewModal.style.display = 'flex';
  }

  function closePreviewModal() { previewModal.style.display = 'none'; }

  function triggerIconSelect() {
    closePreviewModal();
    iconInput.click();
  }

  function handleIconError(img) {
    img.style.display = 'none';
    const parent = img.parentElement;
    if (!parent.querySelector('.fb')) {
      const fb = document.createElement('div');
      fb.className = 'fb'; fb.innerText = '紫';
      fb.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-accent);font-weight:bold;font-size:24px;';
      if(parent.classList.contains('preview-circle')) fb.style.fontSize = '80px';
      parent.appendChild(fb);
    }
  }

  function initIcon() {
    const saved = localStorage.getItem(STORAGE_KEY_ICON);
    if (saved) {
      document.querySelectorAll('.botIcon').forEach(i => {
        i.src = saved;
        i.style.display = 'block';
        const fb = i.parentElement.querySelector('.fb');
        if (fb) fb.remove();
      });
      largePreview.src = saved;
    }
  }
  window.addEventListener('load', initIcon);

  // --- SNS風調整 (Crop & Drag) ---
  let imgState = { x: 0, y: 0, scale: 1 };

  iconInput.onchange = (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      cropImg.src = ev.target.result;
      cropImg.onload = () => {
        const baseScale = 280 / Math.min(cropImg.width, cropImg.height);
        imgState.scale = baseScale;
        imgState.x = (280 - cropImg.width * imgState.scale) / 2;
        imgState.y = (280 - cropImg.height * imgState.scale) / 2;
        zoom.min = baseScale * 0.5;
        zoom.max = baseScale * 5;
        zoom.value = imgState.scale;
        updateCrop();
        cropModal.style.display = 'flex';
      };
    };
    r.readAsDataURL(f);
  };

  function updateCrop() { cropImg.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`; }
  function closeCropModal() { cropModal.style.display = 'none'; iconInput.value = ''; }

  function saveCroppedIcon() {
    const canvas = document.createElement('canvas');
    canvas.width = 400; canvas.height = 400;
    const ctx = canvas.getContext('2d');
    const ratio = 400 / 280;
    ctx.save();
    ctx.translate(imgState.x * ratio, imgState.y * ratio);
    ctx.scale(imgState.scale * ratio, imgState.scale * ratio);
    ctx.drawImage(cropImg, 0, 0);
    ctx.restore();
    
    const dataUrl = canvas.toDataURL('image/png');
    localStorage.setItem(STORAGE_KEY_ICON, dataUrl);
    
    // 画面上の全てのアイコンを即時更新
    document.querySelectorAll('.botIcon, .preview-img').forEach(i => {
      i.src = dataUrl;
      i.style.display = 'block';
      const fb = i.parentElement.querySelector('.fb');
      if (fb) fb.remove();
    });
    closeCropModal();
  }

  // ドラッグ操作（PC & スマホ）
  let isDragging = false, startX, startY;
  const onDragStart = (e) => { 
    isDragging = true; 
    const ev = e.touches ? e.touches[0] : e;
    startX = ev.clientX - imgState.x; 
    startY = ev.clientY - imgState.y; 
  };
  const onDragMove = (e) => { 
    if(isDragging) { 
      const ev = e.touches ? e.touches[0] : e;
      imgState.x = ev.clientX - startX; 
      imgState.y = ev.clientY - startY; 
      updateCrop(); 
    } 
  };
  const onDragEnd = () => isDragging = false;

  vp.addEventListener('mousedown', onDragStart);
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragEnd);
  vp.addEventListener('touchstart', onDragStart, {passive: false});
  window.addEventListener('touchmove', onDragMove, {passive: false});
  window.addEventListener('touchend', onDragEnd);

  zoom.oninput = () => { imgState.scale = parseFloat(zoom.value); updateCrop(); };

  // --- 診断ロジック ---
  const storyForm = document.getElementById('storyForm');
  storyForm.onsubmit = async (e) => {
    e.preventDefault();
    const apiKey = localStorage.getItem("GEMINI_API_KEY") || "";
    if(!apiKey) { 
      pushBotMsg("あら、設定画面で「境界の鍵(APIキー)」を登録してこないと、物語は始まらないわ。"); 
      return; 
    }

    const data = {
      n: document.getElementById('name').value,
      a: document.getElementById('action').value,
      i: document.getElementById('item').value,
      c: document.getElementById('companion').value,
      e: document.getElementById('enemy').value || "なし"
    };

    pushUserMsg(`${data.n}は「${data.a}」を試みる。`);
    const loadingId = pushBotMsg("境界を弄っているわ…… <span class='loading-eye'>👁️</span>");
    storyForm.reset();

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{ parts: [{ text: `あなたは東方Projectの八雲紫です。以下の情報を元に、幻想郷での運命をMarkdownで優雅かつ少し恐ろしく語ってください。
名前:${data.n}, 行動:${data.a}, 持ち物:${data.i}, お供:${data.c}, 遭遇者:${data.e}
### 1. 境界の向こう側 (物語)
### 2. 生存率
### 3. 結末（生存か死亡かを明記）` }] }]
        })
      });
      const resData = await response.json();
      if(resData.error) throw new Error();
      const text = resData.candidates[0].content.parts[0].text;
      document.getElementById(loadingId).remove();
      pushBotMsg(marked.parse(text));
    } catch {
      const el = document.getElementById(loadingId);
      if(el) el.innerHTML = "あら、スキマの繋がりが悪いみたい。APIキーが正しいか確認してちょうだい。";
    }
  };

  function pushBotMsg(t) {
    const id = "b" + Date.now();
    const div = document.createElement('div');
    div.className = "botContainer"; div.id = id;
    const src = localStorage.getItem(STORAGE_KEY_ICON);
    div.innerHTML = `
      <div class="icon-wrapper">
        <img src="${src || ''}" class="botIcon" style="${src ? '' : 'display:none'}" onerror="handleIconError(this)">
      </div>
      <div class="botText">${t}</div>
    `;
    chatContainer.appendChild(div);
    div.scrollIntoView({behavior:'smooth'});
    return id;
  }

  function pushUserMsg(t) {
    const div = document.createElement('div');
    div.className = "userContainer";
    div.innerHTML = `<div class="userBubble">${t}</div>`;
    chatContainer.appendChild(div);
    div.scrollIntoView({behavior:'smooth'});
  }
</script>
</body>
</html>
