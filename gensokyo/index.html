<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻想郷ジェネレーター - 境界の語り部</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-dark: #240b36;
    --purple-main: #6b2c91;
    --purple-light: #9d4edd;
    --red-eye: #ff1a1a;
    --user-bubble: #2d2f3f;
    --bot-msg-bg: rgba(30, 15, 45, 0.9);
    --font-serif: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-serif);
    background-color: var(--bg-color);
    color: var(--text-main);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(90deg, #000, var(--purple-main), #000);
    color: var(--text-accent);
    padding: 12px 15px;
    text-align: center;
    border-bottom: 2px solid var(--red-eye);
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }
  header h1 { font-size: 1.1rem; letter-spacing: 0.1em; }

  .setting-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.1);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: sans-serif;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: radial-gradient(circle at 50% 20%, rgba(107, 44, 145, 0.2) 0%, transparent 70%);
  }

  .botContainer { display: flex; align-items: flex-start; gap: 12px; max-width: 100%; animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .icon-wrapper {
    flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
    padding: 2px; cursor: pointer; box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
    transition: transform 0.2s; position: relative;
  }
  .icon-wrapper:active { transform: scale(0.9); }
  
  /* アイコン編集を示す小さなペンマーク (ホバー時のみ表示) */
  .icon-wrapper::after {
    content: '✎'; position: absolute; bottom: 0; right: 0; background: var(--purple-main);
    color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; border: 1px solid white;
    opacity: 0; transition: opacity 0.2s;
  }
  .icon-wrapper:hover::after { opacity: 1; }

  .botIcon { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; pointer-events: none; }

  .botText {
    background: var(--bot-msg-bg); border: 1px solid rgba(157, 78, 221, 0.4);
    border-radius: 4px 20px 20px 20px; padding: 14px 18px; line-height: 1.7;
    font-size: 0.95rem; backdrop-filter: blur(10px); max-width: 85%;
    box-shadow: 4px 4px 15px rgba(0,0,0,0.5);
  }

  .userContainer { display: flex; justify-content: flex-end; width: 100%; }
  .userBubble {
    background: var(--user-bubble); padding: 12px 18px;
    border-radius: 20px 4px 20px 20px; max-width: 80%; font-size: 0.9rem;
  }

  #bottom-area { background: #050208; border-top: 1px solid var(--purple-main); padding-bottom: env(safe-area-inset-bottom); }
  #storyForm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; max-width: 900px; margin: 0 auto; }

  input {
    background: rgba(255,255,255,0.07); border: 1px solid #333; color: #fff;
    padding: 12px; border-radius: 8px; font-size: 16px; outline: none; font-family: var(--font-serif);
  }
  .full-width { grid-column: span 2; }

  button[type="submit"] {
    grid-column: span 2; padding: 16px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
    color: #fff; font-weight: bold; cursor: pointer; font-family: var(--font-serif); font-size: 1.1rem;
  }

  /* モーダル関連 */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
  }
  .crop-container {
    width: 300px; height: 300px; border-radius: 50%; border: 2px solid var(--text-accent);
    overflow: hidden; position: relative; background: #111; touch-action: none;
  }
  #crop-image { position: absolute; transform-origin: top left; cursor: move; user-select: none; }
  .modal-controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 80%; }
  .modal-btns { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
  .btn-save { background: var(--purple-main); color: white; }
  .btn-cancel { background: #444; color: white; }
  
  .site-footer { padding: 15px; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.75rem; }
  .site-footer a { color: var(--purple-light); text-decoration: none; }
  .fa-external-link-alt { font-size: 0.7rem; margin-left: 2px; }
  .gemini-text { font-weight: bold; background: linear-gradient(90deg, #4E89FF, #FF7FDE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .loading-eye { animation: blink 1.2s infinite; color: var(--text-accent); display: inline-block; }
  @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1.1); } 50% { opacity: 0.3; transform: scale(0.9); } }
</style>
</head>
<body>

<header>
  <h1>⛩ 幻想郷ジェネレーター</h1>
  <a href="./setting" class="setting-link">⚙ 設定</a>
</header>

<main id="chat-container">
  <div class="botContainer">
    <div class="icon-wrapper" onclick="triggerFileSelect()">
      <img src="" class="botIcon" onerror="handleIconError(this)">
    </div>
    <div class="botText">
      あらあら、外の世界から迷い込んできたの？<br>
      歓迎するわ、幻想郷へ。<br><br>
      あなたの名や、持っている物を教えてちょうだい。<br>
      この私が、あなたの「運命の境界」を覗いてあげるから……うふふ。
    </div>
  </div>
</main>

<div id="bottom-area">
  <form id="storyForm">
    <input id="name" placeholder="名前" required autocomplete="off">
    <input id="action" placeholder="行動" required autocomplete="off">
    <input id="item" placeholder="持ち物" required autocomplete="off">
    <input id="companion" placeholder="お供" required autocomplete="off">
    <input id="enemy" class="full-width" placeholder="遭遇者 (任意)" autocomplete="off">
    <button type="submit" id="submitBtn">👁️ 境界を覗く</button>
  </form>
  <footer class="site-footer">
    <div style="margin-bottom:6px;">元ネタ：<a href="https://shindanmaker.com/1208379?c=1" target="_blank" rel="noopener">もし幻想郷に行った時の生存率診断 <i class="fas fa-external-link-alt"></i></a></div>
    <div style="margin-bottom:6px;">Powered by <span class="gemini-text">Gemini 2.5 Flash</span></div>
    <div>Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</div>
  </footer>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<!-- トリミングモーダル -->
<div id="cropModal" class="modal-overlay">
  <div class="crop-container" id="cropViewport">
    <img id="crop-image" src="">
  </div>
  <div class="modal-controls">
    <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" style="width: 100%;">
    <p style="font-size: 0.8rem; color: #ccc;">ドラッグで位置調整、スライダーで拡大縮小</p>
    <p style="font-size: 0.75rem; color: var(--text-accent); font-weight: bold;">推奨サイズ：400 × 400 px</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCropModal()">キャンセル</button>
      <button class="btn-save" onclick="applyCrop()">保存する</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY_ICON = 'GENSOKYO_BOT_ICON_V3';
  const chatContainer = document.getElementById('chat-container');
  const storyForm = document.getElementById('storyForm');
  const fileInput = document.getElementById('fileInput');
  const cropModal = document.getElementById('cropModal');
  const cropImg = document.getElementById('crop-image');
  const zoomSlider = document.getElementById('zoomSlider');
  const cropViewport = document.getElementById('cropViewport');

  document.getElementById("year").textContent = new Date().getFullYear();

  function handleIconError(img) {
    img.style.display = 'none';
    const parent = img.parentElement;
    if (!parent.querySelector('.fb')) {
      const fb = document.createElement('div'); fb.className = 'fb'; fb.innerText = '紫';
      fb.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-accent);font-weight:bold;';
      parent.appendChild(fb);
    }
  }

  function initIcon() {
    const saved = localStorage.getItem(STORAGE_KEY_ICON);
    if (saved) {
      document.querySelectorAll('.botIcon').forEach(i => {
        i.src = saved; i.style.display = 'block';
        const fb = i.parentElement.querySelector('.fb'); if (fb) fb.remove();
      });
    }
  }
  window.addEventListener('load', initIcon);

  // --- ファイル選択/トリミング ---
  let imgState = { x: 0, y: 0, scale: 1 };
  const viewportSize = 300;

  function triggerFileSelect() { fileInput.click(); }

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      cropImg.src = ev.target.result;
      cropImg.onload = () => {
        const baseScale = viewportSize / Math.min(cropImg.width, cropImg.height);
        imgState.scale = baseScale;
        imgState.x = (viewportSize - cropImg.width * baseScale) / 2;
        imgState.y = (viewportSize - cropImg.height * baseScale) / 2;
        zoomSlider.min = baseScale * 0.5;
        zoomSlider.max = baseScale * 5;
        zoomSlider.value = baseScale;
        updateCropTransform();
        cropModal.style.display = 'flex';
      };
    };
    reader.readAsDataURL(file);
  };

  function updateCropTransform() {
    cropImg.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`;
  }

  function closeCropModal() { cropModal.style.display = 'none'; fileInput.value = ''; }

  function applyCrop() {
    const canvas = document.createElement('canvas');
    canvas.width = 400; canvas.height = 400;
    const ctx = canvas.getContext('2d');
    const ratio = 400 / viewportSize;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, 400, 400);
    ctx.save();
    ctx.translate(imgState.x * ratio, imgState.y * ratio);
    ctx.scale(imgState.scale * ratio, imgState.scale * ratio);
    ctx.drawImage(cropImg, 0, 0);
    ctx.restore();
    const dataUrl = canvas.toDataURL('image/png');
    localStorage.setItem(STORAGE_KEY_ICON, dataUrl);
    initIcon();
    closeCropModal();
  }

  // ドラッグ操作
  let isDragging = false, lastX, lastY;
  const onStart = (e) => {
    isDragging = true;
    const ev = e.touches ? e.touches[0] : e;
    lastX = ev.clientX; lastY = ev.clientY;
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!isDragging) return;
    const ev = e.touches ? e.touches[0] : e;
    const deltaX = ev.clientX - lastX;
    const deltaY = ev.clientY - lastY;
    imgState.x += deltaX; imgState.y += deltaY;
    lastX = ev.clientX; lastY = ev.clientY;
    updateCropTransform();
    e.preventDefault();
  };
  const onEnd = () => isDragging = false;

  cropViewport.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  cropViewport.addEventListener('touchstart', onStart, {passive: false});
  window.addEventListener('touchmove', onMove, {passive: false});
  window.addEventListener('touchend', onEnd);
  zoomSlider.oninput = () => { imgState.scale = parseFloat(zoomSlider.value); updateCropTransform(); };

  // --- ストーリー生成 ---
  async function typeWriter(element, markdown) {
    const html = marked.parse(markdown);
    element.innerHTML = "";
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = html;
    const nodes = Array.from(tempDiv.childNodes);
    for (let node of nodes) {
      const newNode = node.cloneNode(true);
      element.appendChild(newNode);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      await new Promise(r => setTimeout(r, 40));
    }
  }

  storyForm.onsubmit = async (e) => {
    e.preventDefault();
    const apiKey = (localStorage.getItem("GEMINI_API_KEY") || "").trim();
    if(!apiKey) { pushBotMsg("設定からAPIキーを入力してちょうだい。"); return; }
    const data = { 
      n: document.getElementById('name').value, 
      a: document.getElementById('action').value, 
      i: document.getElementById('item').value, 
      c: document.getElementById('companion').value, 
      e: document.getElementById('enemy').value || "なし" 
    };
    pushUserMsg(`${data.n}は「${data.a}」を試みる。`);
    const botMsgId = pushBotMsg("境界を弄っているわ…… <span class='loading-eye'>👁️</span>");
    const botTextElem = document.getElementById(botMsgId).querySelector('.botText');
    storyForm.reset();
    document.getElementById('submitBtn').disabled = true;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST', 
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ 
          contents: [{ parts: [{ text: `あなたは東方Projectの八雲紫です。以下の情報を元に物語を Markdown 形式で語ってください。
口調は優雅でミステリアス、時折恐ろしく。「〜かしら」「〜ね」「うふふ」を使用し、読者を「境界の外の迷い人」として扱ってください。

【挑戦者】名前:${data.n}, 行動:${data.a}, 持ち物:${data.i}, お供:${data.c}, 遭遇者:${data.e}

【出力構成】
1. ### あらすじ
2. ### 境界の向こう側
3. ### 生存率
4. ### 結末` }] }] 
        })
      });
      const res = await response.json();
      const answer = res.candidates[0].content.parts[0].text;
      botTextElem.innerHTML = "";
      await typeWriter(botTextElem, answer);
    } catch (err) {
      botTextElem.innerHTML = `<span style='color:var(--red-eye)'>境界の接続に失敗したわ。</span>`;
    } finally {
      document.getElementById('submitBtn').disabled = false;
    }
  };

  function pushBotMsg(t) {
    const id = "b" + Date.now();
    const div = document.createElement('div');
    div.className = "botContainer"; div.id = id;
    const src = localStorage.getItem(STORAGE_KEY_ICON);
    div.innerHTML = `
      <div class="icon-wrapper" onclick="triggerFileSelect()">
        <img src="${src||''}" class="botIcon" style="${src?'':'display:none'}" onerror="handleIconError(this)">
      </div>
      <div class="botText">${t}</div>
    `;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return id;
  }

  function pushUserMsg(t) {
    const div = document.createElement('div');
    div.className = "userContainer";
    div.innerHTML = `<div class="userBubble">${t}</div>`;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
</script>
</body>
</html>
