<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幻想郷ジェネレーター - 境界の語り部</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-dark: #240b36;
    --purple-main: #6b2c91;
    --purple-light: #9d4edd;
    --red-eye: #ff1a1a;
    --user-bubble: #2d2f3f;
    --bot-msg-bg: rgba(30, 15, 45, 0.9);
    --font-serif: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font-serif);
    background-color: var(--bg-color);
    color: var(--text-main);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(90deg, #000, var(--purple-main), #000);
    color: var(--text-accent);
    padding: 12px 15px;
    text-align: center;
    border-bottom: 2px solid var(--red-eye);
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 15px rgba(0,0,0,0.8);
  }
  header h1 { font-size: 1.1rem; letter-spacing: 0.1em; }

  .setting-link {
    color: var(--text-main);
    text-decoration: none;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.1);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: sans-serif;
    transition: 0.3s;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: radial-gradient(circle at 50% 20%, rgba(107, 44, 145, 0.2) 0%, transparent 70%);
  }

  .botContainer { display: flex; align-items: flex-start; gap: 12px; max-width: 100%; animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .icon-wrapper {
    flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
    padding: 2px; cursor: pointer; box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
    transition: transform 0.2s;
  }
  .icon-wrapper:active { transform: scale(0.9); }
  .botIcon { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; pointer-events: none; }

  .botText {
    background: var(--bot-msg-bg); border: 1px solid rgba(157, 78, 221, 0.4);
    border-radius: 4px 20px 20px 20px; padding: 14px 18px; line-height: 1.7;
    font-size: 0.95rem; backdrop-filter: blur(10px); max-width: 85%;
  }

  .userContainer { display: flex; justify-content: flex-end; width: 100%; }
  .userBubble {
    background: var(--user-bubble); padding: 12px 18px;
    border-radius: 20px 4px 20px 20px; max-width: 80%; font-size: 0.9rem;
  }

  #bottom-area { background: #050208; border-top: 1px solid var(--purple-main); padding-bottom: env(safe-area-inset-bottom); }
  #storyForm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; max-width: 900px; margin: 0 auto; }
  
  input {
    background: rgba(255,255,255,0.07); border: 1px solid #333; color: #fff;
    padding: 12px; border-radius: 8px; font-size: 16px; outline: none; font-family: var(--font-serif);
  }
  .full-width { grid-column: span 2; }

  button[type="submit"] {
    grid-column: span 2; padding: 16px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
    color: #fff; font-weight: bold; cursor: pointer; font-family: var(--font-serif); font-size: 1.1rem;
  }

  /* モーダル群 */
  .modal-overlay {
    position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.97);
    z-index: 2000; display:none; flex-direction:column; align-items:center; justify-content:center;
    padding: 20px; touch-action: none;
  }
  .preview-circle {
    width: min(75vw, 320px); height: min(75vw, 320px); border-radius: 50%; border: 4px solid var(--text-accent);
    overflow: hidden; background: #000; margin-bottom: 25px; box-shadow: 0 0 40px var(--purple-main);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-img { width: 100%; height: 100%; object-fit: cover; }

  .crop-viewport { 
    width: min(85vw, 340px); height: min(85vw, 340px); border-radius: 50%; border: 2px solid var(--purple-light); 
    overflow: hidden; position: relative; touch-action: none; background: #111; margin-bottom: 20px;
  }
  #cropImage { position: absolute; transform-origin: 0 0; }

  .modal-btn-group { display: flex; gap: 15px; width: 100%; max-width: 400px; }
  .modal-btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-family: var(--font-serif); font-weight: bold; cursor: pointer; }
  .btn-primary { background: var(--purple-main); color: #fff; }
  .btn-secondary { background: #444; color: #fff; }

  /* フッター */
  .site-footer { padding: 15px; text-align: center; color: rgba(255,255,255,0.3); font-size: 0.75rem; }
  .gemini-text { font-weight: bold; background: linear-gradient(90deg, #4E89FF, #FF7FDE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .loading-eye { animation: blink 1.2s infinite; color: var(--text-accent); }
  @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1.1); } 50% { opacity: 0.3; transform: scale(0.9); } }
</style>
</head>
<body>

<header>
  <h1>⛩ 幻想郷ジェネレーター</h1>
  <a href="./setting/" class="setting-link">⚙ 設定</a>
</header>

<!-- プレビューモーダル -->
<div id="previewModal" class="modal-overlay">
  <div class="preview-circle">
    <img src="" id="largeIconPreview" class="preview-img" onerror="handleIconError(this)">
  </div>
  <p style="text-align:center; margin-bottom:20px;">境界の向こう側の姿ね。</p>
  <div class="modal-btn-group">
    <button class="modal-btn btn-secondary" onclick="closePreviewModal()">戻る</button>
    <button class="modal-btn btn-primary" onclick="triggerIconSelect()">姿を変える</button>
  </div>
</div>

<!-- クロップモーダル -->
<div id="cropModal" class="modal-overlay">
  <p style="margin-bottom:20px;">境界に合うよう、位置を調整してちょうだい</p>
  <div class="crop-viewport" id="cropViewport"><img id="cropImage"></div>
  <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" style="width:min(85vw, 340px); margin:20px 0;">
  <div class="modal-btn-group">
    <button class="modal-btn btn-secondary" onclick="closeCropModal()">やめる</button>
    <button class="modal-btn btn-primary" onclick="saveCroppedIcon()">保存</button>
  </div>
</div>

<input type="file" id="iconInput" accept="image/*" style="display:none">

<main id="chat-container">
  <div class="botContainer">
    <div class="icon-wrapper"><img src="" class="botIcon" id="displayIcon" onerror="handleIconError(this)"></div>
    <div class="botText">
      あら、境界を越えてここまで来るとは物好きね。<br>
      あなたの名と、今持っている物を教えてちょうだい。<br>
      私が「境界」を弄って、あなたの行く末を少しだけ覗いてあげるわ。
    </div>
  </div>
</main>

<div id="bottom-area">
  <form id="storyForm">
    <input id="name" placeholder="名前" required>
    <input id="action" placeholder="行動" required>
    <input id="item" placeholder="持ち物" required>
    <input id="companion" placeholder="お供" required>
    <input id="enemy" class="full-width" placeholder="遭遇者 (任意)">
    <button type="submit">👁️ 境界を覗く</button>
  </form>
  <footer class="site-footer">
    <div style="margin-bottom:6px;">Powered by <span class="gemini-text">Gemini</span></div>
    <div>Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</div>
  </footer>
</div>

<script>
  const STORAGE_KEY_ICON = 'GENSOKYO_BOT_ICON_V3';
  const chatContainer = document.getElementById('chat-container');
  const iconInput = document.getElementById('iconInput');
  const previewModal = document.getElementById('previewModal');
  const cropModal = document.getElementById('cropModal');
  const largePreview = document.getElementById('largeIconPreview');
  const cropImg = document.getElementById('cropImage');
  const zoom = document.getElementById('zoomSlider');
  const vp = document.getElementById('cropViewport');

  document.getElementById("year").textContent = new Date().getFullYear();

  chatContainer.addEventListener('click', (e) => {
    if (e.target.closest('.icon-wrapper')) openPreviewModal();
  });

  function openPreviewModal() {
    const saved = localStorage.getItem(STORAGE_KEY_ICON);
    if (saved) {
      largePreview.src = saved; largePreview.style.display = 'block';
      const fb = largePreview.parentElement.querySelector('.fb'); if (fb) fb.remove();
    }
    previewModal.style.display = 'flex';
  }
  function closePreviewModal() { previewModal.style.display = 'none'; }
  function triggerIconSelect() { closePreviewModal(); iconInput.click(); }

  function handleIconError(img) {
    img.style.display = 'none';
    const parent = img.parentElement;
    if (!parent.querySelector('.fb')) {
      const fb = document.createElement('div'); fb.className = 'fb'; fb.innerText = '紫';
      fb.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-accent);font-weight:bold;';
      fb.style.fontSize = parent.classList.contains('preview-circle') ? '80px' : '22px';
      parent.appendChild(fb);
    }
  }

  function initIcon() {
    const saved = localStorage.getItem(STORAGE_KEY_ICON);
    if (saved) {
      document.querySelectorAll('.botIcon, #largeIconPreview').forEach(i => {
        i.src = saved; i.style.display = 'block';
        const fb = i.parentElement.querySelector('.fb'); if (fb) fb.remove();
      });
    }
  }
  window.addEventListener('load', initIcon);

  // クロップロジック
  let imgState = { x: 0, y: 0, scale: 1 };
  const viewportSize = Math.min(window.innerWidth * 0.85, 340);

  iconInput.onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      cropImg.src = ev.target.result;
      cropImg.onload = () => {
        const baseScale = viewportSize / Math.min(cropImg.width, cropImg.height);
        imgState = { x: (viewportSize - cropImg.width * baseScale) / 2, y: (viewportSize - cropImg.height * baseScale) / 2, scale: baseScale };
        zoom.min = baseScale * 0.2; zoom.max = baseScale * 6; zoom.value = baseScale;
        updateCrop(); cropModal.style.display = 'flex';
      };
    };
    r.readAsDataURL(f);
  };

  function updateCrop() { cropImg.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`; }
  function closeCropModal() { cropModal.style.display = 'none'; iconInput.value = ''; }

  function saveCroppedIcon() {
    const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400;
    const ctx = canvas.getContext('2d'); const ratio = 400 / viewportSize;
    ctx.save(); ctx.translate(imgState.x * ratio, imgState.y * ratio); ctx.scale(imgState.scale * ratio, imgState.scale * ratio);
    ctx.drawImage(cropImg, 0, 0); ctx.restore();
    const dataUrl = canvas.toDataURL('image/png'); localStorage.setItem(STORAGE_KEY_ICON, dataUrl);
    initIcon(); closeCropModal();
  }

  let isDragging = false, startX, startY;
  const onStart = (e) => { isDragging = true; const ev = e.touches ? e.touches[0] : e; startX = ev.clientX - imgState.x; startY = ev.clientY - imgState.y; };
  const onMove = (e) => { if(!isDragging) return; const ev = e.touches ? e.touches[0] : e; imgState.x = ev.clientX - startX; imgState.y = ev.clientY - startY; updateCrop(); };
  vp.addEventListener('mousedown', onStart); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', () => isDragging = false);
  vp.addEventListener('touchstart', onStart, {passive: false}); window.addEventListener('touchmove', onMove, {passive: false}); window.addEventListener('touchend', () => isDragging = false);
  zoom.oninput = () => { imgState.scale = parseFloat(zoom.value); updateCrop(); };

  // API
  const storyForm = document.getElementById('storyForm');
  storyForm.onsubmit = async (e) => {
    e.preventDefault();
    const apiKey = localStorage.getItem("GEMINI_API_KEY") || "";
    if(!apiKey) { pushBotMsg("設定画面で「境界の鍵」を登録してちょうだい。"); return; }
    const data = { n: document.getElementById('name').value, a: document.getElementById('action').value, i: document.getElementById('item').value, c: document.getElementById('companion').value, e: document.getElementById('enemy').value || "なし" };
    pushUserMsg(`${data.n}は「${data.a}」を試みる。`);
    const loadingId = pushBotMsg("境界を弄っているわ…… <span class='loading-eye'>👁️</span>");
    storyForm.reset();
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ contents: [{ parts: [{ text: `あなたは東方Projectの八雲紫です。以下の要素で物語をMarkdownで語って。名前:${data.n}, 行動:${data.a}, 持ち物:${data.i}, お供:${data.c}, 敵:${data.e}\n### 1. 境界の向こう側\n### 2. 生存率\n### 3. 結末` }] }] })
      });
      const res = await response.json(); document.getElementById(loadingId).remove();
      pushBotMsg(marked.parse(res.candidates[0].content.parts[0].text));
    } catch { document.getElementById(loadingId).innerHTML = "鍵を確認して。"; }
  };

  function pushBotMsg(t) {
    const id = "b" + Date.now(); const div = document.createElement('div'); div.className = "botContainer"; div.id = id;
    const src = localStorage.getItem(STORAGE_KEY_ICON);
    div.innerHTML = `<div class="icon-wrapper"><img src="${src||''}" class="botIcon" style="${src?'':'display:none'}" onerror="handleIconError(this)"></div><div class="botText">${t}</div>`;
    chatContainer.appendChild(div); div.scrollIntoView({behavior:'smooth'}); return id;
  }
  function pushUserMsg(t) {
    const div = document.createElement('div'); div.className = "userContainer"; div.innerHTML = `<div class="userBubble">${t}</div>`;
    chatContainer.appendChild(div); div.scrollIntoView({behavior:'smooth'});
  }
</script>
</body>
</html>
