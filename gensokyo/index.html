    <style>
        :root {
            --bg-color: #0d0616;
            --text-main: #f8f0fc;
            --text-accent: #d4af37;
            --purple-dark: #240b36;
            --purple-main: #6b2c91;
            --purple-light: #9d4edd;
            --red-eye: #ff1a1a;
            --user-bubble: #2d2f3f;
            --bot-msg-bg: rgba(30, 15, 45, 0.9);
            --font-serif: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-serif);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ヘッダー --- */
        header {
            background: linear-gradient(90deg, #000, var(--purple-main), #000);
            color: var(--text-accent);
            padding: 12px 15px;
            text-align: center;
            border-bottom: 2px solid var(--red-eye);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.8);
        }

        header h1 {
            font-size: 1.1rem;
            letter-spacing: 0.1em;
        }

        .setting-btn {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .setting-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- メインコンテンツ（チャット） --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: radial-gradient(circle at 50% 20%, rgba(107, 44, 145, 0.2) 0%, transparent 70%);
        }

        .botContainer {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .icon-wrapper {
            flex-shrink: 0;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--red-eye), var(--purple-main));
            padding: 2px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
            transition: transform 0.2s;
            position: relative;
        }

        .icon-wrapper:active {
            transform: scale(0.9);
        }

        .icon-wrapper::after {
            content: '✎';
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--purple-main);
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .icon-wrapper:hover::after {
            opacity: 1;
        }

        .botIcon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
            pointer-events: none;
        }

        .botText {
            background: var(--bot-msg-bg);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 4px 20px 20px 20px;
            padding: 14px 18px;
            line-height: 1.7;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            max-width: 85%;
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.5);
        }

        .botText h3 {
            color: var(--text-accent);
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-size: 1.1em;
            border-bottom: 1px solid var(--purple-main);
            padding-bottom: 4px;
        }

        .botText p {
            margin-bottom: 0.8em;
        }

        .botText p:last-child {
            margin-bottom: 0;
        }

        .userContainer {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .userBubble {
            background: var(--user-bubble);
            padding: 12px 18px;
            border-radius: 20px 4px 20px 20px;
            max-width: 80%;
            font-size: 0.9rem;
            border: 1px solid #444;
        }

        /* --- 入力エリア --- */
        #bottom-area {
            background: #050208;
            border-top: 1px solid var(--purple-main);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #storyForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        input[type="text"],
        input[type="password"] {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            font-family: var(--font-serif);
            width: 100%;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--purple-light);
        }

        .full-width {
            grid-column: span 2;
        }

        button[type="submit"] {
            grid-column: span 2;
            padding: 16px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-family: var(--font-serif);
            font-size: 1.1rem;
            transition: filter 0.2s;
        }

        button[type="submit"]:hover:not(:disabled) {
            filter: brightness(1.2);
        }

        button[type="submit"]:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* --- フッター --- */
        .site-footer {
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }

        .site-footer a {
            color: var(--purple-light);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .site-footer a:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        .gemini-link {
            text-decoration: none;
            display: inline-block;
        }

        .gemini-text {
            font-weight: bold;
            background: linear-gradient(90deg, #4E89FF, #FF7FDE);
            -webkit-background-clip: text;
            background-clip: text;
            /* ← 警告対策で追加 */
            -webkit-text-fill-color: transparent;
            transition: filter 0.2s;
        }

        .gemini-link:hover .gemini-text {
            filter: brightness(1.2);
        }

        .loading-eye {
            animation: blink 1.2s infinite;
            color: var(--text-accent);
            display: inline-block;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
                transform: scale(1.1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.9);
            }
        }

        /* --- モーダル全般 --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--purple-main);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .modal-content h2 {
            color: var(--text-accent);
            margin-bottom: 16px;
            font-size: 1.2rem;
            text-align: center;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .modal-btns button:hover {
            filter: brightness(1.2);
        }

        .btn-save {
            background: var(--purple-main);
            color: white;
        }

        .btn-cancel {
            background: #444;
            color: white;
        }

        /* --- アイコントリミング用 --- */
        .crop-container {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid var(--text-accent);
            overflow: hidden;
            position: relative;
            background: #111;
            touch-action: none;
            cursor: grab;
            margin: 0 auto;
        }

        .crop-container:active {
            cursor: grabbing;
        }

        #crop-image {
            position: absolute;
            transform-origin: top left;
            pointer-events: none;
            user-select: none;
        }

        .modal-controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* --- 設定モーダル用 --- */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
        }

        .help-text {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
            line-height: 1.4;
        }

        .help-text a {
            color: var(--purple-light);
        }

        /* トースト通知 */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(107, 44, 145, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2000;
            border: 1px solid var(--purple-light);
        }
    </style>
    <script>
        function handleIconError(img) {
            img.style.display = 'none';
            const parent = img.parentElement;
            if (!parent.querySelector('.fb')) {

                fb.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-accent);font-weight:bold;';
                parent.appendChild(fb);
            }
        }
    </script>
</head>

                <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
                <p class="help-text">
                    境界を繋ぐための鍵よ。伏せ字にしておいたわ。<br>
                    取得は<a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI
                        Studio</a>からできるわ。この鍵はあなたのブラウザ(localStorage)にだけ保存されるから安心してちょうだい。
                </p>
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeSettingModal()">閉じる</button>
                <button class="btn-save" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <div id="toast">保存しました</div>

    <script>
        // --- 初期化・定数 ---
        const STORAGE_KEY_ICON = 'GENSOKYO_BOT_ICON_V3';
        const STORAGE_KEY_API = 'GEMINI_API_KEY';
        const chatContainer = document.getElementById('chat-container');
        const storyForm = document.getElementById('storyForm');
        const fileInput = document.getElementById('fileInput');
        const cropModal = document.getElementById('cropModal');
        const settingModal = document.getElementById('settingModal');
        const cropImg = document.getElementById('crop-image');
        const zoomSlider = document.getElementById('zoomSlider');
        const cropViewport = document.getElementById('cropViewport');
        const toast = document.getElementById('toast');

        let currentApiKey = "";

        const greetings = [
            "あらあら、外の世界から迷い込んできたの？<br>歓迎するわ、幻想郷へ。<br><br>あなたの名や、持っている物を教えてちょうだい。<br>この私が、あなたの「運命の境界」を覗いてあげるから……うふふ。",
            "おや、境界の綻びから迷い子が一人……。<br>怖がらなくていいわ。ここは忘れ去られた者たちが集う楽園。<br><br>あなたが何者で、何を成そうとしているのか……聞かせてもらおうかしら？",
            "スキマの向こう側は、少し刺激が強すぎたかしら？<br>うふふ、ちょうど退屈していたところなの。<br><br>あなたが幻想郷でどんな「境界」を辿るのか、私の知恵を貸してあげてもいいわよ。",
            "ふふっ、また面白そうな人間が紛れ込んできたものね。<br>そのまま帰るか、それとも博霊の巫女に会う前に消えてしまうか……。<br><br>あなたの行く末を、少しだけ弄ってあげましょうか？",
            "迷い家を見つけるよりも、ずっと珍しいお客さんね。<br>ここがどこか、薄々気づいているんじゃないかしら。<br><br>あなたの名前と、握りしめているそのガラクタについて教えてもらえる？",
            "外の世界の常識は、ここでは非常識。<br>あなたのその行動が、どんな波紋を呼ぶか……。<br><br>ふふっ、私が少しだけシミュレートしてあげるわ。",
            "結界の隙間風に乗って、また一人。<br>せっかくのお茶の時間が台無しね、と言いたいところだけど……。<br><br>あなたの運命、ちょっとだけ面白そうじゃない？",
            "生と死の境界、夢と現の境界……。<br>あなたが今立っているのは、そのどれかしらね。<br><br>さあ、手持ちの駒を見せてごらんなさい。",
            "あら、震えているの？ 無理もないわね。<br>でも安心して。私はただの、通りすがりの妖怪よ。<br><br>あなたの行く末を、ほんの少し覗き見たいだけなの。",
            "常識にとらわれたままじゃ、ここでは一日も生きられないわよ。<br>あなたが誰と出会い、何をするのか……。<br><br>私の暇つぶしに付き合ってもらうわよ？",
            "ふぁ……あ、いけない。少し居眠りしていたわ。<br>目が覚めたら、目の前に迷い人がいるなんて。<br><br>これは夢かしら？ それとも、あなたの悪夢の始まり？",
            "神隠しに遭った気分はどうかしら。<br>帰り道を探すのもいいけれど、まずはあなたの身の上話を聞かせてちょうだい。<br><br>……嘘はつかないでね？",
            "妖怪の山、魔法の森、それとも……。<br>あなたがどこへ向かい、誰の餌食になるのか。<br><br>ふふ、結末が楽しみで仕方ないわ。",
            "外の世界では、ずいぶん退屈な日々を送っていたようね。<br>ここは刺激に満ち溢れているわよ。<br><br>あなたの命を賭けたお遊び、見物させてもらうわ。",
            "あら、そんな物を持ってウロウロしていると、あの紅白に退治されちゃうわよ？<br><br>どう？ 私が安全な道筋を占ってあげましょうか。",
            "幻想郷は全てを受け入れるわ。<br>たとえそれが、どんなに残酷な運命だったとしてもね。<br><br>さあ、覚悟が決まったら教えてちょうだい。",
            "昼と夜の境界が曖昧になる逢魔が時……。<br>あなたが現れたのは、偶然じゃないのかもしれないわね。<br><br>あなたの選んだ道が、どこへ繋がっているのか見せてあげる。",
            "人間と妖怪の境界なんて、私にとっては紙一重なの。<br>あなたがどちら側に転ぶか……。<br><br>私がそっと、背中を押してあげてもいいのよ？",
            "お茶請けには少し物足りないけれど……。<br>あなたのその必死な足掻き、極上のスパイスになりそうね。<br><br>さあ、物語の幕を開けましょうか。",
            "私のスキマは、どこへでも繋がっているの。<br>もちろん、あなたの最期の場所へもね……。<br><br>うふふ、冗談よ。さあ、あなたの情報を見せてちょうだい。"
        ];

        document.getElementById("year").textContent = new Date().getFullYear();

        function initApp() {
            const greetingElem = document.getElementById('first-greeting');
            if (greetingElem) {
                const randomIndex = Math.floor(Math.random() * greetings.length);
                greetingElem.innerHTML = greetings[randomIndex];
            }

            const savedIcon = localStorage.getItem(STORAGE_KEY_ICON);
            if (savedIcon) {
                document.querySelectorAll('.botIcon').forEach(i => {
                    i.src = savedIcon; i.style.display = 'block';
                    const fb = i.parentElement.querySelector('.fb'); if (fb) fb.remove();
                });
            }

            currentApiKey = (localStorage.getItem(STORAGE_KEY_API) || "").trim();
        }
        window.addEventListener('DOMContentLoaded', initApp);

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        // --- 設定モーダル ---
        function openSettingModal() {
            document.getElementById('apiKeyInput').value = currentApiKey;
            settingModal.style.display = 'flex';
        }

        function closeSettingModal() {
            settingModal.style.display = 'none';
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            currentApiKey = key;
            if (key) {
                localStorage.setItem(STORAGE_KEY_API, key);
            } else {
                localStorage.removeItem(STORAGE_KEY_API);
            }
            closeSettingModal();
            showToast('設定を保存したわ。');
        }

        settingModal.addEventListener('click', (e) => {
            if (e.target === settingModal) closeSettingModal();
        });

        // --- ファイル選択/トリミング ---
        let imgState = { x: 0, y: 0, scale: 1 };
        const viewportSize = 300;

        function triggerFileSelect() { fileInput.click(); }

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                cropImg.src = ev.target.result;
                cropImg.onload = () => {
                    const baseScale = viewportSize / Math.min(cropImg.width, cropImg.height);
                    imgState.scale = baseScale;
                    imgState.x = (viewportSize - cropImg.width * baseScale) / 2;
                    imgState.y = (viewportSize - cropImg.height * baseScale) / 2;
                    zoomSlider.min = baseScale * 0.1;
                    zoomSlider.max = baseScale * 10;
                    zoomSlider.value = baseScale;
                    updateCropTransform();
                    cropModal.style.display = 'flex';
                };
            };
            reader.readAsDataURL(file);
        };

        function updateCropTransform() {
            cropImg.style.transform = `translate(${imgState.x}px, ${imgState.y}px) scale(${imgState.scale})`;
        }

        function closeCropModal() { cropModal.style.display = 'none'; fileInput.value = ''; }

        function applyCrop() {
            const canvas = document.createElement('canvas');
            canvas.width = 400; canvas.height = 400;
            const ctx = canvas.getContext('2d');
            const ratio = 400 / viewportSize;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, 400, 400);
            ctx.save();
            ctx.translate(imgState.x * ratio, imgState.y * ratio);
            ctx.scale(imgState.scale * ratio, imgState.scale * ratio);
            ctx.drawImage(cropImg, 0, 0);
            ctx.restore();
            const dataUrl = canvas.toDataURL('image/png');
            localStorage.setItem(STORAGE_KEY_ICON, dataUrl);

            document.querySelectorAll('.botIcon').forEach(i => {
                i.src = dataUrl; i.style.display = 'block';
                const fb = i.parentElement.querySelector('.fb'); if (fb) fb.remove();
            });
            closeCropModal();
        }

        let isDragging = false, lastX, lastY;
        const onStart = (e) => {
            if (e.type === 'mousedown' && e.button !== 0) return;
            isDragging = true;
            const ev = e.touches ? e.touches[0] : e;
            lastX = ev.clientX; lastY = ev.clientY;
        };
        const onMove = (e) => {
            if (!isDragging) return;
            const ev = e.touches ? e.touches[0] : e;
            const deltaX = ev.clientX - lastX;
            const deltaY = ev.clientY - lastY;
            imgState.x += deltaX; imgState.y += deltaY;
            lastX = ev.clientX; lastY = ev.clientY;
            updateCropTransform();
            if (e.cancelable) e.preventDefault();
        };
        const onEnd = () => isDragging = false;

        const onWheel = (e) => {
            e.preventDefault();
            const zoomSpeed = 0.001;
            const delta = -e.deltaY;
            const oldScale = imgState.scale;
            const newScale = Math.min(Math.max(imgState.scale + delta * zoomSpeed, parseFloat(zoomSlider.min)), parseFloat(zoomSlider.max));
            const rect = cropViewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const worldX = (mouseX - imgState.x) / oldScale;
            const worldY = (mouseY - imgState.y) / oldScale;
            imgState.scale = newScale;
            imgState.x = mouseX - worldX * newScale;
            imgState.y = mouseY - worldY * newScale;
            zoomSlider.value = newScale;
            updateCropTransform();
        };

        cropViewport.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        cropViewport.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
        cropViewport.addEventListener('wheel', onWheel, { passive: false });

        zoomSlider.oninput = () => {
            const oldScale = imgState.scale;
            const newScale = parseFloat(zoomSlider.value);
            const centerX = viewportSize / 2;
            const centerY = viewportSize / 2;
            const worldX = (centerX - imgState.x) / oldScale;
            const worldY = (centerY - imgState.y) / oldScale;
            imgState.scale = newScale;
            imgState.x = centerX - worldX * newScale;
            imgState.y = centerY - worldY * newScale;
            updateCropTransform();
        };

        // --- API通信 ---
        async function generateContentWithRetry(payload, maxRetries = 5) {
            if (!currentApiKey) throw new Error("API_KEY_MISSING");

            // URLパラメータからkeyを外し、より安全なヘッダー送信(x-goog-api-key)に変更します。
            const modelName = "gemini-2.5-flash"; // 最新の安定モデルに変更
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`;

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': currentApiKey
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(`HTTP error! status: ${response.status}, message: ${errData.error?.message || 'Unknown'}`);
                    }

                    const data = await response.json();
                    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                        return data.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error("Invalid response structure from Gemini API.");
                    }
                } catch (error) {
                    if (attempt === maxRetries) throw error;
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        // --- ストーリー生成 ---
        async function typeWriter(element, markdown) {
            const html = marked.parse(markdown);
            element.innerHTML = "";
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = html;
            const nodes = Array.from(tempDiv.childNodes);
            for (let node of nodes) {
                const newNode = node.cloneNode(true);
                if (newNode.nodeType === 1) { // 要素ノードの場合のみアニメーション適用
                    newNode.style.opacity = "0";
                    newNode.style.animation = "fadeInUp 0.6s ease-out forwards";
                }
                element.appendChild(newNode);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 200));
            }
        }

        storyForm.onsubmit = async (e) => {
            e.preventDefault();
            if (!currentApiKey) {
                pushBotMsg("鍵（APIキー）が設定されていないわ。右上の「⚙ 設定」から設定してちょうだい。");
                openSettingModal();
                return;
            }

            const data = {
                n: document.getElementById('name').value,
                a: document.getElementById('action').value,
                i: document.getElementById('item').value,
                c: document.getElementById('companion').value,
                e: document.getElementById('enemy').value || "なし"
            };

            if (data.c.includes("八雲紫") || data.e.includes("八雲紫")) {
                pushBotMsg("あら、私をお供や遭遇者にするつもり？<br>……冗談は顔だけにしてちょうだい。私はあくまで、あなたの運命の語り部よ。<br><br><span style='font-size: 0.85em; color: var(--red-eye);'>【エラー：お供・遭遇者に「八雲紫」を指定することはできません】</span>");
                return;
            }

            pushUserMsg(`${data.n}は「${data.a}」を試みる。`);
            const botMsgId = pushBotMsg("境界を弄っているわ…… <span class='loading-eye' title='あら、覗き見されるのは恥ずかしいのかしら？'>👁️</span>");
            const botTextElem = document.getElementById(botMsgId).querySelector('.botText');

            storyForm.reset();
            document.getElementById('submitBtn').disabled = true;

            const payload = {
                contents: [{
                    parts: [{
                        text: `あなたは東方Projectの八雲紫です。以下の情報を元に物語を Markdown 形式で語ってください。
口調は優雅でミステリアス、時折恐ろしく。「〜かしら」「〜ね」「うふふ」を使用し、読者を「境界の外の迷い人」として扱ってください。

【挑戦者】名前:${data.n}, 行動:${data.a}, 持ち物:${data.i}, お供:${data.c}, 遭遇者:${data.e}

【出力構成】
※ 生成AIの出力のように整理された分かりやすい形にするため、重要なキーワードの**太字強調**や、理由の列挙での**箇条書き（- ）**を積極的に活用してください。

1. ### 生存率
   - まず最初に、この迷い人の生存率（例：**12.34%** のように太字で必ず小数第二位までの表記）を提示してください。
2. ### 境界の向こう側
   - 迷い人がどのような行動を取り、それがどういう事態を引き起こしたか（あらすじ）を描写してください。
3. ### 運命の理由
   - なぜその生存率になったのか、そしてなぜ最終的な結末に至ったのか、明確な理由（行動と持ち物の関連性、遭遇者との相性など）を箇条書きを使って論理的に説明してください。
4. ### 最終的な結末
   - 一番最後に、結果として**【生存】**か**【死亡】**かを太字で明確に記してください。
   - 生存した場合は、「元の世界に帰れるのか」それとも「幻想郷に居座ることになるのか」の運命も必ず明記して結んでください。` }]
                }]
            };

            try {
                const answer = await generateContentWithRetry(payload);
                botTextElem.innerHTML = "";
                await typeWriter(botTextElem, answer);
            } catch (err) {
                console.error("Story Generation Error:", err);
                botTextElem.innerHTML = `<span style='color:var(--red-eye)'>境界の接続に失敗したわ。（通信エラー）<br>時間を置いてもう一度試すか、APIキーが正しいか確認してちょうだい。</span>`;
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        };

        function pushBotMsg(t) {
            const id = "b" + Date.now();
            const div = document.createElement('div');
            div.className = "botContainer"; div.id = id;
            const src = localStorage.getItem(STORAGE_KEY_ICON);
            div.innerHTML = `
      <div class="icon-wrapper" onclick="triggerFileSelect()" title="私の姿を書き換えるというの？ うふふ、いいわよ。">
        <img src="${src || ''}" class="botIcon" style="${src ? '' : 'display:none'}" onerror="handleIconError(this)">
      </div>
      <div class="botText">${t}</div>
    `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function pushUserMsg(t) {
            const div = document.createElement('div');
            div.className = "userContainer";
            div.innerHTML = `<div class="userBubble">${t}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
