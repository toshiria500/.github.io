<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>境界の管理 - 設定</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --bg-color: #0d0616;
    --text-main: #f8f0fc;
    --text-accent: #d4af37;
    --purple-main: #6b2c91;
    --purple-dark: #240b36;
    --red-eye: #ff1a1a;
    --font-serif: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-serif);
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(90deg, #000, var(--purple-main), #000);
    color: var(--text-accent);
    padding: 15px;
    text-align: center;
    border-bottom: 2px solid var(--red-eye);
  }

  main { flex: 1; padding: 20px; max-width: 700px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; justify-content: center; }

  .card {
    background: rgba(30, 15, 45, 0.8); border: 1px solid rgba(157, 78, 221, 0.3);
    padding: 20px; border-radius: 12px; backdrop-filter: blur(12px); margin-bottom: 20px;
  }

  label { display: block; color: var(--text-accent); margin-bottom: 12px; font-weight: bold; border-left: 3px solid var(--red-eye); padding-left: 10px; }

  input[type="password"] {
    width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--purple-main);
    color: #fff; padding: 14px; border-radius: 8px; font-size: 1rem; outline: none; font-family: var(--font-serif);
  }

  .description { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin: 15px 0; line-height: 1.6; }

  .external-link-btn {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 5px; padding: 10px 18px;
    background: rgba(212, 175, 55, 0.1); border: 1px solid var(--text-accent);
    color: var(--text-accent); text-decoration: none; border-radius: 20px; font-size: 0.85rem;
  }

  button {
    width: 100%; padding: 16px; border-radius: 10px; border: none; font-family: var(--font-serif);
    font-weight: bold; cursor: pointer; transition: 0.3s;
  }

  .btn-save { background: linear-gradient(135deg, var(--purple-main), var(--purple-dark)); color: #fff; margin-bottom: 15px; }
  .btn-back { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--purple-main); }

  #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--text-accent); color: #000; padding: 12px 25px; border-radius: 30px; display: none; z-index: 1000; font-weight: bold; }
</style>
</head>
<body>

<header>
  <h1>境界の管理（設定）</h1>
</header>

<main>
  <form id="settings-form" onsubmit="saveSettings(event)">
    <div class="card">
      <label for="apiKey">境界の鍵 (Gemini API Key)</label>
      <input type="password" id="apiKey" placeholder="AI Studioで発行したAIza...から始まる鍵を入力" required>
      
      <div class="description">
        物語を紡ぐために必要な「通行証」よ。<br>
        コピーしたときに<b>余計なスペース（空白）</b>が入っていると動かないから気をつけて。
      </div>

      <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" class="external-link-btn">
        Google AI Studio で鍵を入手する <i class="fas fa-external-link-alt"></i>
      </a>
    </div>

    <button type="submit" class="btn-save">設定を保存する</button>
    <button type="button" class="btn-back" onclick="location.href='../'">← 戻る</button>
  </form>
</main>

<div id="toast">設定を保存したわ。</div>

<script>
  window.onload = () => {
    const savedKey = localStorage.getItem("GEMINI_API_KEY");
    if (savedKey) document.getElementById("apiKey").value = savedKey;
  };

  function saveSettings(event) {
    event.preventDefault();
    // 保存時に空白を徹底的に除去（前後および改行）
    const rawValue = document.getElementById("apiKey").value;
    const cleanKey = rawValue.replace(/[\s\n\r]/g, '');
    
    localStorage.setItem("GEMINI_API_KEY", cleanKey);
    
    const toast = document.getElementById("toast");
    toast.style.display = "block"; 
    setTimeout(() => { toast.style.display = "none"; }, 2500);
  }
</script>
</body>
</html>
