<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Multi Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        .font-pixel { font-family: 'DotGothic16', sans-serif; }
        .active-mode { transform: translateY(-5px); border-color: #4f46e5; background: #f5f3ff; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.1); }
        .mode-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes scan-pulse {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        .scan-pulse { animation: scan-pulse 1.5s infinite; border-color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 pb-24 font-sans text-slate-800">

    <div class="max-w-md mx-auto">
        <header class="mb-6 text-center pt-4">
            <h1 class="text-3xl font-black text-slate-900 tracking-tighter italic uppercase">NFC Collector</h1>
            <div id="badge-container" class="flex flex-wrap justify-center gap-2 mt-3"></div>
        </header>

        <div class="grid grid-cols-3 gap-3 mb-6">
            <button onclick="setMode('card')" id="btn-card" class="mode-card bg-white border-2 border-transparent p-3 rounded-2xl flex flex-col items-center shadow-sm active-mode">
                <span class="text-2xl mb-1">💳</span>
                <span class="text-[10px] font-bold">CARD</span>
            </button>
            <button onclick="setMode('amiibo')" id="btn-amiibo" class="mode-card bg-white border-2 border-transparent p-3 rounded-2xl flex flex-col items-center shadow-sm">
                <span class="text-2xl mb-1">🧸</span>
                <span class="text-[10px] font-bold">amiibo</span>
            </button>
            <button onclick="setMode('dream')" id="btn-dream" class="mode-card bg-white border-2 border-transparent p-3 rounded-2xl flex flex-col items-center shadow-sm">
                <span class="text-2xl mb-1">🌀</span>
                <span class="text-[10px] font-bold text-center leading-tight">妖怪メダル</span>
            </button>
        </div>

        <div id="main-card" class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden mb-6 border border-slate-200">
            <div id="header-bar" class="bg-slate-800 p-3 text-white text-center text-[10px] font-black tracking-widest uppercase transition-colors duration-500">
                CARD MODE
            </div>
            <div class="p-8 flex flex-col items-center">
                <div id="icon-circle" class="w-28 h-28 rounded-full bg-slate-50 flex items-center justify-center mb-6 border-4 border-white shadow-inner transition-all duration-500">
                    <span id="main-emoji" class="text-5xl">💳</span>
                </div>
                <h2 id="status-text" class="text-lg font-black mb-1">スキャン待機中</h2>
                <div id="status-sub" class="text-xs text-slate-400 text-center mb-8 leading-relaxed">
                    選択したアイテムをスマホの背面に<br>近づけてください
                </div>
                <button id="scan-btn" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-sm tracking-widest shadow-lg opacity-50 cursor-not-allowed transition-all" disabled>
                    SCAN START
                </button>
            </div>
        </div>

        <div id="guide-box" class="hidden rounded-2xl p-5 mb-6 text-sm">
            <h3 id="guide-title" class="font-bold mb-1 flex items-center gap-2"></h3>
            <p id="guide-text" class="text-[11px] leading-relaxed"></p>
        </div>

        <div class="px-2">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-black text-slate-400 tracking-widest uppercase">My Collection</h3>
                <button onclick="clearCollection()" class="text-[10px] font-bold text-red-400">CLEAR</button>
            </div>
            <div id="log-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- 登録用ポップアップ -->
    <div id="reg-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8">
            <h3 class="text-2xl font-black mb-2">NEW DISCOVERY!</h3>
            <p id="scanned-id" class="text-[10px] font-mono text-slate-400 mb-6 uppercase tracking-widest"></p>
            <input type="text" id="name-input" placeholder="名前を入力してください" class="w-full bg-slate-100 p-4 rounded-xl mb-4 font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex gap-2">
                <button onclick="closeReg()" class="flex-1 py-4 text-slate-400 font-bold text-sm">やめる</button>
                <button id="save-btn" class="flex-[2] py-4 bg-indigo-600 text-white rounded-xl font-black text-sm shadow-lg">登録する</button>
            </div>
        </div>
    </div>

    <!-- メッセージボックス -->
    <div id="msg-box" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-4 rounded-2xl z-[100] shadow-2xl w-11/12 max-w-sm text-center">
        <p id="msg-content" class="text-sm font-bold leading-relaxed"></p>
        <button onclick="closeMsg()" class="mt-3 px-4 py-2 bg-white text-slate-800 rounded-lg text-xs font-black uppercase">OK</button>
    </div>

    <script>
        const scanBtn = document.getElementById('scan-btn');
        const badgeContainer = document.getElementById('badge-container');
        const guideBox = document.getElementById('guide-box');
        const logList = document.getElementById('log-list');
        const regModal = document.getElementById('reg-modal');
        const statusSub = document.getElementById('status-sub');
        const msgBox = document.getElementById('msg-box');
        const msgContent = document.getElementById('msg-content');

        let currentMode = 'card';
        let currentScannedId = '';
        let ndef = null;
        let abortController = null;

        const modes = {
            card: { label: 'CARD MODE', emoji: '💳', color: '#1e293b' },
            amiibo: { label: 'amiibo MODE', emoji: '🧸', color: '#ef4444' },
            dream: { label: '妖怪メダル MODE', emoji: '🌀', color: '#4f46e5' }
        };

        function showMsg(text) {
            msgContent.innerText = text;
            msgBox.classList.remove('hidden');
        }

        function closeMsg() {
            msgBox.classList.add('hidden');
        }

        function addBadge(text, colorClass) {
            const b = document.createElement('div');
            b.className = `px-3 py-1 ${colorClass} text-[9px] font-bold rounded-full uppercase tracking-tighter`;
            b.innerText = text;
            badgeContainer.appendChild(b);
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(b => b.classList.remove('active-mode'));
            document.getElementById('btn-'+mode).classList.add('active-mode');
            const m = modes[mode];
            document.getElementById('header-bar').innerText = m.label;
            document.getElementById('header-bar').style.backgroundColor = m.color;
            document.getElementById('main-emoji').innerText = m.emoji;
            document.getElementById('icon-circle').classList.remove('scan-pulse');
            statusSub.innerHTML = '選択したアイテムをスマホの背面に<br>近づけてください';
        }

        function init() {
            const hasNFC = 'NDEFReader' in window;
            const ua = navigator.userAgent;
            const isAndroid = /Android/i.test(ua);
            const isChrome = /Chrome/i.test(ua);

            addBadge(isAndroid ? "Android OK" : "Desktop/Other", isAndroid ? "bg-green-100 text-green-600" : "bg-slate-200 text-slate-600");
            addBadge(hasNFC ? "NFC Support: YES" : "NFC Support: NO", hasNFC ? "bg-indigo-600 text-white" : "bg-red-500 text-white");

            guideBox.classList.remove('hidden');
            if (hasNFC) {
                scanBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                scanBtn.disabled = false;
                guideBox.className = "bg-green-50 border border-green-100 text-green-700 p-5 rounded-2xl mb-6";
                document.getElementById('guide-title').innerText = "✅ 準備完了";
                document.getElementById('guide-text').innerText = "AndroidのChromeで開いていますね。ボタンを押してスキャンを開始してください。";
            } else {
                guideBox.className = "bg-red-50 border border-red-100 text-red-700 p-5 rounded-2xl mb-6";
                document.getElementById('guide-title').innerText = "❌ 非対応のブラウザです";
                document.getElementById('guide-text').innerText = "Web NFCは現在Android版Google Chromeのみ対応しています。環境を確認してください。";
            }
            loadCollection();
        }

        async function startScan() {
            if (!('NDEFReader' in window)) {
                showMsg("このブラウザはNFCに対応していません。Android Chromeをお使いください。");
                return;
            }

            try {
                // スキャン開始前に以前の状態をクリア
                if (abortController) abortController.abort();
                abortController = new AbortController();

                ndef = new NDEFReader();
                // ここでブラウザの許可ポップアップが出るはずです
                await ndef.scan({ signal: abortController.signal });

                document.getElementById('icon-circle').classList.add('scan-pulse');
                document.getElementById('status-text').innerText = "スキャン中...";
                scanBtn.innerText = "スキャンを停止";
                scanBtn.onclick = stopScan;

                ndef.onreadingerror = () => {
                    showMsg("読み取りエラーです。タグを近づけたままにしてください。");
                };

                ndef.onreading = (event) => {
                    const id = event.serialNumber;
                    const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');

                    if (data[id]) {
                        document.getElementById('status-text').innerText = "認識成功！";
                        statusSub.innerHTML = `<span class="text-indigo-600 font-bold text-lg">${data[id].name}</span><br>(${data[id].type})`;
                        // 連続スキャンを考慮して一定時間後に戻す
                        setTimeout(() => {
                            if (ndef) {
                                document.getElementById('status-text').innerText = "スキャン中...";
                                statusSub.innerHTML = "次のアイテムをスキャンできます";
                            }
                        }, 2000);
                    } else {
                        currentScannedId = id;
                        document.getElementById('scanned-id').innerText = `ID: ${id}`;
                        regModal.classList.remove('hidden');
                        document.getElementById('name-input').focus();
                    }
                };

            } catch (error) {
                console.log(error);
                if (error.name === "NotAllowedError") {
                    showMsg("NFCへのアクセスが拒否されました。設定から許可してください。");
                } else if (error.name === "NotSupportedError") {
                    showMsg("NFCがサポートされていないか、無効になっています。");
                } else {
                    showMsg("エラーが発生しました: " + error.message);
                }
            }
        }

        function stopScan() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            document.getElementById('icon-circle').classList.remove('scan-pulse');
            document.getElementById('status-text').innerText = "準備完了";
            scanBtn.innerText = "SCAN START";
            scanBtn.onclick = startScan;
            statusSub.innerHTML = '選択したアイテムをスマホの背面に<br>近づけてください';
        }

        function saveEntry() {
            const name = document.getElementById('name-input').value.trim();
            if (!name) return;
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            data[currentScannedId] = { name, type: currentMode };
            localStorage.setItem('nfc_data', JSON.stringify(data));
            closeReg();
            loadCollection();
        }

        function closeReg() {
            regModal.classList.add('hidden');
            document.getElementById('name-input').value = "";
        }

        function loadCollection() {
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            logList.innerHTML = '';
            const ids = Object.keys(data).reverse();
            if (ids.length === 0) {
                logList.innerHTML = '<p class="text-center py-10 text-slate-300 text-xs font-bold uppercase">No Collection</p>';
                return;
            }
            ids.forEach(id => {
                const item = data[id];
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl flex items-center justify-between border border-slate-100 shadow-sm";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-2xl">${modes[item.type]?.emoji || '❓'}</div>
                        <div>
                            <div class="font-black text-slate-800">${item.name}</div>
                            <div class="text-[9px] font-mono text-slate-400 uppercase tracking-widest">${item.type} | ${id}</div>
                        </div>
                    </div>
                    <button onclick="deleteItem('${id}')" class="text-slate-300 hover:text-red-400 p-2">✕</button>
                `;
                logList.appendChild(div);
            });
        }

        function deleteItem(id) {
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            delete data[id];
            localStorage.setItem('nfc_data', JSON.stringify(data));
            loadCollection();
        }

        function clearCollection() {
            localStorage.removeItem('nfc_data');
            loadCollection();
            showMsg("コレクションを削除しました");
        }

        scanBtn.onclick = startScan;
        document.getElementById('save-btn').onclick = saveEntry;
        init();
    </script>
</body>
</html>
