<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC MULTI SCANNER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .mode-card { transition: all 0.3s ease; }
        .active-mode { transform: translateY(-5px); border-color: #4f46e5; background: #eef2ff; }
        .scan-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(79, 70, 229, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 pb-20 font-sans text-slate-800">

    <div class="max-w-md mx-auto">
        <header class="mb-6 text-center pt-4">
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter italic">NFC MULTI SCANNER</h1>
            <div id="env-badge" class="inline-block mt-2 px-3 py-1 bg-red-100 text-red-600 text-[10px] font-bold rounded-full">
                CHECKING ENVIRONMENT...
            </div>
        </header>

        <!-- Mode Select -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <button onclick="setMode('card')" id="btn-card" class="mode-card bg-white border-2 border-transparent p-3 rounded-2xl flex flex-col items-center shadow-sm active-mode">
                <span class="text-2xl mb-1">💳</span>
                <span class="text-[10px] font-bold">CARD</span>
            </button>
            <button onclick="setMode('amiibo')" id="btn-amiibo" class="mode-card bg-white border-2 border-transparent p-3 rounded-2xl flex flex-col items-center shadow-sm">
                <span class="text-2xl mb-1">🧸</span>
                <span class="text-[10px] font-bold">amiibo</span>
            </button>
            <button onclick="setMode('dream')" id="btn-dream" class="mode-card bg-white border-2 border-transparent p-3 rounded-2xl flex flex-col items-center shadow-sm">
                <span class="text-2xl mb-1">🌀</span>
                <span class="text-[10px] font-bold">妖怪メダル</span>
            </button>
        </div>

        <!-- Main UI -->
        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden mb-6 border border-slate-200">
            <div id="header-bar" class="bg-slate-800 p-3 text-white text-center text-[10px] font-black tracking-widest transition-colors duration-500 uppercase">
                CARD MODE
            </div>
            <div class="p-10 flex flex-col items-center">
                <div id="icon-circle" class="w-28 h-28 rounded-full bg-slate-50 flex items-center justify-center mb-6 border-4 border-white shadow-inner">
                    <span id="main-emoji" class="text-5xl">💳</span>
                </div>
                <h2 id="status-text" class="text-lg font-black mb-1">準備完了</h2>
                <p id="status-sub" class="text-xs text-slate-400 text-center mb-8 leading-relaxed">
                    下のボタンを押してスキャンを開始してください
                </p>
                <button id="scan-btn" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-sm tracking-widest shadow-lg active:scale-95 transition-all">
                    SCAN START
                </button>
            </div>
        </div>

        <!-- Log -->
        <div class="px-2">
            <h3 class="text-sm font-black text-slate-400 mb-4 tracking-widest">COLLECTION</h3>
            <div id="log-list" class="space-y-2 text-center py-10 bg-white/50 rounded-2xl border-2 border-dashed border-slate-200 text-xs text-slate-400">
                まだデータがありません
            </div>
        </div>
    </div>

    <!-- Error Overlay -->
    <div id="error-overlay" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-8 w-full max-w-xs text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">⚠️</div>
            <h3 class="text-xl font-black mb-2">動作不可</h3>
            <p id="error-desc" class="text-sm text-slate-500 mb-6 leading-relaxed"></p>
            <button onclick="document.getElementById('error-overlay').classList.add('hidden')" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold">閉じる</button>
        </div>
    </div>

    <script>
        const envBadge = document.getElementById('env-badge');
        const scanBtn = document.getElementById('scan-btn');
        const errorOverlay = document.getElementById('error-overlay');
        const errorDesc = document.getElementById('error-desc');
        
        let currentMode = 'card';
        const modes = {
            card: { label: 'CARD MODE', emoji: '💳', color: '#1e293b' },
            amiibo: { label: 'amiibo MODE', emoji: '🧸', color: '#ef4444' },
            dream: { label: 'DREAM MEDAL MODE', emoji: '🌀', color: '#4f46e5' }
        };

        // 環境チェック
        function checkEnv() {
            if (!('NDEFReader' in window)) {
                envBadge.innerText = "UNSUPPORTED BROWSER";
                envBadge.className = "inline-block mt-2 px-3 py-1 bg-red-100 text-red-600 text-[10px] font-bold rounded-full";
                return false;
            }
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                envBadge.innerText = "HTTPS REQUIRED";
                envBadge.className = "inline-block mt-2 px-3 py-1 bg-orange-100 text-orange-600 text-[10px] font-bold rounded-full";
                return false;
            }
            envBadge.innerText = "READY TO SCAN";
            envBadge.className = "inline-block mt-2 px-3 py-1 bg-green-100 text-green-600 text-[10px] font-bold rounded-full";
            return true;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(b => b.classList.remove('active-mode'));
            document.getElementById('btn-'+mode).classList.add('active-mode');
            
            const m = modes[mode];
            document.getElementById('header-bar').innerText = m.label;
            document.getElementById('header-bar').style.backgroundColor = m.color;
            document.getElementById('main-emoji').innerText = m.emoji;
        }

        async function handleScan() {
            if (!('NDEFReader' in window)) {
                errorDesc.innerText = "Web NFC APIがブラウザで見つかりません。AndroidのChromeで開き、NFCをONにしてください。";
                errorOverlay.classList.remove('hidden');
                return;
            }

            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                document.getElementById('icon-circle').classList.add('scan-pulse');
                document.getElementById('status-text').innerText = "スキャン中...";
                scanBtn.disabled = true;
                scanBtn.innerText = "かざしてください...";
                
                ndef.onreading = (event) => {
                    alert("検知しました！ ID: " + event.serialNumber);
                    // 実際にはここで保存処理などを行う
                };

            } catch (err) {
                errorDesc.innerText = "スキャンの開始に失敗しました: " + err.message + "\n\n(HTTPS環境である必要があります)";
                errorOverlay.classList.remove('hidden');
            }
        }

        scanBtn.addEventListener('click', handleScan);
        window.onload = checkEnv;
    </script>
</body>
</html>
