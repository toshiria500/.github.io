<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Multi Collector Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&display=swap');
        .font-pixel { font-family: 'DotGothic16', sans-serif; }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        .active-mode { transform: translateY(-4px); border-color: #6366f1; background: #f8fafc; box-shadow: 0 10px 20px -3px rgba(99, 102, 241, 0.2); }
        .mode-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen p-4 pb-24 font-sans text-slate-100 selection:bg-indigo-500">

    <div class="max-w-md mx-auto">
        <!-- ヘッダー -->
        <header class="mb-6 text-center pt-4">
            <h1 class="text-3xl font-black text-white tracking-tighter italic uppercase flex items-center justify-center gap-2">
                <span>🛰️</span> NFC COLLECTOR <span class="text-indigo-400">PRO</span>
            </h1>
            <div id="badge-container" class="flex flex-wrap justify-center gap-2 mt-3"></div>
        </header>

        <!-- モード切替タブ -->
        <div class="grid grid-cols-3 gap-2.5 mb-6">
            <button onclick="setMode('card')" id="btn-card" class="mode-card bg-slate-800 border-2 border-slate-700/50 p-3 rounded-2xl flex flex-col items-center shadow-md active-mode">
                <span class="text-2xl mb-1">💳</span>
                <span class="text-[10px] font-bold tracking-widest text-slate-300">CARD</span>
            </button>
            <button onclick="setMode('amiibo')" id="btn-amiibo" class="mode-card bg-slate-800 border-2 border-slate-700/50 p-3 rounded-2xl flex flex-col items-center shadow-md">
                <span class="text-2xl mb-1">🧸</span>
                <span class="text-[10px] font-bold tracking-widest text-slate-300">AMIIBO</span>
            </button>
            <button onclick="setMode('dream')" id="btn-dream" class="mode-card bg-slate-800 border-2 border-slate-700/50 p-3 rounded-2xl flex flex-col items-center shadow-md">
                <span class="text-2xl mb-1">🌀</span>
                <span class="text-[10px] font-bold tracking-widest text-slate-300 text-center leading-none">MEDAL</span>
            </button>
        </div>

        <!-- インタラクティブ・キャンバス (メインスキャナー＆デバイスガイド) -->
        <div id="main-card" class="bg-slate-800 rounded-[2.5rem] shadow-2xl overflow-hidden mb-6 border border-slate-700/80">
            <div id="header-bar" class="bg-indigo-600 p-3 text-white text-center text-[10px] font-black tracking-widest uppercase transition-colors duration-500">
                CARD MODE - SCANNER
            </div>
            
            <div class="p-6 flex flex-col items-center">
                <!-- Canvasスキャナーエリア -->
                <div class="relative w-full max-w-[280px] aspect-square mb-4 bg-slate-950/80 rounded-3xl border border-slate-700/50 overflow-hidden shadow-inner">
                    <canvas id="scannerCanvas" class="w-full h-full cursor-pointer"></canvas>
                    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-slate-900/90 text-[9px] px-3 py-1 rounded-full text-slate-400 pointer-events-none border border-slate-700">
                        タップで模擬スキャン
                    </div>
                </div>

                <h2 id="status-text" class="text-lg font-black mb-1 text-white">スキャン待機中</h2>
                <div id="status-sub" class="text-xs text-slate-400 text-center mb-6 leading-relaxed">
                    スマホの最上部（裏面カメラ横）に<br>カードやメダルをかざしてください
                </div>

                <button id="scan-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-sm tracking-widest shadow-lg transition-all">
                    スキャンを開始する
                </button>
            </div>
        </div>

        <!-- リアルタイム・デジタルICカード Canvas描画ボード -->
        <div id="balance-dashboard" class="hidden bg-slate-800 border border-slate-700 rounded-3xl p-5 mb-6 shadow-2xl overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <h4 class="text-xs font-black text-indigo-400 tracking-wider flex items-center gap-1.5">
                    <span>⚡</span> PHYSICAL CARD VISUALIZER
                </h4>
                <!-- クイック編集ボタン -->
                <button onclick="openQuickEdit()" class="text-[10px] bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white px-2.5 py-1 rounded-lg border border-indigo-500/30 transition-all font-bold">
                    ✏️ 残高を修正
                </button>
            </div>
            
            <!-- ICカード描画用のCanvas -->
            <div class="w-full max-w-[320px] mx-auto aspect-[1.58/1] bg-slate-950 rounded-2xl overflow-hidden border border-slate-700 shadow-md mb-4">
                <canvas id="cardCanvas" class="w-full h-full"></canvas>
            </div>

            <!-- 明細情報 -->
            <div class="grid grid-cols-2 gap-3 mb-4 text-xs font-mono-tech">
                <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/50">
                    <span class="text-[9px] text-slate-400 block mb-0.5">ポイント残高</span>
                    <span id="points-amount" class="font-bold text-amber-400 text-sm">0 P</span>
                </div>
                <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/50">
                    <span class="text-[9px] text-slate-400 block mb-0.5">カード規格</span>
                    <span class="font-bold text-slate-300 text-sm">FeliCa (Type-F)</span>
                </div>
            </div>

            <!-- 利用履歴 -->
            <div class="border-t border-slate-700/50 pt-3">
                <span class="text-[10px] text-slate-400 block mb-2 font-black tracking-wider uppercase">💳 直近の利用履歴 (HISTORY)</span>
                <div id="history-list" class="space-y-1.5 text-xs font-mono-tech">
                    <!-- JSで挿入 -->
                </div>
            </div>
        </div>

        <!-- ガイドボックス (端末固有の説明) -->
        <div id="guide-box" class="rounded-2xl p-4 mb-6 text-xs bg-slate-800/80 border border-slate-700">
            <h3 id="guide-title" class="font-bold text-slate-200 mb-1.5 flex items-center gap-1.5"></h3>
            <p id="guide-text" class="text-slate-400 leading-relaxed"></p>
        </div>

        <!-- コレクション履歴 -->
        <div class="px-1">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-black text-slate-400 tracking-widest uppercase">My Collection Log</h3>
                <button onclick="clearCollection()" class="text-[10px] font-bold text-red-400 hover:text-red-300">CLEAR ALL</button>
            </div>
            <div id="log-list" class="space-y-2.5"></div>
        </div>
    </div>

    <!-- 登録用モーダルポップアップ (残高設定を追加) -->
    <div id="reg-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xl font-black text-white">NEW DISCOVERY!</h3>
                <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-md font-mono-tech" id="scanned-id-type">CARD</span>
            </div>
            <p id="scanned-id" class="text-[10px] font-mono-tech text-slate-400 mb-4 uppercase tracking-widest bg-slate-900/80 p-2 rounded-lg"></p>
            
            <!-- 共通: 名前 -->
            <div class="mb-4">
                <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">登録名 (ニックネーム)</label>
                <input type="text" id="name-input" placeholder="例: マイSuica / メダル1号" class="w-full bg-slate-950 text-white border border-slate-700 p-3.5 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- CARDモード専用追加フィールド -->
            <div id="card-meta-fields" class="space-y-4 border-t border-slate-700/50 pt-4 mb-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-wider">カードデザイン規格</label>
                    <div class="grid grid-cols-3 gap-1.5" id="brand-selector">
                        <!-- 動的にブランドボタンを生成 -->
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">初期残高 (円)</label>
                        <input type="number" id="balance-input" value="1000" min="0" max="100000" class="w-full bg-slate-950 text-white border border-slate-700 p-3 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 font-mono-tech">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">初期ポイント</label>
                        <input type="number" id="points-input" value="0" min="0" max="100000" class="w-full bg-slate-950 text-white border border-slate-700 p-3 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 font-mono-tech">
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeReg()" class="flex-1 py-3 text-slate-400 font-bold text-xs hover:text-white">キャンセル</button>
                <button id="save-btn" class="flex-[2] py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-xs shadow-lg">登録する</button>
            </div>
        </div>
    </div>

    <!-- 簡易編集用モーダルポップアップ -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-[2rem] p-6 shadow-2xl">
            <h3 class="text-xl font-black text-white mb-2">💰 残高・ポイント修正</h3>
            <p id="edit-card-title" class="text-xs text-indigo-400 font-bold mb-4"></p>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">現在の残高 (円)</label>
                    <input type="number" id="edit-balance-input" class="w-full bg-slate-950 text-white border border-slate-700 p-3.5 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 font-mono-tech">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">ポイント</label>
                    <input type="number" id="edit-points-input" class="w-full bg-slate-950 text-white border border-slate-700 p-3.5 rounded-xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 font-mono-tech">
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeEdit()" class="flex-1 py-3 text-slate-400 font-bold text-xs hover:text-white">閉じる</button>
                <button onclick="saveEdit()" class="flex-[2] py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-xs shadow-lg">更新保存</button>
            </div>
        </div>
    </div>

    <!-- メッセージポップアップ -->
    <div id="msg-box" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-5 py-4 rounded-2xl z-[100] shadow-2xl w-11/12 max-w-sm text-center">
        <p id="msg-content" class="text-xs font-bold leading-relaxed"></p>
        <button onclick="closeMsg()" class="mt-3 px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-[10px] font-black uppercase">OK</button>
    </div>

    <script>
        // DOM要素
        const scanBtn = document.getElementById('scan-btn');
        const badgeContainer = document.getElementById('badge-container');
        const guideBox = document.getElementById('guide-box');
        const logList = document.getElementById('log-list');
        const regModal = document.getElementById('reg-modal');
        const editModal = document.getElementById('edit-modal');
        const statusSub = document.getElementById('status-sub');
        const msgBox = document.getElementById('msg-box');
        const msgContent = document.getElementById('msg-content');
        
        // 追加取得要素
        const balanceDashboard = document.getElementById('balance-dashboard');
        const pointsAmount = document.getElementById('points-amount');
        const historyList = document.getElementById('history-list');
        const cardMetaFields = document.getElementById('card-meta-fields');
        const brandSelector = document.getElementById('brand-selector');

        // Canvas要素
        const sCanvas = document.getElementById('scannerCanvas');
        const sCtx = sCanvas.getContext('2d');
        const cardCanvas = document.getElementById('cardCanvas');
        const cCtx = cardCanvas.getContext('2d');

        // キャンバスサイズ初期設定
        sCanvas.width = 300;
        sCanvas.height = 300;
        cardCanvas.width = 316;
        cardCanvas.height = 200;

        let currentMode = 'card';
        let currentScannedId = '';
        let ndef = null;
        let abortController = null;
        let isScanning = false;
        let scanPulseRadius = 0;
        let systemType = 'other'; // 'android', 'ios', 'pc'
        let selectedRegisterBrand = 'Suica'; // 新規登録時に選択されたブランド

        const modes = {
            card: { label: 'CARD MODE', emoji: '💳', color: '#6366f1' },
            amiibo: { label: 'amiibo MODE', emoji: '🧸', color: '#ef4444' },
            dream: { label: '妖怪メダル MODE', emoji: '🌀', color: '#10b981' }
        };

        // 各カードブランドのデザイン構成
        const cardBrandConfigs = {
            "Suica": { type: "Suica", color: "#22c55e", subColor: "#15803d", txtColor: "#ffffff", brand: "交通系ICカード (JR東日本)" },
            "PASMO": { type: "PASMO", color: "#ec4899", subColor: "#be185d", txtColor: "#ffffff", brand: "交通系ICカード (PASMO)" },
            "ICOCA": { type: "ICOCA", color: "#06b6d4", subColor: "#0891b2", txtColor: "#ffffff", brand: "交通系ICカード (JR西日本)" },
            "WAON": { type: "WAON", color: "#a5f3fc", subColor: "#0284c7", txtColor: "#0f172a", brand: "電子マネー (WAON)" },
            "nanaco": { type: "nanaco", color: "#f59e0b", subColor: "#ea580c", txtColor: "#ffffff", brand: "電子マネー (nanaco)" },
            "楽天Edy": { type: "Edy", color: "#3b82f6", subColor: "#1d4ed8", txtColor: "#ffffff", brand: "電子マネー (楽天Edy)" },
            "その他": { type: "CUSTOM", color: "#64748b", subColor: "#334155", txtColor: "#ffffff", brand: "FeliCa 汎用 / カスタム" }
        };

        const dummyHistoryActions = [
            { desc: "自動改札機 (入場)", diff: "---" },
            { desc: "自動改札機 (出場)", diff: "-¥180" },
            { desc: "コンビニ決済 (お買い物)", diff: "-¥640" },
            { desc: "飲料自販機 (決済)", diff: "-¥160" },
            { desc: "窓口チャージ (現金)", diff: "+¥2,000" }
        ];

        function showMsg(text) {
            msgContent.innerText = text;
            msgBox.classList.remove('hidden');
        }

        function closeMsg() {
            msgBox.classList.add('hidden');
        }

        function addBadge(text, colorClass) {
            const b = document.createElement('div');
            b.className = `px-3 py-1 ${colorClass} text-[9px] font-bold rounded-full uppercase tracking-tighter`;
            b.innerText = text;
            badgeContainer.appendChild(b);
        }

        // モード変更
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-card').forEach(b => b.classList.remove('active-mode'));
            document.getElementById('btn-'+mode).classList.add('active-mode');
            const m = modes[mode];
            document.getElementById('header-bar').innerText = m.label;
            document.getElementById('header-bar').style.backgroundColor = m.color;
            
            if (isScanning) {
                stopScan();
            } else {
                document.getElementById('status-text').innerText = "スキャン待機中";
                updateStatusSub();
            }
            
            if (currentMode !== 'card') {
                balanceDashboard.classList.add('hidden');
            }
        }

        function updateStatusSub() {
            if (systemType === 'ios') {
                statusSub.innerHTML = 'iPhoneのカメラ付近（最上部/MagSafe上部）を<br>カードやタグにぴったり密着させてください';
            } else if (systemType === 'pc') {
                statusSub.innerHTML = 'USB NFCリーダー（PaPaRiなど）の上に<br>カードを水平に乗せてください';
            } else {
                statusSub.innerHTML = 'スマートフォン背面のNFCアンテナ位置に<br>近づけてください';
            }
        }

        // 初期化環境判定
        function init() {
            const hasNFC = 'NDEFReader' in window;
            const ua = navigator.userAgent;
            const isAndroid = /Android/i.test(ua);
            const isIOS = /iPhone|iPad|iPod/i.test(ua);

            if (isAndroid) {
                systemType = 'android';
                addBadge("Android Active", "bg-green-500/20 text-green-400 border border-green-500/30");
            } else if (isIOS) {
                systemType = 'ios';
                addBadge("iPhone Detected", "bg-blue-500/20 text-blue-400 border border-blue-500/30");
            } else {
                systemType = 'pc';
                addBadge("PC Terminal", "bg-amber-500/20 text-amber-400 border border-amber-500/30");
            }

            addBadge(hasNFC ? "NFC API Ready" : "NFC Simulator", hasNFC ? "bg-indigo-500 text-white" : "bg-slate-700 text-slate-300");

            // ガイドボックスの表示
            if (systemType === 'ios') {
                document.getElementById('guide-title').innerText = "📱 iPhoneのNFC読み取りについて";
                document.getElementById('guide-text').innerText = "iOSのSafariでは標準で直接Web NFC APIが解放されていないため、スキャン時には下の「Canvas画面」をタップしてシミュレーターをお試しください。本体上端(MagSafeのすぐ上)にアンテナが存在します。";
            } else if (systemType === 'pc') {
                document.getElementById('guide-title').innerText = "🔌 USB NFCリーダーが必要な環境です";
                document.getElementById('guide-text').innerText = "デスクトップPCでお使いの場合、NFC通信を行うには外付けUSB NFCリーダー(PaPaRiやSony Pasoriなど)を接続する必要があります。画面タップでシミュレーターをいつでも体験可能です。";
            } else if (hasNFC) {
                document.getElementById('guide-title').innerText = "⚡ Web NFC API 接続成功";
                document.getElementById('guide-text').innerText = "Android Chrome環境です。下部のボタンをタップして端末背面のNFC受信エリアに近づけることで実際の各種ICカードを読み取ることができます。";
            } else {
                document.getElementById('guide-title').innerText = "💡 スキャンシミュレータ搭載";
                document.getElementById('guide-text').innerText = "この端末では直接のNFCポートが確認できません。中央のCanvas領域をタップすることで模擬スキャン動作と残高表示をお楽しみいただけます！";
            }

            if (hasNFC) {
                scanBtn.disabled = false;
                scanBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                scanBtn.innerText = "シミュレータースタート";
            }

            buildBrandSelector();
            loadCollection();
            requestAnimationFrame(drawScannerLoop);
        }

        // 登録モーダル内にブランド選択ボタンを構築
        function buildBrandSelector() {
            brandSelector.innerHTML = '';
            Object.keys(cardBrandConfigs).forEach(brand => {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = `brand-btn py-2 text-xs font-bold rounded-lg border transition-all ${brand === selectedRegisterBrand ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`;
                btn.innerText = brand;
                btn.onclick = () => selectRegisterBrand(brand);
                brandSelector.appendChild(btn);
            });
        }

        function selectRegisterBrand(brand) {
            selectedRegisterBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(btn => {
                if (btn.innerText === brand) {
                    btn.className = "brand-btn py-2 text-xs font-bold rounded-lg border transition-all bg-indigo-600 border-indigo-500 text-white";
                } else {
                    btn.className = "brand-btn py-2 text-xs font-bold rounded-lg border transition-all bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500";
                }
            });
        }

        // ==========================================
        // CANVAS 1: メインスキャナー＆デバイスガイド描画
        // ==========================================
        let usbAngle = 0;
        function drawScannerLoop() {
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
            
            // 背景グラデーション
            const bgGrad = sCtx.createRadialGradient(150, 150, 20, 150, 150, 180);
            bgGrad.addColorStop(0, '#0f172a');
            bgGrad.addColorStop(1, '#020617');
            sCtx.fillStyle = bgGrad;
            sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);

            // スキャン中パルス
            if (isScanning) {
                scanPulseRadius += 2;
                if (scanPulseRadius > 140) scanPulseRadius = 0;

                sCtx.beginPath();
                sCtx.arc(150, 150, scanPulseRadius, 0, Math.PI * 2);
                sCtx.strokeStyle = `rgba(99, 102, 241, ${1 - scanPulseRadius / 140})`;
                sCtx.lineWidth = 4;
                sCtx.stroke();

                sCtx.beginPath();
                sCtx.arc(150, 150, Math.max(0, scanPulseRadius - 40), 0, Math.PI * 2);
                sCtx.strokeStyle = `rgba(16, 185, 129, ${0.8 - scanPulseRadius / 140})`;
                sCtx.lineWidth = 2;
                sCtx.stroke();
            }

            // モードに対応するネオンフレームを描画
            const currentThemeColor = modes[currentMode].color;
            sCtx.strokeStyle = currentThemeColor;
            sCtx.lineWidth = 3;
            sCtx.strokeRect(10, 10, 280, 280);
            sCtx.strokeRect(6, 6, 288, 288);

            // ガイドグラフィックの描画
            if (systemType === 'ios') {
                drawIPhoneGuide(sCtx, currentThemeColor);
            } else if (systemType === 'pc') {
                drawPCGuide(sCtx, currentThemeColor);
            } else {
                drawAndroidGuide(sCtx, currentThemeColor);
            }

            requestAnimationFrame(drawScannerLoop);
        }

        function drawIPhoneGuide(ctx, themeColor) {
            // iPhoneボディ
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 5;
            ctx.fillStyle = "#1e293b";
            roundRect(ctx, 90, 40, 120, 220, 18, true, true);

            // カメラバンプ
            ctx.fillStyle = "#334155";
            roundRect(ctx, 100, 50, 45, 45, 10, true, false);

            // カメラレンズ
            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.arc(112, 62, 8, 0, Math.PI*2);
            ctx.arc(133, 83, 8, 0, Math.PI*2);
            ctx.fill();

            // MagSafeのアウトラインを破線で表現
            ctx.strokeStyle = "rgba(100, 116, 139, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.arc(150, 150, 32, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // NFC放射電磁波スポット（カメラの右隣・iPhone上端部）
            const pulse = (Date.now() % 1500) / 1500;
            ctx.strokeStyle = "rgba(239, 68, 68, " + (1 - pulse) + ")";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(150, 50, 20 + pulse * 25, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(150, 50, 6, 0, Math.PI * 2);
            ctx.fill();

            // 指標ラベル
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 9px 'DotGothic16', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("NFC SENSOR AREA", 150, 30);
            ctx.font = "8px sans-serif";
            ctx.fillStyle = "#94a3b8";
            ctx.fillText("カメラの真横（本体上端部）", 150, 215);
        }

        function drawPCGuide(ctx, themeColor) {
            // デスクトップモニター/本体枠
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 4;
            ctx.fillStyle = "#1e293b";
            roundRect(ctx, 60, 40, 180, 110, 10, true, true);
            
            // PCスタンド
            ctx.fillStyle = "#334155";
            ctx.fillRect(135, 150, 30, 25);
            ctx.fillRect(110, 175, 80, 8);

            // USBポート表示
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(215, 110, 12, 6);

            // USBリーダー（PaPaRi型）とケーブル
            usbAngle += 0.03;
            const floatOffset = Math.sin(usbAngle) * 6;

            // NFCリーダー
            ctx.fillStyle = "#0f172a";
            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 2;
            roundRect(ctx, 100, 190 + floatOffset, 100, 60, 8, true, true);
            
            // リーダーアンテナロゴマーク
            ctx.strokeStyle = "rgba(99, 102, 241, 0.4)";
            ctx.beginPath();
            ctx.arc(150, 220 + floatOffset, 14, 0, Math.PI*2);
            ctx.stroke();

            // USBケーブルの接続アニメーション
            ctx.strokeStyle = "#64748b";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(200, 220 + floatOffset);
            ctx.bezierCurveTo(240, 220 + floatOffset, 240, 113, 227, 113);
            ctx.stroke();

            // スキャン波（リーダーから）
            if (isScanning) {
                const wave = (Date.now() % 1200) / 1200;
                ctx.strokeStyle = `rgba(16, 185, 129, ${1 - wave})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(150, 220 + floatOffset, 20 + wave * 30, 10 + wave * 15, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // ガイドテキスト
            ctx.fillStyle = "#fbbf24";
            ctx.font = "bold 9px 'DotGothic16', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("USB READER REQUIRED", 150, 80);
            ctx.fillStyle = "#94a3b8";
            ctx.fillText("外付けリーダーをポートに挿入", 150, 100);
        }

        function drawAndroidGuide(ctx, themeColor) {
            // Androidスマートフォン
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 5;
            ctx.fillStyle = "#1e293b";
            roundRect(ctx, 95, 40, 110, 220, 15, true, true);

            // インカメラ
            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            ctx.arc(150, 52, 4, 0, Math.PI * 2);
            ctx.fill();

            // NFCアンテナ（スマホ裏面中央）
            ctx.strokeStyle = "rgba(99, 102, 241, 0.6)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.ellipse(150, 150, 30, 45, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // 電磁波マーク
            ctx.fillStyle = themeColor;
            ctx.font = "20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(modes[currentMode].emoji, 150, 156);

            // ラベル
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 9px 'DotGothic16', sans-serif";
            ctx.fillText("NFC COIL DETECTION", 150, 215);
            ctx.font = "8px sans-serif";
            ctx.fillStyle = "#94a3b8";
            ctx.fillText("端末の背面中央にかざします", 150, 230);
        }

        // 角丸四角形ヘルパー
        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }


        // ==========================================
        // CANVAS 2: ICカード券面リアルタイム生成・描画
        // ==========================================
        let lastDisplayedId = ''; // 簡易編集時に使うためのメモリ

        function drawDigitalCard(id) {
            lastDisplayedId = id;
            cCtx.clearRect(0, 0, cardCanvas.width, cardCanvas.height);

            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            const registeredCard = data[id];

            let brand = "Suica";
            let balance = 1000;
            let points = 0;
            let customName = "COLLECTOR CARD";

            // 登録された実データがあればそちらを使用
            if (registeredCard && registeredCard.type === 'card') {
                brand = registeredCard.cardBrand || "Suica";
                balance = registeredCard.balance !== undefined ? Number(registeredCard.balance) : 1000;
                points = registeredCard.points !== undefined ? Number(registeredCard.points) : 0;
                customName = registeredCard.name || "COLLECTOR CARD";
            } else {
                // 未登録の一時スキャン時はシードから擬似生成
                let seed = 0;
                for (let i = 0; i < id.length; i++) seed += id.charCodeAt(i);
                const brands = Object.keys(cardBrandConfigs);
                brand = brands[seed % brands.length];
                balance = (seed * 13) % 18500 + 120;
                points = (seed * 7) % 1200;
                customName = "UNKNOWN IC CARD";
            }

            const cardDesign = cardBrandConfigs[brand] || cardBrandConfigs["その他"];

            // 1. カード背景ベース
            const gradient = cCtx.createLinearGradient(0, 0, cardCanvas.width, cardCanvas.height);
            gradient.addColorStop(0, cardDesign.color);
            gradient.addColorStop(1, cardDesign.subColor);
            cCtx.fillStyle = gradient;
            roundRect(cCtx, 0, 0, cardCanvas.width, cardCanvas.height, 14, true, false);

            // 2. 装飾用グリッドライン
            cCtx.strokeStyle = "rgba(255, 255, 255, 0.08)";
            cCtx.lineWidth = 1;
            for (let i = 0; i < cardCanvas.width; i += 20) {
                cCtx.beginPath();
                cCtx.moveTo(i, 0);
                cCtx.lineTo(i, cardCanvas.height);
                cCtx.stroke();
            }
            cCtx.fillStyle = "rgba(255, 255, 255, 0.05)";
            cCtx.beginPath();
            cCtx.moveTo(0, 100);
            cCtx.bezierCurveTo(100, 50, 200, 160, cardCanvas.width, 110);
            cCtx.lineTo(cardCanvas.width, cardCanvas.height);
            cCtx.lineTo(0, cardCanvas.height);
            cCtx.fill();

            // 3. 金属ICチップ描画
            cCtx.fillStyle = "#fbbf24";
            roundRect(cCtx, 30, 60, 42, 32, 6, true, false);
            cCtx.strokeStyle = "#b45309";
            cCtx.lineWidth = 1.5;
            cCtx.strokeRect(30, 60, 42, 32);
            cCtx.beginPath();
            cCtx.moveTo(44, 60); cCtx.lineTo(44, 92);
            cCtx.moveTo(58, 60); cCtx.lineTo(58, 92);
            cCtx.moveTo(30, 76); cCtx.lineTo(72, 76);
            cCtx.stroke();

            // 4. 残高表示
            cCtx.fillStyle = cardDesign.txtColor;
            cCtx.font = "bold 9px 'DotGothic16', sans-serif";
            cCtx.textAlign = "left";
            cCtx.fillText("CURRENT BALANCE", 30, 125);
            cCtx.font = "900 24px 'Share Tech Mono', monospace";
            cCtx.fillText("¥ " + balance.toLocaleString(), 28, 150);

            // 5. カードブランド名・登録名
            cCtx.font = "bold 16px 'DotGothic16', sans-serif";
            cCtx.fillText(brand, 30, 40);

            cCtx.font = "bold 8px 'DotGothic16', sans-serif";
            cCtx.fillStyle = "rgba(255, 255, 255, 0.8)";
            cCtx.fillText("名義: " + customName, 30, 175);
            
            // シリアル番号
            cCtx.textAlign = "right";
            cCtx.font = "bold 9px 'Share Tech Mono', monospace";
            cCtx.fillStyle = "rgba(255, 255, 255, 0.8)";
            cCtx.fillText("ID: " + id.toUpperCase(), cardCanvas.width - 20, 34);

            // 6. 電波ホログラム
            cCtx.strokeStyle = "rgba(255, 255, 255, 0.4)";
            cCtx.lineWidth = 2;
            cCtx.beginPath();
            cCtx.arc(cardCanvas.width - 35, 140, 6, -Math.PI/4, Math.PI/4);
            cCtx.stroke();
            cCtx.beginPath();
            cCtx.arc(cardCanvas.width - 35, 140, 12, -Math.PI/4, Math.PI/4);
            cCtx.stroke();
            cCtx.beginPath();
            cCtx.arc(cardCanvas.width - 35, 140, 18, -Math.PI/4, Math.PI/4);
            cCtx.stroke();

            // ポイント表示更新
            pointsAmount.innerText = `${points.toLocaleString()} P`;

            // 7. 利用履歴の模擬描画
            historyList.innerHTML = '';
            // IDをもとにしたダミー履歴
            let seed = 0;
            for (let i = 0; i < id.length; i++) seed += id.charCodeAt(i);
            for (let i = 0; i < 3; i++) {
                const actIndex = (seed + i) % dummyHistoryActions.length;
                const action = dummyHistoryActions[actIndex];
                
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-700/40";
                item.innerHTML = `
                    <span class="text-slate-300">#0${i+1} ${action.desc}</span>
                    <span class="${action.diff.startsWith('+') ? 'text-green-400 font-bold' : action.diff.startsWith('-') ? 'text-red-400' : 'text-slate-400'}">${action.diff}</span>
                `;
                historyList.appendChild(item);
            }

            balanceDashboard.classList.remove('hidden');
        }


        // ==========================================
        // NFC 通信ロジック (Web NFC / NDEFReader)
        // ==========================================
        async function startScan() {
            if (!('NDEFReader' in window)) {
                // 非対応時用の模擬スキャン
                triggerSimulatorScan();
                return;
            }

            try {
                if (abortController) abortController.abort();
                abortController = new AbortController();

                ndef = new NDEFReader();
                await ndef.scan({ signal: abortController.signal });

                isScanning = true;
                document.getElementById('status-text').innerText = "スキャン中...";
                statusSub.innerHTML = "<b class='text-green-400 animate-pulse'>NFCリーダーにICカードを近づけたままにしてください</b>";
                scanBtn.innerText = "スキャンを一時停止";
                scanBtn.className = "w-full py-4 bg-red-600 hover:bg-red-500 text-white rounded-2xl font-black text-sm tracking-widest shadow-lg transition-all";
                scanBtn.onclick = stopScan;

                ndef.onreadingerror = () => {
                    showMsg("通信に失敗しました。接触面を維持した状態で、もう一度タッチしてください。");
                };

                ndef.onreading = (event) => {
                    const id = event.serialNumber;
                    handleScannedItem(id);
                };

            } catch (error) {
                console.warn(error);
                if (error.name === "NotAllowedError") {
                    showMsg("NFCへのアクセス権限が拒否されています。ブラウザの設定でNFC許可を確認してください。");
                } else {
                    showMsg("NFCがサポートされていないか、無効になっています: " + error.message);
                }
                stopScan();
            }
        }

        function stopScan() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            isScanning = false;
            document.getElementById('status-text').innerText = "準備完了";
            scanBtn.innerText = "スキャンを開始する";
            scanBtn.className = "w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-sm tracking-widest shadow-lg transition-all";
            scanBtn.onclick = startScan;
            updateStatusSub();
        }

        function triggerSimulatorScan() {
            isScanning = true;
            document.getElementById('status-text').innerText = "スキャン通信中...";
            
            setTimeout(() => {
                const randomHex = Array.from({length: 7}, () => Math.floor(Math.random()*256).toString(16).padStart(2, '0')).join(':');
                handleScannedItem(randomHex);
                isScanning = false;
                document.getElementById('status-text').innerText = "準備完了";
            }, 800);
        }

        function handleScannedItem(id) {
            if (currentMode === 'card') {
                drawDigitalCard(id);
            }

            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            if (data[id]) {
                document.getElementById('status-text').innerText = "スキャン成功！";
                const typeLabel = data[id].type === 'card' ? `${data[id].cardBrand || 'CARD'}` : data[id].type.toUpperCase();
                statusSub.innerHTML = `<span class="text-indigo-400 font-bold text-lg">${data[id].name}</span><br><span class="text-[10px] text-slate-500">(${typeLabel}確認完了)</span>`;
                
                setTimeout(() => {
                    if (isScanning) {
                        document.getElementById('status-text').innerText = "スキャン中...";
                        statusSub.innerHTML = "次のアイテムをかざしてください";
                    } else {
                        document.getElementById('status-text').innerText = "準備完了";
                        updateStatusSub();
                    }
                }, 3000);
            } else {
                currentScannedId = id;
                document.getElementById('scanned-id-type').innerText = currentMode.toUpperCase() + " TAG";
                document.getElementById('scanned-id').innerText = `物理固有シリアル: ${id}`;
                
                // モードに応じて登録メタ表示のオンオフ
                if (currentMode === 'card') {
                    cardMetaFields.classList.remove('hidden');
                } else {
                    cardMetaFields.classList.add('hidden');
                }

                regModal.classList.remove('hidden');
                document.getElementById('name-input').focus();
            }
        }

        // コレクション保存処理
        function saveEntry() {
            const name = document.getElementById('name-input').value.trim();
            if (!name) return;
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            
            const itemData = {
                name: name,
                type: currentMode
            };

            // CARDモードの場合は詳細情報を追加
            if (currentMode === 'card') {
                itemData.cardBrand = selectedRegisterBrand;
                itemData.balance = Number(document.getElementById('balance-input').value) || 0;
                itemData.points = Number(document.getElementById('points-input').value) || 0;
            }

            data[currentScannedId] = itemData;
            localStorage.setItem('nfc_data', JSON.stringify(data));
            closeReg();
            loadCollection();

            if (currentMode === 'card') {
                drawDigitalCard(currentScannedId);
            }
            
            if (isScanning) {
                document.getElementById('status-text').innerText = "スキャン中...";
                statusSub.innerHTML = "引き続き、次のアイテムをスキャンできます";
            }
        }

        function closeReg() {
            regModal.classList.add('hidden');
            document.getElementById('name-input').value = "";
            document.getElementById('balance-input').value = "1000";
            document.getElementById('points-input').value = "0";
        }

        // ==========================================
        // 残高の簡易修正 (Edit Modal)
        // ==========================================
        function openQuickEdit() {
            if (!lastDisplayedId) return;
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            const card = data[lastDisplayedId];
            if (!card) {
                showMsg("登録されていないカードは残高変更できません。まずはスキャンして登録してください。");
                return;
            }

            document.getElementById('edit-card-title').innerText = `${card.name} (${card.cardBrand})`;
            document.getElementById('edit-balance-input').value = card.balance !== undefined ? card.balance : 0;
            document.getElementById('edit-points-input').value = card.points !== undefined ? card.points : 0;
            editModal.classList.remove('hidden');
        }

        function closeEdit() {
            editModal.classList.add('hidden');
        }

        function saveEdit() {
            if (!lastDisplayedId) return;
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            if (data[lastDisplayedId]) {
                data[lastDisplayedId].balance = Number(document.getElementById('edit-balance-input').value) || 0;
                data[lastDisplayedId].points = Number(document.getElementById('edit-points-input').value) || 0;
                localStorage.setItem('nfc_data', JSON.stringify(data));
                closeEdit();
                loadCollection();
                drawDigitalCard(lastDisplayedId);
                showMsg("残高とポイントを更新しました！");
            }
        }

        // ==========================================
        // コレクション表示・管理
        // ==========================================
        function loadCollection() {
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            logList.innerHTML = '';
            const ids = Object.keys(data).reverse();
            if (ids.length === 0) {
                logList.innerHTML = '<p class="text-center py-10 text-slate-500 text-xs font-bold uppercase tracking-widest border border-dashed border-slate-800 rounded-2xl">No items in collection</p>';
                return;
            }
            ids.forEach(id => {
                const item = data[id];
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-4 rounded-2xl flex items-center justify-between border border-slate-700/50 shadow-sm hover:border-indigo-500/50 transition-all";
                
                let detailsHtml = `${item.type.toUpperCase()} | ${id}`;
                if (item.type === 'card') {
                    const bal = item.balance !== undefined ? item.balance : 0;
                    detailsHtml = `${item.cardBrand || 'CARD'} (残高: ¥${bal.toLocaleString()}) | ${id}`;
                }

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-2xl">${modes[item.type]?.emoji || '❓'}</div>
                        <div>
                            <div class="font-bold text-slate-100 text-sm">${item.name}</div>
                            <div class="text-[9px] font-mono-tech text-slate-500 uppercase tracking-widest">${detailsHtml}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${item.type === 'card' ? `<button onclick="drawDigitalCard('${id}')" class="text-[9px] bg-indigo-500/20 text-indigo-300 font-bold px-2 py-1 rounded-md border border-indigo-500/30 hover:bg-indigo-500/30 transition-all">券面表示</button>` : ''}
                        <button onclick="deleteItem('${id}')" class="text-slate-500 hover:text-red-400 p-1.5 text-sm">✕</button>
                    </div>
                `;
                logList.appendChild(div);
            });
        }

        function deleteItem(id) {
            const data = JSON.parse(localStorage.getItem('nfc_data') || '{}');
            delete data[id];
            localStorage.setItem('nfc_data', JSON.stringify(data));
            loadCollection();
            if (lastDisplayedId === id) {
                balanceDashboard.classList.add('hidden');
                lastDisplayedId = '';
            }
        }

        function clearCollection() {
            localStorage.removeItem('nfc_data');
            loadCollection();
            balanceDashboard.classList.add('hidden');
            lastDisplayedId = '';
            showMsg("コレクションデータを初期化しました");
        }

        // イベント登録
        scanBtn.onclick = startScan;
        document.getElementById('save-btn').onclick = saveEntry;
        sCanvas.onclick = triggerSimulatorScan;

        // アプリ起動
        init();
    </script>
