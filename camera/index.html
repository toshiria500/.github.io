<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Object Detector</title>

<style>
body {
    font-family: sans-serif;
    margin: 0;
    text-align: center;
    background: #f0f0f0;
}

.video-container {
    position: relative;
    display: inline-block;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 10px;
    border: 4px solid #333;
}

video {
    display: block;
    max-width: 100%;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#loading {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}
</style>
</head>

<body>

<div id="loading">AIモデルをロード中...</div>

<div class="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
