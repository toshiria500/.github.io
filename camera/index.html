<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Object Detector</title>
    <link rel="stylesheet" href="style.css"> <style>
        body { font-family: sans-serif; margin: 0; text-align: center; background: #f0f0f0; }
        .container { position: relative; display: inline-block; background: #000; margin-top: 10px; }
        video { display: block; max-width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #loading-overlay { position: fixed; inset: 0; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .progress-box { width: 250px; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin: 10px; }
        #progress-bar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.2s; }
        #error-message { color: red; font-weight: bold; padding: 20px; display: none; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <h3 id="load-status">システム起動中...</h3>
        <div class="progress-box"><div id="progress-bar"></div></div>
        <div id="size-info">0 MB / 0 MB</div>
    </div>

    <h1>AIカメラ物体検知</h1>
    <div id="error-message"></div>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    
    <script src="script.js"></script>
</body>
</html>
