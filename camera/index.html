<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIカメラ：完全修正版</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; text-align: center; background-color: #f0f0f0; }
        .container { position: relative; display: inline-block; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        video { display: block; max-width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .progress-box { width: 80%; max-width: 300px; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; margin: 10px 0; }
        #progress-bar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.2s; }
        #error-message { color: red; font-weight: bold; margin: 20px; display: none; background: #fff; padding: 15px; border: 2px solid red; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <h3 id="load-status">AIを準備しています...</h3>
        <div class="progress-box"><div id="progress-bar"></div></div>
        <div id="size-info">0 MB / 0 MB</div>
    </div>

    <h1>AI物体検知</h1>
    <div id="error-message"></div>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const canvasCtx = canvas.getContext('2d');
        const errorDiv = document.getElementById('error-message');
        const progressBar = document.getElementById('progress-bar');
        const sizeInfo = document.getElementById('size-info');
        const loadingOverlay = document.getElementById('loading-overlay');

        let objectDetector;
        const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.style.display = "block";
            loadingOverlay.style.display = "none";
        }

        // 進捗付きロード
        async function fetchModel(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open("GET", url, true);
                xhr.responseType = "blob";
                xhr.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        progressBar.style.width = percent + "%";
                        sizeInfo.innerText = `${(e.loaded/1024/1024).toFixed(1)}MB / ${(e.total/1024/1024).toFixed(1)}MB`;
                    }
                };
                xhr.onload = () => (xhr.status === 200) ? resolve(URL.createObjectURL(xhr.response)) : reject("モデル取得失敗");
                xhr.onerror = () => reject("通信エラー");
                xhr.send();
            });
        }

        async function init() {
            try {
                // 【重要】ライブラリから直接クラスを取り出す（ReferenceError対策）
                const { ObjectDetector, FilesetResolver } = await bundle; 

                const modelUrl = await fetchModel(MODEL_URL);
                
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );

                objectDetector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelUrl, delegate: "GPU" },
                    scoreThreshold: 0.5,
                    runningMode: "VIDEO"
                });

                loadingOverlay.style.display = "none";
                startCamera();
            } catch (e) {
                showError("初期化エラー: " + e);
            }
        }

        async function startCamera() {
            const videoConfig = { width: 640, height: 480 };
            try {
                // 外カメラを試す
                video.srcObject = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, ...videoConfig },
                    audio: false
                });
            } catch (e) {
                // 失敗時は内カメラ等
                try {
                    video.srcObject = await navigator.mediaDevices.getUserMedia({
                        video: videoConfig,
                        audio: false
                    });
                } catch (e2) {
                    showError("カメラを起動できませんでした。");
                }
            }
            video.onloadeddata = predict;
        }

        async function predict() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const results = await objectDetector.detectForVideo(video, performance.now());
            
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            results.detections.forEach(d => {
                const box = d.boundingBox;
                canvasCtx.strokeStyle = "#00FF00";
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeRect(box.originX, box.originY, box.width, box.height);
                canvasCtx.fillStyle = "#00FF00";
                canvasCtx.font = "18px bold sans-serif";
                canvasCtx.fillText(`${d.categories[0].categoryName}`, box.originX, box.originY > 20 ? box.originY - 5 : 20);
            });
            requestAnimationFrame(predict);
        }

        init();
    </script>
</body>
</html>
