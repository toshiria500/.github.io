<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIカメラ：進捗表示付き</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 20px; text-align: center; background-color: #f4f7f6; color: #333; }
        .container { position: relative; display: inline-block; margin-top: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.15); background: #000; }
        video { display: block; max-width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* ロード画面のスタイル */
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .progress-container { width: 80%; max-width: 400px; background: #eee; border-radius: 20px; height: 20px; margin: 15px 0; overflow: hidden; border: 1px solid #ddd; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.1s; }
        #loading-text { font-size: 14px; color: #666; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <h2>AIモデルを準備中</h2>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="loading-text">データを取得しています...</div>
        <div id="size-info" style="font-size: 12px; margin-top: 5px; color: #999;">0 MB / 0 MB</div>
    </div>

    <h1>AI物体検知カメラ</h1>
    
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="status">カメラを待機中...</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const canvasCtx = canvas.getContext('2d');
        const progressBar = document.getElementById('progress-bar');
        const loadingText = document.getElementById('loading-text');
        const sizeInfo = document.getElementById('size-info');
        const loadingOverlay = document.getElementById('loading-overlay');
        const statusDiv = document.getElementById('status');

        let objectDetector;
        const videoWidth = 480;
        const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";

        // 1. モデルファイルを自前でダウンロードして進捗を表示する
        async function fetchModelWithProgress(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob';

                xhr.onprogress = (event) => {
                    if (event.lengthComputable) {
                        const percentComplete = (event.loaded / event.total) * 100;
                        const loadedMB = (event.loaded / 1024 / 1024).toFixed(2);
                        const totalMB = (event.total / 1024 / 1024).toFixed(2);
                        
                        progressBar.style.width = percentComplete + '%';
                        loadingText.innerText = `読み込み中: ${Math.round(percentComplete)}%`;
                        sizeInfo.innerText = `${loadedMB} MB / ${totalMB} MB`;
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        resolve(URL.createObjectURL(xhr.response));
                    } else {
                        reject('モデルの取得に失敗しました');
                    }
                };
                xhr.send();
            });
        }

        // 2. AIの初期化
        async function initialize() {
            try {
                // モデルをダウンロード
                const modelBlobUrl = await fetchModelWithProgress(MODEL_URL);
                
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );

                objectDetector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: modelBlobUrl, // ダウンロードしたBlobのURLを使用
                        delegate: "GPU"
                    },
                    scoreThreshold: 0.5,
                    runningMode: "VIDEO"
                });

                loadingOverlay.style.display = 'none';
                startCamera();
            } catch (error) {
                loadingText.innerText = "エラーが発生しました";
                console.error(error);
            }
        }

        // 3. カメラ起動（前回の外カメ判別ロジックを継承）
        async function startCamera() {
            const constraints = {
                video: { facingMode: { exact: "environment" }, width: videoWidth },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.addEventListener('loadeddata', predictWebcam);
                statusDiv.innerText = "外カメラ稼働中";
            } catch (err) {
                // 外カメがない場合は内カメへ
                const fallbackConstraints = { video: { width: videoWidth }, audio: false };
                const fallbackStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                video.srcObject = fallbackStream;
                video.addEventListener('loadeddata', predictWebcam);
                statusDiv.innerText = "標準カメラ稼働中 (外カメ非対応)";
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const detections = await objectDetector.detectForVideo(video, performance.now());
                drawResults(detections);
            }
            window.requestAnimationFrame(predictWebcam);
        }

        function drawResults(detections) {
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            detections.detections.forEach(detection => {
                const box = detection.boundingBox;
                const category = detection.categories[0];
                
                canvasCtx.strokeStyle = "#4caf50";
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeRect(box.originX, box.originY, box.width, box.height);

                canvasCtx.fillStyle = "#4caf50";
                canvasCtx.font = "bold 16px Arial";
                const label = `${category.categoryName} ${Math.round(category.score * 100)}%`;
                canvasCtx.fillText(label, box.originX, box.originY > 20 ? box.originY - 10 : 20);
            });
        }

        initialize();
    </script>
</body>
</html>
