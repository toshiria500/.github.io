<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラウザ内 物体検知 (外カメ自動判別)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; text-align: center; background-color: #f0f0f0; }
        h1 { font-size: 1.5rem; color: #333; }
        .container { position: relative; display: inline-block; margin-top: 10px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        video { background-color: #000; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { margin-top: 15px; font-weight: bold; color: #555; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>AIモデルをロード中...</p>
    </div>

    <h1>AIカメラ：物体検知</h1>
    <p>日常的な物をカメラに映してください。</p>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="status">カメラの起動を待っています...</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const canvasCtx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        let objectDetector;
        let runningMode = "VIDEO";
        const videoWidth = 480; // ビデオの幅（パフォーマンス重視で少し小さめ）

        // 1. AIモデルを初期化する
        async function initializeObjectDetector() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                objectDetector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite`,
                        delegate: "GPU" // GPUを使って高速化
                    },
                    scoreThreshold: 0.5, // 信頼度50%以上のみ表示
                    runningMode: runningMode
                });
                loadingOverlay.style.display = 'none'; // ロード画面を消す
                statusDiv.innerText = "AI準備完了！カメラを起動します。";
                
                // カメラ起動処理へ
                startCamera();
            } catch (error) {
                statusDiv.innerText = "モデルのロードに失敗しました: " + error;
                console.error(error);
            }
        }

        // 2. カメラを起動する（外カメ判別機能付き）
        async function startCamera() {
            // まず、「絶対に外カメラ(environment)を使ってください」という厳密な条件を指定
            const rearCameraConstraints = {
                video: { facingMode: { exact: "environment" }, width: videoWidth },
                audio: false
            };

            try {
                // 外カメラの起動を試みる（スマホやタブレットPCを想定）
                const stream = await navigator.mediaDevices.getUserMedia(rearCameraConstraints);
                video.srcObject = stream;
                video.addEventListener('loadeddata', predictWebcam);
                statusDiv.innerText = "外カメラで検知中...";
                
            } catch (err) {
                // 外カメラが見つからない場合（OverconstrainedError または NotFoundError）
                if (err.name === 'OverconstrainedError' || err.name === 'NotFoundError') {
                    
                    // ユーザーに外カメ非対応であることを通知
                    alert("このデバイスは外カメラ（背面カメラ）が見つからないため、標準カメラを起動します。");
                    
                    // 外カメラの厳密指定を外し、とりあえず使えるカメラ（デフォルト）を要求する
                    const defaultConstraints = {
                        video: { width: videoWidth }, // facingModeを指定しない
                        audio: false
                    };

                    try {
                        // 標準カメラで再試行（一般的なノートPCを想定）
                        const fallbackStream = await navigator.mediaDevices.getUserMedia(defaultConstraints);
                        video.srcObject = fallbackStream;
                        video.addEventListener('loadeddata', predictWebcam);
                        statusDiv.innerText = "標準カメラで検知中...";
                    } catch (fallbackErr) {
                        statusDiv.innerText = "カメラの起動に失敗しました: " + fallbackErr.name;
                        console.error(fallbackErr);
                    }

                } else {
                    // ユーザーがカメラのアクセス権限自体を「ブロック」した場合など
                    statusDiv.innerText = "カメラへのアクセスが許可されていません: " + err.name;
                    console.error(err);
                }
            }
        }

        let lastVideoTime = -1;
        // 3. リアルタイムで判定を繰り返す
        async function predictWebcam() {
            // キャンバスのサイズをビデオに合わせる
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            let startTimeMs = performance.now();
            
            // 映像が更新された場合のみ判定を実行
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const detections = await objectDetector.detectForVideo(video, startTimeMs);
                
                // 描画処理
                drawResults(detections);
            }

            // 永久ループ（次のフレームで再実行）
            window.requestAnimationFrame(predictWebcam);
        }

        // 4. 判定結果をキャンバスに描画する（枠と名前）
        function drawResults(detections) {
            // 前回描画した内容をクリア
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            detections.detections.forEach(detection => {
                // 判定結果の座標を取得
                const box = detection.boundingBox;
                const category = detection.categories[0];
                const categoryName = category.categoryName; // 物体名（英語）
                const score = Math.round(parseFloat(category.score) * 100); // 信頼度

                // 日本語名への簡易変換テーブル
                const jaNameMap = {
                    "person": "人", "cell phone": "スマホ", "cup": "コップ", "chair": "椅子",
                    "laptop": "ノートPC", "mouse": "マウス", "keyboard": "キーボード",
                    "book": "本", "bottle": "ボトル", "backpack": "リュック", "cat": "猫", "dog": "犬",
                    "tv": "テレビ", "remote": "リモコン", "clock": "時計"
                };
                const displayName = jaNameMap[categoryName] || categoryName;

                // 枠を描画
                canvasCtx.strokeStyle = "#00FF00"; // 緑色
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeRect(box.originX, box.originY, box.width, box.height);

                // ラベル（背景付き）を描画
                canvasCtx.fillStyle = "#00FF00";
                canvasCtx.font = "20px sans-serif";
                const textWidth = canvasCtx.measureText(`${displayName} (${score}%)`).width;
                canvasCtx.fillRect(box.originX, box.originY - 30, textWidth + 10, 30);
                
                canvasCtx.fillStyle = "#000000"; // 文字色は黒
                canvasCtx.fillText(`${displayName} (${score}%)`, box.originX + 5, box.originY - 7);
            });
        }

        // 実行開始
        initializeObjectDetector();

    </script>
</body>
</html>
