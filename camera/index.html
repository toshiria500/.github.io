<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Object Detector</title>

    <style>
        body { font-family: sans-serif; margin: 0; text-align: center; background: #f0f0f0; }

        .video-container {
            position: relative;
            display: inline-block;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            border: 4px solid #333;
        }

        video {
            display: block;
            max-width: 100%;
            height: auto;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }

        .progress-box {
            width: 80%;
            max-width: 300px;
            background: #eee;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin: 15px;
            border: 1px solid #ddd;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #2ecc71;
            transition: width 0.1s;
        }

        #error-display {
            color: red;
            padding: 20px;
            display: none;
            white-space: pre-wrap;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="loading-overlay">
        <h2>AIをロード中...</h2>
        <div class="progress-box">
            <div id="progress-bar"></div>
        </div>
        <div id="size-info">モデルを準備しています...</div>
    </div>

    <div id="error-display"></div>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- MediaPipe（安定版） -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>

    <!-- あなたのスクリプト -->
    <script src="script.js" defer></script>

</body>
</html>
