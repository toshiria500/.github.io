<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Object Detector - MediaPipe</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; text-align: center; background-color: #eef2f3; color: #333; }
        h1 { margin-bottom: 10px; font-size: 1.8rem; }
        
        /* メインコンテナ */
        .video-container { position: relative; display: inline-block; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 5px solid #333; }
        video { display: block; max-width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* ロード画面（オーバーレイ） */
        #loading-overlay { position: fixed; inset: 0; background: #ffffff; display: flex; justify-content: center; align-items: center; z-index: 2000; flex-direction: column; }
        .progress-wrapper { width: 80%; max-width: 350px; background: #eee; border-radius: 20px; height: 15px; margin: 15px 0; overflow: hidden; border: 1px solid #ccc; }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.2s ease-out; }
        #size-info { font-size: 13px; color: #666; font-family: monospace; }
        
        /* エラー表示 */
        #error-display { color: #d32f2f; background: #ffebee; border: 2px solid #d32f2f; border-radius: 8px; padding: 15px; margin: 20px auto; max-width: 500px; display: none; text-align: left; font-size: 14px; }
        #status-msg { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <h2 id="load-status">AIエンジンをロード中...</h2>
        <div class="progress-wrapper"><div id="progress-bar"></div></div>
        <div id="size-info">0.0 MB / 0.0 MB (0%)</div>
    </div>

    <h1>AI物体検知カメラ</h1>
    <div id="error-display"></div>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="status-msg">待機中...</div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    
    <script src="script.js"></script>

</body>
</html>
