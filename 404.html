<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1220" />
    <title>404 — ページが見つかりません | トシリアのサイト</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/404.css" />
</head>

<body>
    <a class="skip-link" href="#main">本文へスキップ</a>

    <header class="site-header">
        <a class="logo" href="/" aria-label="トップページへ">toshiria's site</a>
    </header>

    <main id="main" class="not-found" aria-labelledby="title">
        <section class="error-card">
            <div class="error-code" aria-hidden="true">
                <span>404</span>
                <span class="error-orbit"></span>
            </div>

            <div class="error-content">
                <p class="eyebrow"><span aria-hidden="true"></span> ERROR / PAGE NOT FOUND</p>
                <h1 id="title">ページが見つかりません</h1>
                <p class="message">
                    お探しのページは移動したか、URLが変更された可能性があります。<br class="desktop-break" />
                    アドレスをご確認いただくか、サイト内を検索してみてください。
                </p>

                <form id="searchForm" class="search" role="search" aria-label="サイト内検索">
                    <label class="visually-hidden" for="q">検索キーワード</label>
                    <input id="q" name="q" type="search" placeholder="キーワードを入力" />
                    <button type="submit" aria-label="サイト内を検索">検索</button>
                </form>

                <nav class="links" aria-label="ページ移動">
                    <a href="/" class="home-link"><span aria-hidden="true">←</span> トップページへ戻る</a>
                    <a href="/about/about.html" class="text-link">このサイトについて</a>
                    <a href="/sitemap.xml" class="text-link">サイトマップ</a>
                </nav>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div>Copyright © toshiria 2025 - <span id="year"></span> All Rights Reserved.</div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        document.getElementById('searchForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const query = document.getElementById('q').value.trim();
            if (!query) {
                document.getElementById('q').focus();
                return;
            }

            const searchUrl = 'https://www.google.com/search?q=' +
                encodeURIComponent('site:toshiria500.f5.si ' + query);
            window.location.href = searchUrl;
        });
    </script>
</body>

</html>
