<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="音声認識で文字起こしするだけのサイト">
    <meta property="og:description" content="※マイクのアクセス許可が必要です。">
    <meta property="og:url" content="https://toshiria500.f5.si/mic">
    <meta property="og:image" content="https://toshiria500.f5.si/images/Ogp2.png"> 
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../css/theme.css">    
    
    <title>音声認識で文字起こしするだけのサイト</title>
    
    <style>
        /* レイアウト設定 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f7f6; 
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

        /* PCでの横幅制限 */
        main {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* 認識結果エリア */
        #result-area { 
            border: 2px solid #ddd; 
            padding: 25px; 
            min-height: 250px; 
            font-size: 1.25rem; 
            background: white; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: left;
            line-height: 1.8;
            word-break: break-all;
            white-space: pre-wrap; /* 改行を反映 */
        }

        /* ボタンのデザイン */
        #toggle-btn { 
            padding: 16px 45px; 
            font-size: 1.1rem; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 50px;
            transition: 0.3s; 
            color: white; 
            background-color: #4CAF50;
            margin-bottom: 10px;
            -webkit-tap-highlight-color: transparent; /* スマホのタップ枠を消す */
        }

        #toggle-btn.recording { 
            background-color: #f44336; 
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.4); 
        }
        
        .status { color: #888; margin-top: 10px; font-size: 0.85rem; }

        /* ダークモード対応 */
        @media (prefers-color-scheme: dark) {
            body { background-color: #1a1a1a; color: #e0e0e0; }
            #result-area { background-color: #2d2d2d; border-color: #444; color: #e0e0e0; }
            .status { color: #aaa; }
        }

        /* フッター */
        .site-footer {
            background-color: #333;
            color: #fff;
            padding: 25px 0;
            text-align: center;
            font-size: 0.9rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <main>
        <h2>音声認識で文字起こしするだけのサイト</h2>
        
        <button id="toggle-btn">音声認識を開始</button>
        <p class="status" id="status">ボタンを押すとマイクが起動します</p>
        
        <div id="result-area">ここに話した内容が表示されます...</div>
    </main>

    <footer class="site-footer">
        <div class="copyright">
            Copyright © toshiria 2025 - <span id="year"></span>
            All Rights Reserved.
        </div>
    </footer>

    <script>
        // 1. 年度を自動更新
        document.getElementById('year').textContent = new Date().getFullYear();

        // 2. 音声認識の設定
        const btn = document.getElementById('toggle-btn');
        const resultArea = document.getElementById('result-area');
        const statusText = document.getElementById('status');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            resultArea.innerText = "お使いのブラウザは音声認識に対応していません。Chromeでお試しください。";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            
            // 【重要】スマホの二重表示バグを殺すための設定
            recognition.interimResults = false; // 確定した時だけ表示する（これで重複しなくなる）
            recognition.continuous = true;     // 連続して認識を続ける

            let isRecording = false;
            let manualStop = false; 

            btn.onclick = () => {
                if (!isRecording) {
                    manualStop = false;
                    resultArea.innerText = ""; // 開始時にリセット
                    recognition.start();
                } else {
                    manualStop = true;
                    recognition.stop();
                }
            };

            recognition.onstart = () => {
                isRecording = true;
                btn.innerText = "録音を停止する";
                btn.classList.add('recording');
                statusText.innerText = "聴き取り中...（話し終えると文字が出ます）";
            };

            // 自動解除（強制終了）対策
            recognition.onend = () => {
                if (!manualStop && isRecording) {
                    // 通信断などで止まったら自動再開
                    recognition.start();
                } else {
                    isRecording = false;
                    btn.innerText = "音声認識を開始";
                    btn.classList.remove('recording');
                    statusText.innerText = "停止中";
                }
            };

            recognition.onresult = (event) => {
                let finalText = '';
                for (let i = 0; i < event.results.length; i++) {
                    finalText += event.results[i][0].transcript;
                }
                // 画面を最新の確定テキストで更新
                resultArea.innerText = finalText;
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    // 無音が続いた場合のエラーは無視して継続
                    return;
                }
                console.error("Error:", event.error);
            };
        }
    </script>
</body>
</html>
