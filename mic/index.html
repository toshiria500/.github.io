<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="音声認識で文字起こしするだけのサイト">
    <meta property="og:description" content="※マイクのアクセス許可が必要です。">
    <meta property="og:url" content="https://toshiria500.f5.si/mic">
    <meta property="og:image" content="https://toshiria500.f5.si/images/Ogp2.png"> 
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../css/theme.css">    
    
    <title>音声認識で文字起こしするだけのサイト</title>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; display: flex; flex-direction: column; min-height: 100vh;
            background-color: #f4f7f6; color: #333; transition: 0.3s;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #1a1a1a; color: #e0e0e0; }
            #result-area { background-color: #2d2d2d; border-color: #444; color: #e0e0e0; }
        }
        main { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; box-sizing: border-box; }
        
        #result-area { 
            border: 2px solid #ddd; padding: 25px; min-height: 250px; font-size: 1.25rem; 
            background: white; border-radius: 12px; text-align: left; line-height: 1.8; 
            word-break: break-all; white-space: pre-wrap;
        }

        #toggle-btn { 
            padding: 16px 45px; font-size: 1.1rem; font-weight: bold; cursor: pointer; 
            border: none; border-radius: 50px; color: white; background-color: #4CAF50;
            margin-bottom: 10px; -webkit-tap-highlight-color: transparent;
        }
        #toggle-btn.recording { background-color: #f44336; box-shadow: 0 0 15px rgba(244, 67, 54, 0.4); }
        
        .status { color: #888; margin-top: 10px; font-size: 0.85rem; }

        /* フッターのデザイン調整 */
        .site-footer {
            background-color: #333;
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            font-size: 0.85rem;
            margin-top: auto;
        }
        .privacy-note {
            max-width: 600px;
            margin: 0 auto 15px;
            color: #bbb;
            line-height: 1.5;
        }
        .copyright { opacity: 0.8; border-top: 1px solid #444; padding-top: 15px; }
    </style>
</head>
<body>

    <main>
        <h2>音声認識で文字起こし</h2>
        <button id="toggle-btn">音声認識を開始</button>
        <p class="status" id="status">ボタンを押すとマイクが起動します</p>
        <div id="result-area"></div>
    </main>

    <footer class="site-footer">
        <div class="privacy-note">
            【プライバシーについて】<br>
            入力された音声はリアルタイムで文字に変換されるのみで、当サイトのサーバーに保存されたり、第三者に提供されることはありません。
        </div>

        <div class="copyright">
            Copyright © toshiria 2025 - <span id="year"></span>
            All Rights Reserved.
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const btn = document.getElementById('toggle-btn');
        const resultArea = document.getElementById('result-area');
        const statusText = document.getElementById('status');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            resultArea.innerText = "非対応ブラウザです。";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true;
            recognition.continuous = true;

            let isRecording = false;
            let manualStop = false;
            let finalOutput = ""; 

            btn.onclick = () => {
                if (!isRecording) {
                    manualStop = false;
                    finalOutput = ""; 
                    resultArea.innerText = "";
                    recognition.start();
                } else {
                    manualStop = true;
                    recognition.stop();
                }
            };

            recognition.onstart = () => {
                isRecording = true;
                btn.innerText = "録音を停止する";
                btn.classList.add('recording');
                statusText.innerText = "聴き取り中...";
            };

            recognition.onend = () => {
                if (!manualStop && isRecording) {
                    recognition.start();
                } else {
                    isRecording = false;
                    btn.innerText = "音声認識を開始";
                    btn.classList.remove('recording');
                    statusText.innerText = "停止中";
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    let transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        // 重複チェックロジック（endsWith）
                        if (!finalOutput.endsWith(transcript)) {
                            finalOutput += transcript;
                        }
                    } else {
                        interimTranscript = transcript;
                    }
                }
                resultArea.innerText = finalOutput + interimTranscript;
            };
        }
    </script>
</body>
</html>
