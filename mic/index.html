<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声認識 - toshiria</title>
    <style>
        body { 
            font-family: sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh;
            background-color: #f4f7f6; color: #333; transition: 0.3s;
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #1a1a1a; color: #e0e0e0; }
            #result-area { background-color: #2d2d2d; border-color: #444; color: #e0e0e0; }
        }
        main { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 50px 20px; text-align: center; box-sizing: border-box; }
        #result-area { border: 2px solid #ddd; padding: 25px; min-height: 200px; font-size: 1.2rem; background: white; border-radius: 12px; text-align: left; line-height: 1.8; }
        #toggle-btn { padding: 16px 45px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; color: white; background-color: #4CAF50; margin-bottom: 10px; }
        #toggle-btn.recording { background-color: #f44336; }
        .site-footer { background-color: #333; color: #fff; padding: 25px 0; text-align: center; font-size: 0.9rem; margin-top: auto; }
    </style>
</head>
<body>

    <main>
        <h2>音声認識ツール</h2>
        <button id="toggle-btn">音声認識を開始</button>
        <div id="result-area">ここに話した内容が表示されます...</div>
    </main>

    <footer class="site-footer">
        <div class="copyright">
            Copyright © toshiria 2025 - <span id="year"></span>
            All Rights Reserved.
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const btn = document.getElementById('toggle-btn');
        const resultArea = document.getElementById('result-area');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            resultArea.innerText = "非対応ブラウザです。";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = true; 
            recognition.continuous = true;    

            let isRecording = false; 

            btn.onclick = () => {
                if (!isRecording) { recognition.start(); } 
                else { recognition.stop(); }
            };

            recognition.onstart = () => {
                isRecording = true;
                btn.innerText = "録音を停止する";
                btn.classList.add('recording');
            };

            recognition.onend = () => {
                isRecording = false;
                btn.innerText = "音声認識を開始";
                btn.classList.remove('recording');
            };

            // 【重要】スマホの二重表示バグ対策
            recognition.onresult = (event) => {
                let text = ''; 
                for (let i = 0; i < event.results.length; i++) {
                    text += event.results[i][0].transcript;
                }
                resultArea.innerText = text; // 常に最新の全体結果で上書き
            };
        }
    </script>
</body>
</html>
